# The sharded browser suite for candidate validation and the weekly main check.
#
# Shape (DDM-P0-T02, 2026-08-28; reshaped 2026-08-29 for the measured flake
# cluster, see below). Public-repo standard runners are 4 vCPU / 16 GB (the
# upgrade from 2-core completed Feb 2024, github.blog "Double the power for
# open source"); the one-worker-per-runner ceiling below was measured on a
# developer laptop and has never been re-tested on this hardware. The
# `workers` and `retries` inputs above let a branch dispatch of Validate
# sample that without touching production behavior (see tests/README.md for
# the adoption rule). Until that experiment reports back the lever stays
# more runners, never more workers per runner: each page is its own
# software-GL MapLibre context.
#
# Three Playwright projects fan out with `--shard=i/n` (Playwright slices
# each project's file-ordered test list into contiguous equal-count chunks),
# one worker per runner: `chromium` (general), `chromium-interaction` (the
# measured flake cluster; see INTERACTION_SPECS in playwright.config.ts), and
# `chromium-3d` (the Fire 3D specs, their own per-test budgets). Every shard
# builds and serves its own dist/, so no shard reads another's state.
#
# Counts, measured with `npx playwright test --list --project=<p>
# --shard=i/n` on 56dd46a (2026-08-29): chromium 763 tests over 4 shards
# (191/191/191/190; 778 tests in 101 files as of 2026-09-01, so about
# 195 per shard), chromium-interaction 42 tests over 2 shards (21/21),
# chromium-3d 32 tests over 2 shards (16/16). 3D moved from 3 shards to 2:
# the prior split ran 1.5 / 6.4 / 6.7 minutes per shard (one near-empty
# Node-level slice, two scene-build-bound slices), so dropping to 2 is
# time-neutral and pays for the interaction project's two runners, net one
# more shard job than before (8 total), still well inside the 20-job
# concurrency cap on a free public repo. Wall-clock timing for this new
# composition is this PR's own Validate run; re-fit these when the suite
# grows.
#
# Re-fit 2026-10-12 (owner): `chromium` had grown to about 1,630 tests and
# its four shards ran 23 to 27 minutes each against the 26-minute step
# budget below (one run was killed with 408 of 409 passed and none failed).
# It now runs over 8 shards. Run 38304871630 measured them at 6 to 15
# minutes each. The same run killed `chromium-3d` 2/2 on the step budget:
# 84 tests against the 32 its two shards were sized for, 19.9 minutes on
# main two days earlier. It now runs over 4 shards; 14 shard jobs in all,
# still inside the 20-job cap.

# Validate owns the required candidate proof. The weekly run catches regressions
# between landings. Keep concurrency in Validate so a schedule cannot cancel it.

name: Browser suite

on:
  # The ONLY schedule added on 2026-09-02. Every other cron in this
  # repository (verify-live daily, source-health, upstream-monitor) stays
  # snoozed through 2026-09-11 and is an owner decision, not this file's.
  # Weekly, not daily: the point is that a regression cannot outlive a
  # development window, not that it is caught within an hour.
  #
  # Monday 15:13 UTC. A scheduled run has no caller, so `inputs` is empty and
  # every use of it below falls back: the checkout takes the default branch
  # (main), the build stamp comes from github.sha and github.run_id, workers
  # stays 1 and retries stays the config's. A failed scheduled run fails here
  # and remains visible on the Actions page.
  schedule:
    - cron: '13 15 * * 1'
  workflow_call:
    inputs:
      build-sha:
        description: The commit the build marker must carry.
        required: true
        type: string
      build-nonce:
        description: The run-attributable nonce the build marker must carry.
        required: true
        type: string
      # Experiment inputs (R3, 2026-08-29). No new workflow: a workers=2 trial
      # or a retries=0 sample runs by dispatching Validate on a branch
      # (validate.yml plumbs matching workflow_dispatch inputs through to
      # this call). Both default to ordinary Validate behavior.
      workers:
        description: >-
          Playwright --workers value for every shard's runner. The
          one-worker-per-runner ceiling in playwright.config.ts was measured
          on a developer laptop and has never been re-tested on the public
          runner's 4 vCPU / 16 GB. Default '1' matches today's behavior.
        required: false
        type: string
        default: '1'
      retries:
        description: >-
          Playwright --retries override for every shard. Empty (the default)
          leaves retries to playwright.config.ts's own isCI setting; set it
          to sample a retry-zero run's true flake rate without editing the
          config.
        required: false
        type: string
        default: ''
      # Measure C (owner, 2026-10-19): a targeted run, dispatched through
      # validate.yml's `specs` input. Every shard keeps its slot and runs only
      # its slice of the named files, so a broad list still fans out; a file
      # lives in one project, so empty shards skip provisioning and execution.
      # The schedule never sets it.
      specs:
        description: >-
          Space-separated spec paths to run instead of the whole suite. Empty
          (the default) runs everything, as before.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # A targeted run whose named files belong to no matrix project (a file only
  # the measure project owns, say) would leave every shard green having run
  # nothing. Listing is cheap: no browser, no build.
  collect:
    name: Named specs collect tests
    if: ${{ inputs.specs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPECS: ${{ inputs.specs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install application dependencies
        run: npm ci

      # Without --pass-with-no-tests, zero listed tests is a non-zero exit.
      - name: Fail if the matrix would run zero tests
        run: |
          read -r -a files <<< "$SPECS"
          for spec in "${files[@]}"; do
            [[ "$spec" =~ ^tests/[A-Za-z0-9._-]+\.spec\.ts$ ]] || { echo "::error::$spec is not a tests/*.spec.ts path."; exit 1; }
          done
          npx playwright test --list --project=chromium --project=chromium-interaction --project=chromium-3d "${files[@]}"

  shard:
    name: ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-latest
    # The job budget covers a cache-miss browser install (10), the suite
    # step's retry envelope (35), and the summary and upload steps, so a
    # slow red shard still gets its report kept instead of being cancelled
    # without one.
    timeout-minutes: 50
    # Build identity (FE-22, 2026-08-28): the app stamps these two values on
    # <html> (vite.config.ts defines) and tests/helpers.ts gotoApp asserts
    # them on every boot it drives when they are set, so a shard proves it
    # exercised the build this run made. The Playwright webServer builds
    # dist inside this job, so the values must reach it here.
    #
    # The fallbacks are for the weekly scheduled run, which has no caller and
    # so no inputs: there github.sha is main's head and github.run_id is this
    # run, which is the same promise the callers make.
    env:
      DDM_BUILD_SHA: ${{ inputs.build-sha || github.sha }}
      DDM_BUILD_NONCE: ${{ inputs.build-nonce || github.run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: 1, total: 8 }
          - { project: chromium, shard: 2, total: 8 }
          - { project: chromium, shard: 3, total: 8 }
          - { project: chromium, shard: 4, total: 8 }
          - { project: chromium, shard: 5, total: 8 }
          - { project: chromium, shard: 6, total: 8 }
          - { project: chromium, shard: 7, total: 8 }
          - { project: chromium, shard: 8, total: 8 }
          - { project: chromium-interaction, shard: 1, total: 2 }
          - { project: chromium-interaction, shard: 2, total: 2 }
          - { project: chromium-3d, shard: 1, total: 4 }
          - { project: chromium-3d, shard: 2, total: 4 }
          - { project: chromium-3d, shard: 3, total: 4 }
          - { project: chromium-3d, shard: 4, total: 4 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install application dependencies
        run: npm ci

      # Targeted runs keep the matrix, but empty shards need no browser or build.
      # Collection errors fail this step; only a successful nonempty list runs.
      - name: Collect this shard's selected tests
        id: selection
        if: ${{ inputs.specs != '' }}
        env:
          WORKERS: ${{ inputs.workers || '1' }}
          RETRIES: ${{ inputs.retries }}
          SPECS: ${{ inputs.specs }}
        run: |
          [[ "$WORKERS" =~ ^[0-9]{1,2}$ ]] || { echo "::error::workers must be a small whole number."; exit 1; }
          [[ "$RETRIES" =~ ^[0-9]{0,2}$ ]] || { echo "::error::retries must be empty or a small whole number."; exit 1; }
          args=(test "--project=${{ matrix.project }}" "--shard=${{ matrix.shard }}/${{ matrix.total }}" "--workers=$WORKERS")
          if test -n "$RETRIES"; then args+=("--retries=$RETRIES"); fi
          if test -n "$SPECS"; then
            read -r -a files <<< "$SPECS"
            if test "${#files[@]}" -eq 0; then
              echo "::error::The specs input is blank. Dispatch with no specs for the full run."; exit 1
            fi
            for spec in "${files[@]}"; do
              [[ "$spec" =~ ^tests/[A-Za-z0-9._-]+\.spec\.ts$ ]] || { echo "::error::$spec is not a tests/*.spec.ts path."; exit 1; }
              test -f "$spec" || { echo "::error::No spec file $spec on this commit."; exit 1; }
            done
            args+=(--pass-with-no-tests "${files[@]}")
          fi
          npx playwright "${args[@]}" --list --reporter=json > "$RUNNER_TEMP/selected-tests.json" || exit $?
          node --input-type=module - "$RUNNER_TEMP/selected-tests.json" >> "$GITHUB_OUTPUT" <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(report.suites) || report.errors?.length) {
            throw new Error('Selected tests did not collect successfully.');
          }
          const hasTests = suites => suites.some(suite =>
            (suite.specs ?? []).some(spec => spec.tests.length > 0) || hasTests(suite.suites ?? []));
          console.log(`has-tests=${hasTests(report.suites)}`);
          NODE

      # DDM-P0-T01: browser provisioning is deterministic and cached. The
      # composite action documents the cache key and the miss and hit paths;
      # the deploy's live verification and the source-health probe use the
      # same action so every browser job provisions one way.
      - name: Provision Chromium
        if: ${{ inputs.specs == '' || steps.selection.outputs.has-tests == 'true' }}
        uses: ./.github/actions/playwright-chromium

      # One worker per runner (see playwright.config.ts on the software-GL
      # ceiling). Reporters come from the config: a named line per test,
      # GitHub annotations on failure, an HTML report, and a JSON report
      # for the summary below. Shard 7/8 passed in 22.4 minutes but exhausted
      # 26 minutes on another run while tests still passed (2026-10-17).
      # shortcut: 35 minutes absorbs runner variance; rebalance if it is exhausted again.
      - name: Run the browser shard
        id: suite
        if: ${{ inputs.specs == '' || steps.selection.outputs.has-tests == 'true' }}
        timeout-minutes: 35
        env:
          # Routed through env, like RETRIES_ARG below, rather than
          # interpolated directly into `run:`, so neither input's value is
          # spliced into the shell command line. The `|| '1'` is the
          # scheduled run's fallback: an empty WORKERS would make
          # `--workers=` an invalid argument rather than a default.
          WORKERS: ${{ inputs.workers || '1' }}
          # Empty on the weekly scheduled run too, and whenever the `retries`
          # experiment input (above) was not set: a plain Validate call leaves
          # this empty and
          # playwright.config.ts's own isCI retries setting governs, unchanged.
          RETRIES: ${{ inputs.retries }}
          # Empty unless a targeted run named files (the `specs` input); empty
          # on the schedule too, so the command below is today's exactly.
          SPECS: ${{ inputs.specs }}
        # Each input is checked, then the command is built as an array, so a
        # stray space cannot add arguments. A blank spec list would run the
        # whole suite under the targeted run's name, and a path that is not a
        # spec file (or does not exist) would match nothing, so both fail.
        # The selection step skips shards that own none of the named tests;
        # the `collect` job fails the run when no shard owns any.
        run: |
          [[ "$WORKERS" =~ ^[0-9]{1,2}$ ]] || { echo "::error::workers must be a small whole number."; exit 1; }
          [[ "$RETRIES" =~ ^[0-9]{0,2}$ ]] || { echo "::error::retries must be empty or a small whole number."; exit 1; }
          args=(test "--project=${{ matrix.project }}" "--shard=${{ matrix.shard }}/${{ matrix.total }}" "--workers=$WORKERS")
          if test -n "$RETRIES"; then args+=("--retries=$RETRIES"); fi
          if test -n "$SPECS"; then
            read -r -a files <<< "$SPECS"
            if test "${#files[@]}" -eq 0; then
              echo "::error::The specs input is blank. Dispatch with no specs for the full run."; exit 1
            fi
            for spec in "${files[@]}"; do
              [[ "$spec" =~ ^tests/[A-Za-z0-9._-]+\.spec\.ts$ ]] || { echo "::error::$spec is not a tests/*.spec.ts path."; exit 1; }
              test -f "$spec" || { echo "::error::No spec file $spec on this commit."; exit 1; }
            done
            args+=(--pass-with-no-tests "${files[@]}")
          fi
          npx playwright "${args[@]}"

      # DDM-P0-T06: name what happened. The job summary lists passed, failed,
      # flaky (passed only on retry), and skipped counts and the file:line of
      # every failed or flaky test, so the named-failure discipline (baseline
      # set versus after set) reads off the Actions page. The `flaky` output
      # gates the upload below.
      - name: Summarize the shard
        id: summary
        if: ${{ !cancelled() && (inputs.specs == '' || steps.selection.outputs.has-tests == 'true') }}
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }}
        run: node scripts/summarize-playwright-shard.mjs test-results/report.json >> "$GITHUB_STEP_SUMMARY"

      # Measurement channel (R1/R3, 2026-08-29): upload the raw JSON report
      # unconditionally, every shard, not only on failure or flake, so a real
      # duration profile exists to decide shard composition and worker counts
      # (there was none before this). It carries per-test title, file:line,
      # status, duration, and retry index, plus per-result stdout/stderr text
      # and an attachments list that today is always empty (traces and
      # screenshots are off in CI) -- no response bodies. (PR 39,
      # ci/t08-retention-flip-2026-08-29, proposes turning traces on for
      # retry 1 without screenshots; if that lands, this list gains a trace
      # reference for retried tests, still no response bodies, under that
      # PR's own guarantees.) This upload's cleanliness rests on the same
      # guarantee as DDM-P1-T08: every suite boot answers the sovereign
      # boundary queries from synthetic fixtures (PR 34), so no live
      # geometry ever reaches a test's stdout or the report JSON. Short
      # retention: this is a measurement artifact, not a diagnostic one.
      - name: Keep the JSON report for measurement
        if: ${{ !cancelled() && (inputs.specs == '' || steps.selection.outputs.has-tests == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-json-${{ matrix.project }}-${{ matrix.shard }}-of-${{ matrix.total }}
          path: test-results/report.json
          retention-days: 3
          if-no-files-found: ignore

      # Keep the HTML report (error text, ARIA error context, stdout and
      # stderr, timings) when the shard failed or passed only on retry, so a
      # red or flaky shard is diagnosable without rerunning it blind; a clean
      # shard uploads nothing.
      #
      # Since 2026-08-29 (DDM-P1-T08, owner ratified) the report ALSO embeds
      # the first-retry trace zips, because the HTML reporter copies every
      # attachment into `playwright-report/data/`. Those traces are PIXEL-FREE
      # by configuration (playwright.config.ts: `screenshots: false` inside
      # the CI trace object, `screenshot: off`, `video: off`, `sources:
      # false`), so no rendered map frame and no spec source text leaves this
      # job. Their response bodies are safe because every boot answers the
      # Census AIANNH and BIA AIAN-LAR queries from synthetic fixtures
      # (installBoundaryStubs, called by gotoApp in tests/helpers.ts, routed
      # on the browser CONTEXT so a popup inherits it), and
      # tests/boundary-stubs.spec.ts plus
      # tests/boundary-boot-inventory.test.mjs enforce that. Artifacts on this
      # PUBLIC repository are downloadable by any GitHub user, so retention
      # drops from seven days to three: same-day diagnosis, not a record.
      # Retention shortens exposure; it is not what makes the content safe.
      - name: Keep the failure or flaky report
        if: ${{ !cancelled() && (inputs.specs == '' || steps.selection.outputs.has-tests == 'true') && (steps.suite.outcome != 'success' || steps.summary.outputs.flaky != '0') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}-of-${{ matrix.total }}
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore

      # The raw `test-results/` tree beside the report: the pixel-free
      # first-retry trace zips at a predictable path, plus the JSON report the
      # summary step read. A SEPARATE artifact rather than a second `path:` on
      # the step above, so each artifact's name still describes its content:
      # the report is the readable one you open with
      # `npx playwright show-report`, this is the raw one you feed to
      # `npx playwright show-trace` or grep over, which is how the T08
      # acceptance check reads a retained trace. Same three-day retention and
      # the same guarantee as the report, for the same reason.
      - name: Keep the failure or flaky traces
        if: ${{ !cancelled() && (inputs.specs == '' || steps.selection.outputs.has-tests == 'true') && (steps.suite.outcome != 'success' || steps.summary.outputs.flaky != '0') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.shard }}-of-${{ matrix.total }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
