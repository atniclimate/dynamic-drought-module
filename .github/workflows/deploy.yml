# Build the Dynamic Drought Module (DDM) with Vite and deploy the
# resulting dist/ folder to GitHub Pages.
#
# Repository Settings > Pages must use GitHub Actions as its source. The
# deploy job waits on the deterministic gate AND the full sharded browser
# suite (browser-suite.yml, the same matrix Validate runs on the pull
# request), so a push to main cannot bypass shared-interface checks. Owner
# policy 2026-08-28: the merge commit is a commit Validate never saw, so it
# earns the whole proof, fanned out rather than serial (47 minutes on one
# runner before this shape). The proof of the live build (DDM-P0-T04 and
# DDM-P0-T08) lives in verify-live.yml: it runs on this workflow's
# completion, only when the run succeeded, in its own concurrency group,
# so a newer push here cannot cancel the receipt for the build still live,
# and again on a daily schedule and on demand, which is the path that
# catches a deploy here that failed or was cancelled and therefore raised
# no completion event to prove.

name: Build and deploy DDM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by job (2026-08-28 supply-chain audit): the build job runs
# the whole npm dependency tree and restores an Actions cache, so it must
# not hold a token that can mint a Pages OIDC token; only the deploy job
# gets `pages: write` and `id-token: write`, which deploy-pages needs to
# authenticate with the Pages OIDC issuer and write the deployment. The
# build job adds `pages: read` because configure-pages reads the site
# through GET /repos/{owner}/{repo}/pages.
permissions:
  contents: read

# Serialize deploys on a single "pages" group and cancel any superseded
# in-progress run. GitHub Pages serves "latest commit wins", so when
# several commits land in a burst there is no value in deploying the
# intermediate states; collapsing to the newest commit also avoids the
# back-to-back deployments that can trip the Pages backend into a
# transient "Deployment failed, try again later" (observed 2026-07-02 on
# a burst of docs commits). A superseded run reads as intentionally
# cancelled rather than emailing a failure, which `false` would do for
# every extra deploy it ran to completion.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    # Build identity (FE-22, 2026-08-28): the app stamps these two values on
    # <html> (vite.config.ts defines) so a browser run can prove WHICH build
    # it is exercising. The artifact uploaded here is the build the gate
    # produced; the browser shards rebuild with the same values as inputs
    # and assert the stamp on every boot (tests/helpers.ts), so every proof
    # in this run names the same nonce. The nonce is the run id alone: a
    # "re-run failed jobs" keeps the run id, reruns only the red shards, and
    # deploys the artifact this job already uploaded, so a run_attempt
    # suffix would make the shard proof and the deployed stamp diverge.
    env:
      DDM_BUILD_SHA: ${{ github.sha }}
      DDM_BUILD_NONCE: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TypeScript 7 is the native (Go) compiler; it installs a
      # per-platform binary (@typescript/typescript-linux-x64 on this
      # runner) as an optional dependency through npm ci and the lockfile.
      # This step proves the native binary resolved on the Linux runner
      # (not a stray global/editor compiler) before the build depends on
      # it.
      - name: Verify TypeScript compiler
        run: npm exec tsc -- --version

      - name: Run release gate
        run: npm run gate

      - name: Verify build output
        run: |
          ls -la dist
          test -f dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  browser:
    name: Browser suite
    uses: ./.github/workflows/browser-suite.yml
    with:
      build-sha: ${{ github.sha }}
      build-nonce: ${{ github.run_id }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Freshness gate (2026-08-28 review): a "re-run failed jobs" of an
      # OLD run keeps that run's commit and its already-uploaded artifact,
      # so without this check it could deploy a superseded build, cancel a
      # newer run in the pages concurrency group, and then verify green
      # against itself. A run whose commit is no longer the head of main is
      # obsolete and stops here without deploying.
      - name: Confirm this commit is still the head of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "::error::main is now $head; this run's ${{ github.sha }} is obsolete and will not be deployed."
            exit 1
          fi
          echo "main is still ${{ github.sha }}"
      # The Pages backend intermittently fails the status poll with an
      # upstream "Deployment failed, try again later" even though the build
      # and artifact are fine (observed 2026-07-02, twice). The manual remedy
      # (`gh run rerun <id> --failed`) succeeds immediately, so encode that
      # remedy here: one in-workflow retry after a short settle, with no
      # third-party retry action (the minimal-dependency posture). The live
      # site is never at risk; the prior deploy keeps serving throughout.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Wait before retrying the transient Pages failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy (retry after transient failure)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # The post-deploy proof is verify-live.yml (workflow_run on this
  # workflow's completion, success only, own concurrency group), so a
  # newer push to main cannot cancel the receipt for the build still
  # live. It expects this run's commit and run id in the live stamp.
  # A run of this workflow that fails or is cancelled raises no such
  # proof; the daily scheduled compare in the same workflow is what
  # notices that main is then ahead of the live build.
