# Build the Dynamic Drought Module (DDM) with Vite and deploy the
# resulting dist/ folder to GitHub Pages.
#
# Repository Settings > Pages must use GitHub Actions as its source. The
# deploy job waits on the deterministic gate. The full sharded browser
# suite (browser-suite.yml, the same matrix Validate runs on the pull
# request) still runs on every push, in parallel, but ADVISORY since
# 2026-09-01 (owner direction D-2): the merge commit's tree already passed
# that suite on the pull request and locally before the landing, so a shard
# flake must not hold a proven build out of Pages. That reverses the
# 2026-08-28 policy, which was written when landings were frequent and
# small; it was observed costing a deploy on run 33597030766, where a
# comment-only change to three YAML files was blocked by one interaction
# shard. The pull request's Validate remains the binding gate.
#
# Advisory is not silent (report 18 section 6, 2026-09-02): the
# `browser-report` job below turns a red advisory shard into ONE
# marker-matched issue, closed by the next green suite, so a regression that
# lands on main cannot go unnoticed until the next landing. browser-suite.yml
# also runs itself weekly against main for the same reason.
#
# The proof of the live build (DDM-P0-T04 and DDM-P0-T08) lives in
# verify-live.yml: it runs on this workflow's completion, only when the run
# succeeded, in its own concurrency group, so a newer push here cannot
# cancel the receipt for the build still live, and on demand. The daily
# compare, the path that catches a deploy here that failed or was cancelled
# and therefore raised no completion event, is snoozed through 2026-09-11.

name: Build and deploy DDM to GitHub Pages

on:
  push:
    branches: [main]
    # A change that cannot reach dist/ leaves the live build correct, so the
    # pipeline has nothing to prove and this workflow does not run. Measured
    # cost avoided per docs push (run 33597030766, a YAML comment change):
    # the gate plus eight Playwright shards, about 38 job-minutes, plus a
    # Pages publish and a live proof of bytes that did not change.
    #
    # NOT '**/*.md': public/data/README.md, public/data/resources/README.md,
    # and public/fonts/README.md are copied into dist/ by Vite, so they are
    # part of the deployed tree and a change to one of them IS a deploy.
    # Only documentation that lives outside the build is listed here.
    #
    # NOTE for whoever restores the daily compare (verify-live.yml, after
    # 2026-09-11): after a paths-ignore push, main's head is deliberately
    # not the deployed sha, so the `undeployed` verdict will accuse a commit
    # that was correctly never deployed. Relax that verdict before the
    # schedule comes back. The post-deploy workflow_run path is unaffected:
    # it proves the sha its own deploy published.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'planning/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# Least privilege by job (2026-08-28 supply-chain audit): the build job runs
# the whole npm dependency tree and restores an Actions cache, so it must
# not hold a token that can mint a Pages OIDC token; only the deploy job
# gets `pages: write` and `id-token: write`, which deploy-pages needs to
# authenticate with the Pages OIDC issuer and write the deployment. The
# build job adds `pages: read` because configure-pages reads the site
# through GET /repos/{owner}/{repo}/pages.
permissions:
  contents: read

# Serialize deploys on a single "pages" group and cancel any superseded
# in-progress run. GitHub Pages serves "latest commit wins", so when
# several commits land in a burst there is no value in deploying the
# intermediate states; collapsing to the newest commit also avoids the
# back-to-back deployments that can trip the Pages backend into a
# transient "Deployment failed, try again later" (observed 2026-07-02 on
# a burst of docs commits). A superseded run reads as intentionally
# cancelled rather than emailing a failure, which `false` would do for
# every extra deploy it ran to completion.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    # Build identity (FE-22, 2026-08-28): the app stamps these two values on
    # <html> (vite.config.ts defines) so a browser run can prove WHICH build
    # it is exercising. The artifact uploaded here is the build the gate
    # produced; the browser shards rebuild with the same values as inputs
    # and assert the stamp on every boot (tests/helpers.ts), so every proof
    # in this run names the same nonce. The nonce is the run id alone: a
    # "re-run failed jobs" keeps the run id, reruns only the red shards, and
    # deploys the artifact this job already uploaded, so a run_attempt
    # suffix would make the shard proof and the deployed stamp diverge.
    env:
      DDM_BUILD_SHA: ${{ github.sha }}
      DDM_BUILD_NONCE: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TypeScript 7 is the native (Go) compiler; it installs a
      # per-platform binary (@typescript/typescript-linux-x64 on this
      # runner) as an optional dependency through npm ci and the lockfile.
      # This step proves the native binary resolved on the Linux runner
      # (not a stray global/editor compiler) before the build depends on
      # it.
      - name: Verify TypeScript compiler
        run: npm exec tsc -- --version

      - name: Run release gate
        run: npm run gate

      - name: Verify build output
        run: |
          ls -la dist
          test -f dist/index.html

      # DR-069 (2026-09-03): production builds publish no source maps while
      # GitHub Pages is the host. The gate above has already read them (the
      # activation gate proves each initial chunk's contents from that
      # chunk's .map), so this deletes them from the folder the upload step
      # below takes. It sits here, at the publication boundary, rather than
      # inside `npm run gate`, because the ruling is about what is published
      # and a local gate run should still leave a debuggable dist/. The
      # build emits the maps without a `sourceMappingURL` comment
      # (build.sourcemap 'hidden'), so nothing published points at one.
      - name: Remove source maps before publishing
        run: npm run strip:sourcemaps

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  browser:
    name: Browser suite (advisory)
    uses: ./.github/workflows/browser-suite.yml
    with:
      build-sha: ${{ github.sha }}
      build-nonce: ${{ github.run_id }}
      # Advisory here, binding on the pull request (owner direction D-2,
      # 2026-09-01). It still runs on every push, still summarizes, still
      # keeps a red shard's report and traces; it just does not fail the
      # job, so it can neither block the deploy below nor turn the run's
      # conclusion into `failure`, which would cost this deploy its
      # verify-live proof. See browser-suite.yml's `advisory` input.
      advisory: true

  # The witness the advisory suite was missing (report 18 section 6,
  # 2026-09-02). "CI is never a blocker" and "CI is never a witness" are
  # different claims and only the first was asked for: before this job, a
  # regression the suite catches and verify-live's checks do not could land
  # on main and produce no issue, no email and no red badge, and sit until
  # the next landing, which under one landing per window is weeks.
  #
  # One issue, found by its marker comment, exactly the mechanism
  # verify-live.yml uses for the live proof: opened on the first red push,
  # commented on every later red push, closed by the next green suite. Never
  # one per shard and never one per run. This job cannot fail the workflow's
  # deploy: `deploy` does not need it, and nothing here is evidence about
  # the bytes.
  #
  # It lives here rather than in browser-suite.yml because a reusable
  # workflow's permissions can only be maintained or reduced by its caller,
  # never elevated: a job requesting `issues: write` inside browser-suite.yml
  # would make validate.yml's call fail outright, and Validate is the one
  # binding gate. deploy.yml is a top-level workflow, so this job may hold
  # more than the workflow-level default, the same way `deploy` below holds
  # `pages: write`.
  browser-report:
    name: Route the browser suite result to one issue
    needs: [browser]
    # `!cancelled()`: a run superseded by the `pages` concurrency group must
    # not touch the issue either way, because it proved nothing. `push`
    # only: a hand dispatch is somebody watching the run.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Listing this run's own artifacts is GET
      # /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts, which the
      # fine-grained permission reference lists under Actions at read.
      actions: read
      issues: write
    steps:
      - name: Open, update, or close the browser-suite issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'browser-suite';
            const marker = '<!-- ddm-browser-suite -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Each shard that did not pass uploaded one marker artifact named
            // browser-suite-failure-<project>-<shard>-of-<total>
            // (browser-suite.yml). Counting those artifacts is the only
            // signal that survives BOTH `continue-on-error` (a step under it
            // reports a success conclusion, so neither the job result nor the
            // jobs API can tell an advisory failure from a pass) and matrix
            // output overwriting (a passing leg finishing last would erase a
            // failing leg's output).
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100 }
            );
            const failedShards = artifacts
              .filter((a) => a.name.startsWith('browser-suite-failure-'))
              .map((a) => a.name.slice('browser-suite-failure-'.length))
              .sort();
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            const existing = open.find((issue) => !issue.pull_request && (issue.body ?? '').includes(marker));
            if (failedShards.length === 0) {
              // A green suite closes the standing issue. `needs.browser`
              // reports success for an advisory call whatever the shards
              // did, so the artifacts, not that result, are what say the
              // suite was green.
              if (!existing) {
                core.info('The browser suite passed on main and no browser-suite issue is open.');
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `The browser suite passed on main at \`${context.sha}\` ([run ${context.runId}](${runUrl})). Closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
              core.info(`Closed browser-suite issue #${existing.number}.`);
              return;
            }
            const body = [
              marker,
              '## The browser suite failed on main',
              '',
              `Commit: \`${context.sha}\``,
              `Failed shards (${failedShards.length}): ${failedShards.map((s) => '`' + s + '`').join(', ')}`,
              '',
              'The suite is advisory on a push to main (owner direction D-2), so the deploy was not blocked and this run is green. The failing shard names its tests in its own job summary, and it kept its report and its pixel-free traces for three days.',
              '',
              `Run: ${runUrl}`,
              '',
              '_This issue closes automatically when a later push to main passes the same suite._'
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.info(`Commented on browser-suite issue #${existing.number}.`);
              return;
            }
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Browser suite failed on main',
              labels: [label],
              body
            });
            core.info(`Opened browser-suite issue #${created.data.number}.`);

  deploy:
    name: Deploy to GitHub Pages
    # `build` only (owner direction D-2, 2026-09-01). The identical tree
    # already passed the sharded suite on the pull request and locally
    # before the landing, and the live proof that follows boots the deployed
    # build six ways on the real site, which is stronger evidence than a
    # shard on a runner. The `browser` job above still runs, in parallel
    # now, and still annotates. What this gives up is the invariant that the
    # deployed sha itself was exercised by the suite before publishing.
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Freshness gate (2026-08-28 review): a "re-run failed jobs" of an
      # OLD run keeps that run's commit and its already-uploaded artifact,
      # so without this check it could deploy a superseded build, cancel a
      # newer run in the pages concurrency group, and then verify green
      # against itself. A run whose commit is no longer the head of main is
      # obsolete and stops here without deploying.
      - name: Confirm this commit is still the head of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "::error::main is now $head; this run's ${{ github.sha }} is obsolete and will not be deployed."
            exit 1
          fi
          echo "main is still ${{ github.sha }}"
      # The Pages backend intermittently fails the status poll with an
      # upstream "Deployment failed, try again later" even though the build
      # and artifact are fine (observed 2026-07-02, twice). The manual remedy
      # (`gh run rerun <id> --failed`) succeeds immediately, so encode that
      # remedy here: one in-workflow retry after a short settle, with no
      # third-party retry action (the minimal-dependency posture). The live
      # site is never at risk; the prior deploy keeps serving throughout.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Wait before retrying the transient Pages failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy (retry after transient failure)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # The post-deploy proof is verify-live.yml (workflow_run on this
  # workflow's completion, success only, own concurrency group), so a
  # newer push to main cannot cancel the receipt for the build still
  # live. It expects this run's commit and run id in the live stamp.
  # A run of this workflow that fails or is cancelled raises no such
  # proof; the scheduled compare in the same workflow is what notices that
  # main is then ahead of the live build, and it is snoozed through
  # 2026-09-11. That is the reason the browser suite above is advisory
  # rather than merely absent from `needs`: a failing job would make this
  # run's conclusion `failure`, and a deploy that really did publish would
  # then go unproved.
