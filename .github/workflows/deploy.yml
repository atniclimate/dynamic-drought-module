# Build the Dynamic Drought Module (DDM) with Vite and deploy the
# resulting dist/ folder to GitHub Pages.
#
# Repository Settings > Pages must use GitHub Actions as its source. The
# deploy job waits on the deterministic gate AND the full sharded browser
# suite (browser-suite.yml, the same matrix Validate runs on the pull
# request), so a push to main cannot bypass shared-interface checks. Owner
# policy 2026-08-28: the merge commit is a commit Validate never saw, so it
# earns the whole proof, fanned out rather than serial (47 minutes on one
# runner before this shape). The verify-live job below is the post-deploy
# proof (DDM-P0-T04 and DDM-P0-T08, 2026-08-28): it runs only after a
# successful deploy and proves the live site serves this commit.

name: Build and deploy DDM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by job (2026-08-28 supply-chain audit): the build job runs
# the whole npm dependency tree and restores an Actions cache, so it must
# not hold a token that can mint a Pages OIDC token; only the deploy job
# gets `pages: write` and `id-token: write`, which deploy-pages needs to
# authenticate with the Pages OIDC issuer and write the deployment. The
# build job adds `pages: read` because configure-pages reads the site
# through GET /repos/{owner}/{repo}/pages.
permissions:
  contents: read

# Serialize deploys on a single "pages" group and cancel any superseded
# in-progress run. GitHub Pages serves "latest commit wins", so when
# several commits land in a burst there is no value in deploying the
# intermediate states; collapsing to the newest commit also avoids the
# back-to-back deployments that can trip the Pages backend into a
# transient "Deployment failed, try again later" (observed 2026-07-02 on
# a burst of docs commits). A superseded run reads as intentionally
# cancelled rather than emailing a failure, which `false` would do for
# every extra deploy it ran to completion.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    # Build identity (FE-22, 2026-08-28): the app stamps these two values on
    # <html> (vite.config.ts defines) so a browser run can prove WHICH build
    # it is exercising. The artifact uploaded here is the build the gate
    # produced; the browser shards rebuild with the same values as inputs
    # and assert the stamp on every boot (tests/helpers.ts), so every proof
    # in this run names the same nonce. The nonce is the run id alone: a
    # "re-run failed jobs" keeps the run id, reruns only the red shards, and
    # deploys the artifact this job already uploaded, so a run_attempt
    # suffix would make the shard proof and the deployed stamp diverge.
    env:
      DDM_BUILD_SHA: ${{ github.sha }}
      DDM_BUILD_NONCE: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TypeScript 7 is the native (Go) compiler; it installs a
      # per-platform binary (@typescript/typescript-linux-x64 on this
      # runner) as an optional dependency through npm ci and the lockfile.
      # This step proves the native binary resolved on the Linux runner
      # (not a stray global/editor compiler) before the build depends on
      # it.
      - name: Verify TypeScript compiler
        run: npm exec tsc -- --version

      - name: Run release gate
        run: npm run gate

      - name: Verify build output
        run: |
          ls -la dist
          test -f dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  browser:
    name: Browser suite
    uses: ./.github/workflows/browser-suite.yml
    with:
      build-sha: ${{ github.sha }}
      build-nonce: ${{ github.run_id }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Freshness gate (2026-08-28 review): a "re-run failed jobs" of an
      # OLD run keeps that run's commit and its already-uploaded artifact,
      # so without this check it could deploy a superseded build, cancel a
      # newer run in the pages concurrency group, and then verify green
      # against itself. A run whose commit is no longer the head of main is
      # obsolete and stops here without deploying.
      - name: Confirm this commit is still the head of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "::error::main is now $head; this run's ${{ github.sha }} is obsolete and will not be deployed."
            exit 1
          fi
          echo "main is still ${{ github.sha }}"
      # The Pages backend intermittently fails the status poll with an
      # upstream "Deployment failed, try again later" even though the build
      # and artifact are fine (observed 2026-07-02, twice). The manual remedy
      # (`gh run rerun <id> --failed`) succeeds immediately, so encode that
      # remedy here: one in-workflow retry after a short settle, with no
      # third-party retry action (the minimal-dependency posture). The live
      # site is never at risk; the prior deploy keeps serving throughout.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Wait before retrying the transient Pages failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy (retry after transient failure)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # DDM-P0-T04 and DDM-P0-T08: prove the live build is the accepted commit.
  # Runs only after a successful deploy (a cancelled or superseded deploy
  # never reaches it, so it cannot mistake a cancellation for a release),
  # waits for Pages propagation (scripts/verify-live.mjs polls the
  # referenced assets for the SHA up to 5 minutes), then boots root, each
  # cluster, and the wildfire embed at two widths and reads the build stamp
  # and every layer pill. A failure opens or updates ONE issue labeled
  # deploy-divergence (marker comment; repeated failures append, never
  # duplicate) and the next verified deploy closes it. The receipt carries
  # URLs, status codes, bytes, milliseconds, and status words only, never a
  # body or a screenshot (hard rule 1; src/layers/aiannh.ts).
  #
  # Known gap (2026-08-28 review): the workflow's pages concurrency group
  # cancels this job when a newer push starts a deploy while it runs. The
  # newer run verifies its own deploy; if that newer run fails before its
  # deploy, the older commit stays live with no receipt. A verification
  # outside this concurrency group is a follow-up.
  verify-live:
    name: Verify the live build
    needs: [deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision Chromium
        uses: ./.github/actions/playwright-chromium

      # The deployed page URL comes from the deploy job; a rerun of only
      # this job can arrive without it, so the public seat is the fallback
      # rather than an empty --base.
      # Budget: up to 5 minutes of propagation polling, five range reads,
      # and six boots of up to about a minute each; the issue steps below
      # run even when this step times out.
      - name: Verify the live build
        id: verify
        timeout-minutes: 16
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set +e
          base="${PAGE_URL:-https://atniclimate.github.io/dynamic-drought-module/}"
          node scripts/verify-live.mjs \
            --base "$base" \
            --expect-sha "${{ github.sha }}" \
            --expect-nonce "${{ github.run_id }}" \
            --out live-receipt.json \
            --summary "$GITHUB_STEP_SUMMARY" 2>&1 | tee verify-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Keep the receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-receipt
          path: |
            live-receipt.json
            verify-output.txt
          retention-days: 30
          if-no-files-found: ignore

      # Freshness before recovery: closing the divergence issue is a claim
      # that main and live agree, so it is made only while this run's
      # commit is still the head of main.
      - name: Confirm this commit is still the head of main
        id: fresh
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "current=$([ "$head" = "${{ github.sha }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # One issue, found by its marker comment across every page of open
      # issues under the label. A verifier that timed out or crashed
      # (exit_code empty) still files, so a deployed build never goes
      # without a durable alert. A failure that is only the propagation
      # poll is worded as inconclusive rather than a proved divergence.
      - name: Open or update the divergence issue
        if: ${{ !cancelled() && steps.verify.outputs.exit_code != '0' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report = '';
            let receipt = null;
            try { report = fs.readFileSync('verify-output.txt', 'utf8'); } catch {}
            try { receipt = JSON.parse(fs.readFileSync('live-receipt.json', 'utf8')); } catch {}
            // Keep the issue body well under the API limit.
            const MAX = 20000;
            if (report.length > MAX) report = report.slice(-MAX);
            const label = 'deploy-divergence';
            const marker = '<!-- ddm-verify-live -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = receipt?.failed ?? [];
            const inconclusive = receipt?.inconclusive === true;
            const heading = receipt === null
              ? 'Live build verification did not complete after deploy'
              : inconclusive
                ? 'Live build verification inconclusive after deploy (propagation timeout)'
                : 'Live build verification failed after deploy';
            const explanation = receipt === null
              ? 'The verifier produced no receipt (it timed out or crashed), so the live build is unproved, not proved wrong.'
              : inconclusive
                ? 'The referenced scripts did not contain the deployed commit within the grace period. The Pages CDN may still be propagating, or a newer deploy superseded this one; the live build is unproved, not proved wrong.'
                : 'Either the live site still serves a previous build, a shipped asset or PMTiles range is not served, or a boot did not reach and hold terminal layer states.';
            const body = [
              marker,
              `## ${heading}`,
              '',
              `The Pages deploy for \`${context.sha}\` (run ${context.runId}) completed, but the post-deploy verification did not prove the live build.`,
              explanation,
              '',
              failed.length ? `Failed checks: ${failed.map((f) => '`' + f + '`').join(', ')}` : 'Failed checks: (no receipt)',
              '',
              `Verification run: ${runUrl}`,
              '',
              '```',
              report.trim() || '(no output captured)',
              '```',
              '',
              '_This issue closes automatically when a later deploy verifies green while its commit is the head of main._'
            ].join('\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            const existing = open.find((issue) => !issue.pull_request && (issue.body ?? '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Live build diverges from main after deploy',
                labels: [label],
                body
              });
            }

      - name: Close the divergence issue on a verified deploy
        if: ${{ !cancelled() && steps.verify.outputs.exit_code == '0' && steps.fresh.outputs.current == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'deploy-divergence';
            const marker = '<!-- ddm-verify-live -->';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            for (const issue of open) {
              if (issue.pull_request || !(issue.body ?? '').includes(marker)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `The deploy of \`${context.sha}\` (run ${context.runId}) verified green on the live site while that commit is the head of main. Closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Fail the run when the live build was not proved
        if: ${{ !cancelled() && steps.verify.outputs.exit_code != '0' }}
        run: |
          echo "::error::The live build was not proved to be ${{ github.sha }}; see the job summary and the deploy-divergence issue."
          exit 1
