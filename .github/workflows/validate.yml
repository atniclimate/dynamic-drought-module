# Deterministic pull-request validation. This workflow validates Worker source
# but never deploys the optional Worker; that remains an explicitly authorized
# manual operation from workers/proxy/.

name: Validate DDM

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Gate, Worker typecheck, and browser suite
    runs-on: ubuntu-latest
    # 45 was fitted to the pre-3D suite; the fire3d context layers'
    # ranged-tile traffic grew the serial browser step (20.9 minutes on a
    # fast local machine, 2026-08-18), and the first W-CTX validate run
    # spent its whole budget and was killed mid-suite. 75 keeps honest
    # room without masking a genuine hang for long.
    timeout-minutes: 75
    # Build identity (FE-22, 2026-08-28): the app stamps these two values on
    # <html> (vite.config.ts defines) so a browser run can prove WHICH build
    # it is exercising. Job-level because the gate builds dist and the
    # Playwright webServer builds it again; both must carry the same nonce.
    env:
      DDM_BUILD_SHA: ${{ github.sha }}
      DDM_BUILD_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/proxy/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Verify TypeScript compiler
        run: npm exec tsc -- --version

      - name: Run deterministic release gate
        run: npm run gate

      - name: Install Worker dependencies
        run: npm --prefix workers/proxy ci

      - name: Typecheck Worker without deploying
        run: npm --prefix workers/proxy run typecheck

      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium

      - name: Run serial browser verification
        run: npm run test:serial -- --reporter=dot
