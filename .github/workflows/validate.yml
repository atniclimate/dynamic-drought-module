# Deterministic pull-request validation. This workflow validates Worker source
# but never deploys the optional Worker; that remains an explicitly authorized
# manual operation from workers/proxy/.

name: Validate DDM

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Gate, Worker typecheck, and browser suite
    runs-on: ubuntu-latest
    # 45 was fitted to the pre-3D suite; the fire3d context layers'
    # ranged-tile traffic grew the serial browser step (20.9 minutes on a
    # fast local machine, 2026-08-18), and the first W-CTX validate run
    # spent its whole budget and was killed mid-suite. 75 keeps honest
    # room without masking a genuine hang for long.
    timeout-minutes: 75
    # Build identity (FE-22, 2026-08-28): the app stamps these two values on
    # <html> (vite.config.ts defines) so a browser run can prove WHICH build
    # it is exercising. Job-level because the gate builds dist and the
    # Playwright webServer builds it again; both must carry the same nonce.
    env:
      DDM_BUILD_SHA: ${{ github.sha }}
      DDM_BUILD_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/proxy/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Verify TypeScript compiler
        run: npm exec tsc -- --version

      - name: Run deterministic release gate
        run: npm run gate

      - name: Install Worker dependencies
        run: npm --prefix workers/proxy ci

      - name: Typecheck Worker without deploying
        run: npm --prefix workers/proxy run typecheck

      # DDM-P0-T01: browser provisioning is deterministic and cached. The
      # browser directory is keyed on the exact @playwright/test version, so a
      # Playwright bump misses once and rebuilds; every other run restores in
      # seconds instead of downloading Chromium (about 21 s on a good day, and
      # the step where the 2026-08-19 deploy stalled for its whole budget).
      # OS libraries are outside the cache: a miss installs them with the
      # browser, a hit reinstalls only them (apt, idempotent). Each step is
      # time-bounded so a stalled download fails fast with its own log.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser directory
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for browser verification (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Install Chromium OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Run serial browser verification
        run: npm run test:serial -- --reporter=dot
