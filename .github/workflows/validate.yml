# Deterministic pull-request validation. This workflow validates Worker source
# but never deploys the optional Worker; that remains an explicitly authorized
# manual operation from workers/proxy/.
#
# Shape (DDM-P0-T02, 2026-08-28): the deterministic gate and the browser
# suite are separate jobs so the suite can fan out across the shared runner
# matrix in browser-suite.yml (the same matrix the Pages deploy runs).
# `validate` is the single required status: it fails if any job fails.

name: Validate DDM

# A targeted run (the `specs` input below, 2026-10-19) must never be taken for
# a landing run. Empty or whitespace keeps GitHub's event-specific name (the
# pull request's title; the workflow name on a plain dispatch): the
# `run-name` entry of the workflow syntax reference.
run-name: >-
  ${{ inputs.specs != '' && format('Targeted browser run on {0}, not a landing run', github.ref_name) || '' }}

on:
  pull_request:
    # A pull request that touches only documentation outside the build has
    # nothing for the gate or the eight-shard suite to check, so it runs
    # neither. Same list, and the same reasoning, as deploy.yml: NOT
    # '**/*.md', because the three README files under public/ are copied
    # into dist/ by Vite and so are part of the shipped tree.
    #
    # Caveat for D-5 (branch protection): `main` has no ruleset today. If
    # `Validate` is ever made a REQUIRED status check, a pull request
    # skipped by this filter reports no status at all, and a required check
    # that never reports blocks the merge. Pair any such ruleset with a
    # skip-shaped stand-in, or drop this filter, before turning it on.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'planning/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      # Mirrors browser-suite.yml's workflow_call experiment inputs, defaults
      # identical, so a workers=2 trial or a retries=0 sample runs by
      # dispatching Validate on a branch (R3, 2026-08-29), never through
      # deploy.yml. A pull_request-triggered run leaves both unset and the
      # `browser` job below falls back to the same defaults.
      workers:
        description: >-
          Playwright --workers value for every shard's runner. Default '1'
          matches production behavior.
        required: false
        type: string
        default: '1'
      retries:
        description: >-
          Playwright --retries override for every shard. Empty (the default)
          leaves retries to playwright.config.ts's own isCI setting.
        required: false
        type: string
        default: ''
      # Measure C (owner, 2026-10-19): partway through a block, run only the
      # block's own specs (`npm run spec:impact -- --list`), about 5 minutes.
      # Only a run with this empty decides a landing.
      specs:
        description: >-
          Space-separated spec paths (tests/x.spec.ts). Empty (the default)
          runs the whole suite, the only run that counts for a landing.
        required: false
        type: string
        default: ''

permissions:
  contents: read

# A targeted run has its own group so it can never cancel a full run on the
# same branch, or be cancelled by one. On pull_request `inputs.specs` is null,
# so the group name is unchanged.
concurrency:
  group: validate-${{ github.ref }}${{ inputs.specs != '' && '-targeted' || '' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate and Worker typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Build identity (FE-22, 2026-08-28): the app stamps these two values on
    # <html> (vite.config.ts defines) so a browser run can prove WHICH build
    # it is exercising. The browser shards receive the same values as inputs.
    # The nonce is the run id alone: a "re-run failed jobs" keeps the run id
    # and reruns only the red shards, so their proof still names the build
    # the surviving jobs made (a run_attempt suffix would diverge there).
    env:
      DDM_BUILD_SHA: ${{ github.sha }}
      DDM_BUILD_NONCE: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/proxy/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Verify TypeScript compiler
        run: npm exec tsc -- --version

      - name: Run deterministic release gate
        run: npm run gate

      - name: Install Worker dependencies
        run: npm --prefix workers/proxy ci

      - name: Typecheck Worker without deploying
        run: npm --prefix workers/proxy run typecheck

      # DR-005 a: the Worker has its own package.json and lockfile, so the
      # root gate's dependency posture never covers it. Same command shape
      # as a plain `npm audit`; fails the gate on a reachable advisory.
      - name: Audit Worker dependencies
        run: npm --prefix workers/proxy audit

  # Owner, 2026-10-19: the weekly Dependabot Worker bumps change only
  # workers/proxy/, which the gate job's Worker typecheck and audit cover; the
  # browser suite says nothing about them, yet it turned them red whenever
  # main's own suite was red. A pull request whose every changed path is
  # under workers/proxy/ skips the browser job. A dispatch never asks.
  scope:
    name: Changed paths
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      worker-only: ${{ steps.paths.outputs.worker-only }}
    steps:
      # The pull_request checkout is the test merge commit, whose first
      # parent is the base: depth 2 holds both sides of the diff.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Decide whether only workers/proxy/ changed
        id: paths
        run: |
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          if test -s changed.txt && ! grep -qv '^workers/proxy/' changed.txt; then
            echo "worker-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker-only=false" >> "$GITHUB_OUTPUT"
          fi

  browser:
    name: Browser suite
    needs: scope
    # `!cancelled()` lets the suite run when `scope` is skipped (a dispatch)
    # or failed (no answer means run it).
    if: ${{ !cancelled() && needs.scope.outputs.worker-only != 'true' }}
    uses: ./.github/workflows/browser-suite.yml
    with:
      build-sha: ${{ github.sha }}
      build-nonce: ${{ github.run_id }}
      # `inputs` is empty on the pull_request trigger (no workflow_dispatch
      # in that event), so the `|| default` keeps a PR run identical to
      # today's behavior; a dispatched run can override either value.
      workers: ${{ inputs.workers || '1' }}
      retries: ${{ inputs.retries || '' }}
      specs: ${{ inputs.specs || '' }}

  # `!cancelled()` rather than `always()`: a run superseded by
  # `cancel-in-progress` must read as cancelled, not as a red Validate.
  validate:
    name: Validate
    needs: [gate, scope, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say that this is a targeted run
        if: ${{ inputs.specs != '' }}
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          echo "::notice::Targeted browser run of named specs only. Not a landing run: only a full Validate run (no specs) decides a landing."
          printf '### Targeted run, not a landing run\n\nOnly these spec files ran: %s\n\nA landing needs a full Validate run, dispatched with no specs.\n' "$SPECS" >> "$GITHUB_STEP_SUMMARY"

      - name: Require every job to have passed
        run: |
          echo "gate: ${{ needs.gate.result }}"
          echo "scope: ${{ needs.scope.result }} (worker-only: ${{ needs.scope.outputs.worker-only }})"
          echo "browser: ${{ needs.browser.result }}"
          test "${{ needs.gate.result }}" = "success"
          test "${{ needs.scope.result }}" != "failure"
          # A skipped suite passes only for a workers/proxy/-only pull request.
          if test "${{ needs.browser.result }}" = "skipped" && test "${{ needs.scope.outputs.worker-only }}" = "true"; then
            echo "browser: skipped, every changed path is under workers/proxy/"
          else
            test "${{ needs.browser.result }}" = "success"
          fi
