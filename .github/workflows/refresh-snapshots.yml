# Snapshot freshness automation: scheduled rebuild of the committed data
# snapshots so they never age into their staleness hedges unnoticed.
#
# Today this covers the El Nino / Southern Oscillation (ENSO) index snapshot
# (public/data/enso-indices.json, built by scripts/build-enso-snapshot.mjs).
# The impact briefing's long-range horizon starts hedging when the snapshot
# is more than 45 days old; a weekly rebuild keeps it far inside that window.
# Future committed snapshots (the landscape signature, USDM archive frames)
# join this workflow as they land.
#
# The workflow token's push does not recursively trigger another workflow.
# After a changed snapshot is pushed, this workflow explicitly dispatches the
# Pages workflow on main so the live embed receives the new artifact.

name: Refresh committed data snapshots

on:
  schedule:
    # Mondays 14:17 UTC.
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  # Raise a GitHub issue when a scheduled rebuild fails (critical-review #12).
  # A silent `build:enso` failure (a CPC ascii-table drift) or a suspended
  # workflow otherwise lets the snapshot age past its 45-day hedge unnoticed.
  # (The snapshot is indices-only since 2026-07-21, T-P0-1; the HTML
  # probabilities scrape was removed per the anti-scrape doctrine.)
  issues: write

jobs:
  refresh:
    name: Rebuild and commit snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the ENSO snapshot
        run: npm run build:enso

      # The shared consumer-contract check (2026-07-28 regression guard):
      # a snapshot the app would reject must never be committed, whatever
      # builder version produced it.
      - name: Validate the snapshot against the consumer contract
        run: npm run check:enso

      - name: Commit when the snapshot changed
        id: snapshot
        run: |
          if git diff --quiet public/data/enso-indices.json; then
            echo "Snapshot unchanged; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/enso-indices.json
          git commit -m "Refresh ENSO snapshot (scheduled)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Pages for the committed snapshot
        if: steps.snapshot.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });

      # Alert on any failure above (critical-review #12). Treat a red refresh as
      # a release blocker: the ENSO snapshot is aging toward its staleness hedge
      # and the impact briefing will start hedging its long-range horizon. The
      # issue auto-closes on the next successful refresh.
      - name: Open a refresh-failure issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'snapshot-refresh-failed';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: label
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: 'b60205',
                description: 'Scheduled committed-snapshot refresh failed'
              });
            }
            const marker = '<!-- ddm-snapshot-refresh -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Scheduled ENSO snapshot refresh failed',
              '',
              'The weekly rebuild of `public/data/enso-indices.json` did not complete.',
              'Left unfixed, the committed snapshot ages past its 45-day staleness hedge and',
              'the impact briefing begins hedging its long-range ENSO horizon.',
              '',
              `Failed run: ${runUrl}`,
              '',
              '_This issue auto-closes on the next successful refresh. Likely cause: a CPC',
              'ascii index-table drift in `scripts/build-enso-snapshot.mjs`, or a suspended workflow._'
            ].join('\n');
            // Find this workflow's own issue by its marker, not by position.
            // `listForRepo` returns pull requests too (a labeled pull request
            // would otherwise be commented on) and it pages, so an unpaginated
            // `data[0]` is whichever issue happened to sort first on page one.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 100
            });
            const existing = open.find((issue) => !issue.pull_request && (issue.body ?? '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'ENSO snapshot refresh failed', labels: [label], body
              });
            }

      # Close the refresh-failure issue after a successful run.
      - name: Close the refresh-failure issue on success
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'snapshot-refresh-failed';
            const marker = '<!-- ddm-snapshot-refresh -->';
            // Close every open issue this workflow raised, and nothing else:
            // a labeled pull request or a hand-filed issue under the same
            // label is not this workflow's to close.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 100
            });
            for (const issue of open) {
              if (issue.pull_request || !(issue.body ?? '').includes(marker)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'The scheduled ENSO snapshot refresh succeeded; closing.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed'
              });
            }
