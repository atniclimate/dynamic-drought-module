# Post-deploy proof of the live Pages build (DDM-P0-T04 and DDM-P0-T08).
#
# Runs when the Pages deploy workflow (deploy.yml) completes, and only when
# that run succeeded: a cancelled, superseded, or failed deploy never
# reaches this workflow, so it cannot mistake a cancellation for a
# release. It checks out the commit that run deployed, waits for Pages
# propagation (scripts/verify-live.mjs polls the referenced assets for the
# SHA up to 5 minutes), then boots root, each cluster, and the wildfire
# embed at two widths and reads the build stamp and every layer pill. A
# failure opens or updates ONE issue labeled deploy-divergence (marker
# comment; repeated failures append, never duplicate) and the next
# verified deploy closes it. The receipt carries URLs, status codes,
# bytes, milliseconds, and status words only, never a body or a
# screenshot (hard rule 1; src/layers/aiannh.ts).
#
# Why a separate workflow (2026-08-28 follow-up): as a job inside
# deploy.yml this proof sat in the deploy's `pages` concurrency group, so
# a newer push cancelled an in-flight verification; if that newer run
# then failed before its own deploy, the older commit stayed live with no
# receipt. Here the verification has its own job-level group: only a
# newer verification (which exists only because a newer deploy succeeded,
# and brings its own receipt) can supersede a running one. A newer push
# that fails before deploying cancels nothing.
#
# The expected commit and nonce come from the deploy run, not from this
# run: `workflow_run.head_sha` is the commit the deploy built and
# `workflow_run.id` is the nonce vite.config.ts stamped on <html>. The
# checkout is that same commit so the PMTiles range checks read the list
# of archives that build shipped. Residual gap: a deploy run cancelled
# during or just after deploy-pages reads as cancelled whether or not
# Pages published it, so it gets no receipt here; a scheduled compare of
# the live stamp against the last successful deploy would close that.

name: Verify the live build

on:
  workflow_run:
    workflows: ["Build and deploy DDM to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the live build
    # A workflow_run fires on every conclusion; only a successful deploy of
    # main is a release to prove.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    # One verification at a time; a newer one supersedes an older one. The
    # group is held at the JOB, not the workflow: a workflow-level group is
    # taken when the run is created, before the `if` above is evaluated, so
    # a failed or cancelled deploy would still spawn a run that cancels the
    # in-flight verification and then skips itself, which is the exact gap
    # this workflow closes. Only a job that runs enters a job-level group,
    # and the key below keeps any non-success event out of it regardless.
    # This group is deliberately NOT the deploy's `pages` group.
    concurrency:
      group: verify-live-${{ github.event.workflow_run.conclusion == 'success' && 'main' || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pages: read
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
      DEPLOY_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      # The deployed commit, not the default branch head this event was
      # raised against (they differ exactly when a newer push has landed).
      - name: Checkout the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision Chromium
        uses: ./.github/actions/playwright-chromium

      # The site URL comes from the Pages configuration (the same source
      # configure-pages reads); the public seat is the fallback rather
      # than an empty --base.
      - name: Resolve the Pages URL
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null || true)
          if [ -z "$url" ]; then
            url="https://atniclimate.github.io/dynamic-drought-module/"
            echo "Pages configuration unavailable; using the public seat $url"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Verifying $DEPLOY_SHA (deploy run $DEPLOY_RUN_ID) at $url"

      # Budget: up to 5 minutes of propagation polling, five range reads,
      # and six boots of up to about a minute each; the issue steps below
      # run even when this step times out.
      - name: Verify the live build
        id: verify
        timeout-minutes: 16
        run: |
          set +e
          node scripts/verify-live.mjs \
            --base "${{ steps.pages.outputs.url }}" \
            --expect-sha "$DEPLOY_SHA" \
            --expect-nonce "$DEPLOY_RUN_ID" \
            --out live-receipt.json \
            --summary "$GITHUB_STEP_SUMMARY" 2>&1 | tee verify-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Keep the receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-receipt
          path: |
            live-receipt.json
            verify-output.txt
          retention-days: 30
          if-no-files-found: ignore

      # Freshness before recovery: closing the divergence issue is a claim
      # that main and live agree, so it is made only while the deployed
      # commit is still the head of main.
      - name: Confirm the deployed commit is still the head of main
        id: fresh
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "current=$([ "$head" = "$DEPLOY_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # One issue, found by its marker comment across every page of open
      # issues under the label. A verifier that timed out or crashed
      # (exit_code empty) still files, so a deployed build never goes
      # without a durable alert. A failure that is only the propagation
      # poll is worded as inconclusive rather than a proved divergence.
      - name: Open or update the divergence issue
        if: ${{ !cancelled() && steps.verify.outputs.exit_code != '0' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report = '';
            let receipt = null;
            try { report = fs.readFileSync('verify-output.txt', 'utf8'); } catch {}
            try { receipt = JSON.parse(fs.readFileSync('live-receipt.json', 'utf8')); } catch {}
            // Keep the issue body well under the API limit.
            const MAX = 20000;
            if (report.length > MAX) report = report.slice(-MAX);
            const label = 'deploy-divergence';
            const marker = '<!-- ddm-verify-live -->';
            const deploySha = process.env.DEPLOY_SHA;
            const deployRunId = process.env.DEPLOY_RUN_ID;
            const deployRunUrl = process.env.DEPLOY_RUN_URL;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = receipt?.failed ?? [];
            const inconclusive = receipt?.inconclusive === true;
            const heading = receipt === null
              ? 'Live build verification did not complete after deploy'
              : inconclusive
                ? 'Live build verification inconclusive after deploy (propagation timeout)'
                : 'Live build verification failed after deploy';
            const explanation = receipt === null
              ? 'The verifier produced no receipt (it timed out or crashed), so the live build is unproved, not proved wrong.'
              : inconclusive
                ? 'The referenced scripts did not contain the deployed commit within the grace period. The Pages CDN may still be propagating, or a newer deploy superseded this one; the live build is unproved, not proved wrong.'
                : 'Either the live site still serves a previous build, a shipped asset or PMTiles range is not served, or a boot did not reach and hold terminal layer states.';
            const body = [
              marker,
              `## ${heading}`,
              '',
              `The Pages deploy for \`${deploySha}\` ([run ${deployRunId}](${deployRunUrl})) completed, but the post-deploy verification did not prove the live build.`,
              explanation,
              '',
              failed.length ? `Failed checks: ${failed.map((f) => '`' + f + '`').join(', ')}` : 'Failed checks: (no receipt)',
              '',
              `Verification run: ${runUrl}`,
              '',
              '```',
              report.trim() || '(no output captured)',
              '```',
              '',
              '_This issue closes automatically when a later deploy verifies green while its commit is the head of main._'
            ].join('\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            const existing = open.find((issue) => !issue.pull_request && (issue.body ?? '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Live build diverges from main after deploy',
                labels: [label],
                body
              });
            }

      - name: Close the divergence issue on a verified deploy
        if: ${{ !cancelled() && steps.verify.outputs.exit_code == '0' && steps.fresh.outputs.current == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'deploy-divergence';
            const marker = '<!-- ddm-verify-live -->';
            const deploySha = process.env.DEPLOY_SHA;
            const deployRunId = process.env.DEPLOY_RUN_ID;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            for (const issue of open) {
              if (issue.pull_request || !(issue.body ?? '').includes(marker)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `The deploy of \`${deploySha}\` (deploy run ${deployRunId}, verified by ${runUrl}) proved green on the live site while that commit is the head of main. Closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Fail the run when the live build was not proved
        if: ${{ !cancelled() && steps.verify.outputs.exit_code != '0' }}
        run: |
          echo "::error::The live build was not proved to be $DEPLOY_SHA (deploy run $DEPLOY_RUN_ID); see the job summary and the deploy-divergence issue."
          exit 1
