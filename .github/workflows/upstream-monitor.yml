# Scheduled upstream liveness monitor (critical-review #6 + operational-risk).
#
# The sharpest stewardship harm this product can cause is a silently dead
# runtime feed. The monitor labels every probe as runtime, build, or candidate.
# Runtime and build failures are actionable; unwired candidate failures remain
# visible warnings but cannot make this workflow red. Bounded checks whose
# digest-bound inputs are intentionally absent from the public checkout report
# an explicit SKIP instead of manufacturing a pass or failing on prerequisites.
#
# The client degrades a dead feed to an honest `unavailable` pill at fetch time,
# but a serverless embed cannot monitor endpoint death in the background. This
# workflow is the repo-side complement: it runs the drift monitor
# (scripts/check-upstream-drift.mjs, `npm run check:drift`) on a schedule and
# opens a GitHub issue when a runtime or build source persistently fails. Only a
# runtime row implies possible deployed impact; a build row threatens a future
# artifact refresh. The issue auto-closes on the next run with no blocking rows.
#
# What reds the run (CI-04, 2026-09-01): only a RUNTIME row. Build-tier and
# candidate rows open or update the issue and the run ends green. Before this,
# a build-tier `landscapeWhpDoi` timeout alone reddened 20 of the last 30 runs
# for a condition the workflow's own issue body describes as not proving
# deployed breakage, which made the loudest workflow the least actionable one.

name: Upstream liveness monitor

on:
  # SNOOZED through 2026-09-11 (owner direction, 2026-08-31): scheduled
  # probes are off during the active development window because their
  # alerts were disrupting flow; workflow_dispatch stays live for hand
  # checks. RESTORE by uncommenting the block below after 2026-09-11,
  # before the Convention. No green no-op replaces the schedule: a run
  # that checks nothing must not exist as a receipt.
  # schedule:
  #   # Daily at 13:07 UTC (early morning Pacific), before the workday. Not on
  #   # the hour: GitHub's docs name the start of every hour as the highest
  #   # scheduled-workflow load, where a queued run can be delayed or dropped
  #   # (2026-08-29); an odd minute avoids that slot. Runs before source-health
  #   # (13:41 UTC) so a runtime/build drift alert lands first.
  #   - cron: '7 13 * * *'
  workflow_dispatch:

# Least privilege: read the tree, and write issues to raise the drift alert.
permissions:
  contents: read
  issues: write

# One monitor run at a time; never cancel an in-progress probe.
concurrency:
  group: upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Probe upstream liveness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-landscape.txt

      - name: Install dependencies
        run: npm ci

      - name: Install pinned landscape drift environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r scripts/requirements-landscape.txt

      # Probe once; if it reports drift, wait and probe again, and alert only
      # when the SECOND probe also fails. A single transient agency outage
      # (which the client already tolerates by showing "unavailable") then does
      # not open an issue; only a persistent failure does. The second probe's
      # output is what lands in the issue body.
      - name: Probe upstreams (with one transient-blip retry)
        id: drift
        shell: bash
        run: |
          set +e
          npm run check:drift 2>&1 | tee drift-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "First probe reported drift; re-checking after 60s to filter a transient blip..."
            sleep 60
            npm run check:drift 2>&1 | tee drift-output.txt
            code=${PIPESTATUS[0]}
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # CI-04 (2026-09-01): tier the failure, so the colour of the RUN
          # matches what the failure actually proves. `check:drift` exits 1
          # for any blocking row, runtime or build alike, and 20 of the last
          # 30 runs went red on a build-tier `landscapeWhpDoi` timeout on its
          # own. A build row threatens a future artifact refresh and, as the
          # issue body below says in as many words, does not prove deployed
          # breakage. That belongs in an issue, not in a red branch. Only a
          # runtime row, which can affect deployed embeds, reds the run.
          #
          # Counted off the probe's own rendered rows
          # (scripts/check-upstream-drift.mjs prints
          # `FAIL  [runtime  ]  <key>  <detail>` and a `Runtime failures`
          # summary line), so the shared script needs no change.
          runtime_failures=$(grep -cE '^FAIL  \[runtime' drift-output.txt)
          # A probe that never reached its own table tiered nothing. Treat
          # that as a runtime failure: a broken monitor must be loud, not
          # quietly green.
          if [ "$code" != "0" ] && ! grep -q 'probed endpoints answered\.' drift-output.txt; then
            runtime_failures=1
            echo "::warning::The drift probe exited $code without producing its tiered table; treating that as a runtime failure."
          fi
          echo "runtime_failures=${runtime_failures:-0}" >> "$GITHUB_OUTPUT"
          echo "Blocking exit code $code; runtime-tier failures: ${runtime_failures:-0}"
          exit 0

      - name: Open or update the drift alert issue
        if: steps.drift.outputs.exit_code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('drift-output.txt', 'utf8'); } catch {}
            // Keep the issue body well under the API limit.
            const MAX = 20000;
            if (report.length > MAX) report = report.slice(-MAX);
            const label = 'upstream-drift';
            const marker = '<!-- ddm-upstream-monitor -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Upstream liveness drift detected',
              '',
              'The scheduled upstream monitor found one or more blocking runtime or build-source failures',
              '(network error, timeout, HTTP status >= 400, or a failed source contract) on two consecutive probes.',
              'Rows marked `runtime` may affect deployed embeds and are the only rows that make this',
              'workflow run red. Rows marked `build` threaten a future artifact refresh but do not prove',
              'deployed breakage, so they open this issue and leave the run green. Unwired `candidate`',
              'failures are warnings only.',
              '',
              `Monitor run: ${runUrl}`,
              '',
              '```',
              report.trim() || '(no probe output captured)',
              '```',
              '',
              '_This issue auto-closes when no runtime or build-source failures remain. Review the tiered report before deciding whether a deployed fix or a build-pipeline repair is required._'
            ].join('\n');
            // Find this workflow's own issue by its marker, not by position.
            // `listForRepo` returns pull requests too (a labeled pull request
            // would otherwise be commented on) and it pages, so an unpaginated
            // `data[0]` is whichever issue happened to sort first on page one.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            const existing = open.find((issue) => !issue.pull_request && (issue.body ?? '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream liveness drift detected',
                labels: [label],
                body
              });
            }

      - name: Close the drift alert issue on recovery
        if: steps.drift.outputs.exit_code == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'upstream-drift';
            const marker = '<!-- ddm-upstream-monitor -->';
            // Close every open issue this workflow raised, and nothing else:
            // a labeled pull request or a hand-filed issue under the same
            // label is not this monitor's to close.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            for (const issue of open) {
              if (issue.pull_request || !(issue.body ?? '').includes(marker)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'All runnable runtime and build-source probes passed on the latest monitor run; candidate warnings and explicitly reported bounded-check skips, if any, are nonblocking. Closing.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      # Surface RUNTIME drift on the Actions tab after the issue is filed.
      # Candidate warnings never reddened the run; since CI-04 (2026-09-01)
      # build-tier rows do not either. A build row threatens a future
      # artifact refresh and does not prove deployed breakage, so the issue
      # above is the whole alert and this run ends green. Only a runtime
      # row, which can affect deployed embeds, fails here.
      - name: Fail the run when blocking runtime drift persists
        if: steps.drift.outputs.exit_code != '0' && steps.drift.outputs.runtime_failures != '0'
        run: |
          echo "::error::Runtime-tier upstream drift persisted across two probes; see the opened issue."
          exit 1

      - name: Record build-tier drift without failing the run
        if: steps.drift.outputs.exit_code != '0' && steps.drift.outputs.runtime_failures == '0'
        run: |
          {
            echo "## Build-source drift only; the run ends green"
            echo
            echo "One or more \`build\`-tier probes failed on two consecutive"
            echo "attempts. A build row threatens a future artifact refresh and does"
            echo "not prove deployed breakage, so the drift issue carries the detail"
            echo "and this run is not red. It will close itself on the next clean"
            echo "probe."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Build-source drift persisted across two probes; see the opened issue. No runtime-tier failure, so the run ends green."
