# Scheduled upstream liveness monitor (critical-review #6 + operational-risk).
#
# The sharpest stewardship harm this product can cause is a silently dead
# runtime feed. The monitor labels every probe as runtime, build, or candidate.
# Runtime and build failures are actionable; unwired candidate failures remain
# visible warnings but cannot make this workflow red. Bounded checks whose
# digest-bound inputs are intentionally absent from the public checkout report
# an explicit SKIP instead of manufacturing a pass or failing on prerequisites.
#
# The client degrades a dead feed to an honest `unavailable` pill at fetch time,
# but a serverless embed cannot monitor endpoint death in the background. This
# workflow is the repo-side complement: it runs the drift monitor
# (scripts/check-upstream-drift.mjs, `npm run check:drift`) on a schedule and
# opens a GitHub issue when a runtime or build source persistently fails. Only a
# runtime row implies possible deployed impact; a build row threatens a future
# artifact refresh. The issue auto-closes on the next run with no blocking rows.

name: Upstream liveness monitor

on:
  schedule:
    # Daily at 13:00 UTC (early morning Pacific), before the workday.
    - cron: '0 13 * * *'
  workflow_dispatch:

# Least privilege: read the tree, and write issues to raise the drift alert.
permissions:
  contents: read
  issues: write

# One monitor run at a time; never cancel an in-progress probe.
concurrency:
  group: upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Probe upstream liveness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-landscape.txt

      - name: Install dependencies
        run: npm ci

      - name: Install pinned landscape drift environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r scripts/requirements-landscape.txt

      # Probe once; if it reports drift, wait and probe again, and alert only
      # when the SECOND probe also fails. A single transient agency outage
      # (which the client already tolerates by showing "unavailable") then does
      # not open an issue; only a persistent failure does. The second probe's
      # output is what lands in the issue body.
      - name: Probe upstreams (with one transient-blip retry)
        id: drift
        shell: bash
        run: |
          set +e
          npm run check:drift 2>&1 | tee drift-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "First probe reported drift; re-checking after 60s to filter a transient blip..."
            sleep 60
            npm run check:drift 2>&1 | tee drift-output.txt
            code=${PIPESTATUS[0]}
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the drift alert issue
        if: steps.drift.outputs.exit_code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('drift-output.txt', 'utf8'); } catch {}
            // Keep the issue body well under the API limit.
            const MAX = 20000;
            if (report.length > MAX) report = report.slice(-MAX);
            const label = 'upstream-drift';
            const marker = '<!-- ddm-upstream-monitor -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Upstream liveness drift detected',
              '',
              'The scheduled upstream monitor found one or more blocking runtime or build-source failures',
              '(network error, timeout, HTTP status >= 400, or a failed source contract) on two consecutive probes.',
              'Rows marked `runtime` may affect deployed embeds. Rows marked `build` threaten a future',
              'artifact refresh but do not prove deployed breakage. Unwired `candidate` failures are warnings',
              'and do not make the run red.',
              '',
              `Monitor run: ${runUrl}`,
              '',
              '```',
              report.trim() || '(no probe output captured)',
              '```',
              '',
              '_This issue auto-closes when no runtime or build-source failures remain. Review the tiered report before deciding whether a deployed fix or a build-pipeline repair is required._'
            ].join('\n');
            // Find this workflow's own issue by its marker, not by position.
            // `listForRepo` returns pull requests too (a labeled pull request
            // would otherwise be commented on) and it pages, so an unpaginated
            // `data[0]` is whichever issue happened to sort first on page one.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            const existing = open.find((issue) => !issue.pull_request && (issue.body ?? '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream liveness drift detected',
                labels: [label],
                body
              });
            }

      - name: Close the drift alert issue on recovery
        if: steps.drift.outputs.exit_code == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'upstream-drift';
            const marker = '<!-- ddm-upstream-monitor -->';
            // Close every open issue this workflow raised, and nothing else:
            // a labeled pull request or a hand-filed issue under the same
            // label is not this monitor's to close.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            for (const issue of open) {
              if (issue.pull_request || !(issue.body ?? '').includes(marker)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'All runnable runtime and build-source probes passed on the latest monitor run; candidate warnings and explicitly reported bounded-check skips, if any, are nonblocking. Closing.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      # Surface blocking runtime or build drift on the Actions tab after the
      # issue is filed. Candidate-only warnings leave the run green.
      - name: Fail the run when blocking drift persists
        if: steps.drift.outputs.exit_code != '0'
        run: |
          echo "::error::Blocking runtime or build-source drift persisted across two probes; see the opened issue."
          exit 1
