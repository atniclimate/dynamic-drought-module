# Deterministic, cached Chromium provisioning for Playwright (DDM-P0-T01).
# Shared by the browser suite, the post-deploy live verification, and the
# scheduled source-health probe so every browser job provisions one way.
#
# The browser directory is keyed on the runner OS and architecture and the
# exact @playwright/test version (which fixes the Chromium revision), so a
# Playwright bump misses once and rebuilds; every other run restores in
# seconds instead of downloading Chromium (about 21 s on a good day, and the
# step where the 2026-08-19 deploy stalled for its whole budget). OS
# libraries are outside the cache: a miss installs them with the browser; a
# hit runs `playwright install chromium`, which is a no-op when the restored
# executable is present and a bounded re-download when the entry is
# partial, then reinstalls only the libraries. Composite steps cannot carry
# `timeout-minutes`, so each path is bounded as a whole with coreutils
# `timeout` (600 s, the same ten-minute envelope the inline steps had) and
# fails fast with its own log.
#
# Restore and save are separate steps, and only a non-pull-request run saves.
# A cache entry written from a pull request is scoped to that pull request's
# ref: no other pull request and not main can ever restore it, while every
# pull request can already read main's entry. Saving from pull requests
# therefore buys nothing and costs twice, spending the repository's 10 GB
# quota on write-only entries and evicting main's entry (least recently used)
# once the quota fills, which would make main itself miss and re-download
# Chromium. Pull requests still restore from main's entry, which is the only
# path that ever mattered.
#
# One deliberate behavior change comes with the split. `actions/cache` saves
# in a post step that runs only when the job succeeded, so a shard whose
# tests failed never persisted a browser directory it had just downloaded.
# The inline save below runs as soon as the install returns, so a failing
# suite no longer forces the next run to download Chromium again. The
# browser directory is complete and valid the moment `playwright install`
# exits zero; whether the suite that follows passes says nothing about it.
name: Playwright Chromium
description: Restore or install Playwright's Chromium with its OS dependencies.
outputs:
  cache-hit:
    description: Whether the browser directory was restored from cache.
    value: ${{ steps.playwright-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore the Playwright browser directory
      id: playwright-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

    - name: Install Chromium for browser verification (cache miss)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: timeout 600 npx playwright install --with-deps chromium

    # Only a run whose entry other runs can read: see the header note.
    - name: Save the Playwright browser directory (miss, outside a pull request)
      if: steps.playwright-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

    - name: Verify Chromium and install its OS dependencies (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: timeout 600 bash -c 'npx playwright install chromium && npx playwright install-deps chromium'
