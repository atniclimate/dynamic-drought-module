# Template: one entry for planning/references/register.yaml.
# Align the field set with an existing entry (cpc-nino34-weekly, added by S09,
# is the closest model) before pasting; the register is the authority on its
# own schema, this file is not. Keys are readable slugs; no DR-, FE-, EF-IB-
# or EF-MM- id is minted here.

__SLUG__:
  label: "__ISSUER__ __Name__"          # as the issuer titles the product
  issuer: "__ISSUER__"
  kind: index                           # index | page | product | dataset
  url: null                             # the product page; null until verified live
  machine_file: null                    # the file the builder fetches; null until verified
  base_period: null                     # as stated by the issuer
  units: null
  cadence: null                         # weekly | monthly | seasonal
  owned_by: null                        # DDM task id the source serves, once one exists
  used_in:                              # files that name it, once wired
    - scripts/build-enso-snapshot.mjs
    - src/impact/enso.ts
  decision_record: null                 # DR id once opened
  candidate_file: planning/references/candidates/__SLUG__.json
  last_checked: unchecked               # ISO date on the day of the live check
  http_status: null
  last_modified: null                   # Last-Modified header verbatim
  gap: true                             # true while url is null
  wired: false                          # true only when the snapshot block and claim have landed
  notes:
    - "Added as a candidate from the 2026-09-07 expansion proposal; not scheduled."
