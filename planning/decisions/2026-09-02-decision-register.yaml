            risk: an opt-in placed in front of a scene that may then fail
        recommendation: a
        rationale: >-
          The owner already ruled that mobile 3D waits on DDM-P2-T01, and a URL saying
          fire3d=true while the user is on the ENSO screen is an untrue description of the view.
        default_if_no_answer: any 721px viewport enters 3D unchecked and the parameter lingers
        status: decided
        decided: "2026-09-02"
        decision: >-
          a: width floor plus a capability probe with webglcontextlost handling; tablet allowed; landscape
          phone excluded; fire3d stripped on cluster change.
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
        owner_notes: >-
          Owner correction and expansion: the whole DDM map can be 3D. Three tiers: (1) 3D terrain is
          map-level (MapLibre terrain and globe projection, hillshade, camera pitch) across all four
          hazard views on capable devices; (2) volumetric smoke is the fire-specific additive layer, on by
          default in the fire view on a capable device; (3) the layer studio is the extensibility surface
          for user-added 3D layers on any view (snow depth over terrain, precipitation accumulation, heat
          dome profiles). The capability probe therefore gates 3D terrain at the map level, not only the
          fire scene: it tests WebGL2 context creation before committing to terrain, handles context loss
          with an honest message and a fallback to 2D (never a frozen viewport), and gives the tablet band
          a clean decision point (tablets enter terrain with a simplified tier: fewer terrain detail
          levels, reduced smoke particle count). Landscape phones stay excluded even at sufficient width
          (compressed viewport height, most constrained GPUs). The fire3d URL parameter controls whether
          volumetric smoke is active, not whether the map has terrain; terrain can persist across views,
          smoke is contextual to fire. The probe is the prerequisite for volumetric smoke and the
          foundation for map-wide 3D (DDM-P0-T03). Full text in the ruling source.
        widened_2026_09_02: >-
          Widened to answer ROADMAP gate DDM-D03 (Fire 3D after custom demotion) rather than splitting the
          gate: the automatic-exit rule is leaving the wildfire cluster (this ruling), and an honest
          custom demotion inside the Wildfire screen keeps the scene alive while a fire event layer
          remains, with the toggle as the direct off control. That is the current gate in
          src/map/fire3d.ts (header comment, lines 94 to 100) and it is under contract in
