        title: Does tablet get its own band
        question: >-
          All 38 media queries sit at 720 or 721 with a fixed 340px sidebar; the bottom dock
          computes to zero width between 721 and 804px with the briefing open, and the impact
          panel overlaps the sidebar below 780px. Does tablet get its own layout band, or is it
          a small desktop?
        source: ["06-interface.md item 2 (UI-01, UI-02, UI-03)"]
        blocks: ["UI-01", "UI-02", "UI-03", "tablet 3D under DR-025", "DR-037", "DR-038"]
        options:
          - key: a
            text: a real third band with a fluid sidebar width and a pointer-based 44px touch floor
            cost: L
            risk: a third layout to verify in every future change
          - key: b
            text: tablet stays desktop and only the two geometry collisions are fixed
            cost: M
            risk: touch targets of 24 to 38px stay on a device used by hand
        recommendation: a
        rationale: >-
          The charter names three user bases and the field-instrument doctrine treats touch
          targets as a core design input; a 721 to 1024 rule already landed in the wave, so the
          band is started rather than hypothetical.
