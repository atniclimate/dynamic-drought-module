        blocks: ["FIRE-01", "VP-14", "tablet 3D under DR-009"]
        options:
          - key: a
            text: width floor plus a capability probe with webglcontextlost handling, tablet allowed, landscape phone excluded, and fire3d stripped on cluster change
            cost: M
            risk: a probe can exclude a capable device
          - key: b
            text: width only, raised to a tablet floor, fire3d kept as a remembered preference
            cost: S
            risk: a GPU-poor device still enters the scene and can show an inert frame
