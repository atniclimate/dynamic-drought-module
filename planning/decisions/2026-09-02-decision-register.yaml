  - id: G3
    title: Impact Briefing structure and copy
    decisions:
      - id: DR-012
        title: Briefing structure, four by three or three by four
        question: >-
          Does the synthesized Impact Briefing become four hazard sections each with three
          horizons (twelve blocks), or three horizon sections each with four hazard rows?
        source: ["02-impact-briefing.md D2", "00-MASTER-FINDINGS.md section 3"]
        blocks: ["IB-02", "IB-03", "IB-04", "IB-05", "every cell of the four-hazard by three-horizon matrix", "DR-016"]
        options:
          - key: a
            text: four hazard sections by three horizons, matching the four hazard screens
            cost: M
            risk: a long scroll on a phone, which is the primary field shell
          - key: b
            text: three horizon sections by four hazard rows
            cost: M
            risk: a reader who came for one hazard reads three others
          - key: c
            text: hazard sections on desktop, horizon sections on the phone
            cost: L
            risk: two layouts to keep honest, and they will diverge
        recommendation: b
        rationale: >-
          The module is a field instrument used on a small screen with limited attention, and
          a horizon-led layout answers now, next and this season in about one screen height
          without repeating four headings.
        default_if_no_answer: the briefing keeps its uneven coverage and the matrix is never filled
        status: decided
        decided: "2026-09-02"
        decision: "b: Three horizon sections by four hazard rows; time-leading layout for the field instrument."
      - id: DR-013
        title: The briefing name on every door
        question: >-
          Confirm what the popup trigger, the sidebar region trigger, the index.html Brief
          door and the mobile at-hand kicker each say now that the rename is executed, and
          whether the in-panel per-hazard headings stay and a per-screen title such as
          WILDFIRE BRIEFING (owner annotation 1-7) is still wanted.
        source: ["02-impact-briefing.md D1", "08-docs-hygiene.md section 5 item 1 (DOC-03)", "11-minimap-and-popups.md MM-11"]
        blocks: ["eleven user-facing strings and two specs", "MM-11 the briefing door label"]
        options:
          - key: a
            text: one name on all four doors, per-hazard section headings kept inside the panel, no per-screen title
            cost: S
            risk: the 2026-08 annotation request goes unanswered
          - key: b
            text: as (a) plus the panel head names the active hazard when opened from a hazard screen
            cost: S
            risk: one panel carries two names across screenshots
        recommendation: a
        rationale: >-
          One name on every door is what makes four surfaces read as one panel, and the hazard
          is already visible in the section the panel opens on.
        default_if_no_answer: the doors keep whatever wording the rename left behind
        status: pending
        decided: null
        decision: null
        owner_leaning_2026_09_02: >-
          Parked, not decided. People have not called the briefing anything specific; no evidence to flip
          the default; leaning toward the recommended single name. Source:
          planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)
      - id: DR-014
        title: Rows whose source does not cover the selection
        question: >-
          When a selection falls outside the Pacific Northwest, should the ENSO row read
          unavailable or show a national-scale ENSO state with the regional tilt prose
          removed; and may the near-term heat claim fetch HeatRisk independently so it does
          not vanish when the map layer is off?
        source: ["02-impact-briefing.md D3 (IB-04)", "02-impact-briefing.md D4 (IB-05)"]
        blocks: ["IB-04", "IB-05", "the ENSO and Heat cells of the matrix"]
        options:
          - key: a
            text: national ENSO state with tilt prose removed, and heat fetches independently with its own status and stamp
            cost: M
            risk: two more requests per briefing open, both cancellable and time-bounded
          - key: b
            text: ENSO reads unavailable outside the Pacific Northwest, heat stays bound to the display
            cost: S
            risk: two of twelve cells are empty for most of the country
          - key: c
            text: national ENSO state, heat stays bound to the display
            cost: S
            risk: the heat row disappears on a layer toggle, which reads as a bug
        recommendation: a
        rationale: >-
          A published national ENSO state without regional tilt prose is the same claim at its
          true geography, and a briefing that changes content when a map layer is toggled is
          describing the map rather than the place.
        default_if_no_answer: the ENSO row keeps speaking for the Pacific Northwest everywhere, and heat vanishes when the layer is off
        status: decided
        decided: "2026-09-02"
        decision: >-
          a: outside the Pacific Northwest the ENSO row shows a national-scale ENSO state with the
          regional tilt prose removed (not unavailable); the near-term heat claim fetches HeatRisk
          independently with its own status and stamp so it does not vanish when the map layer is off. The
          briefing describes the place, not the map.
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
      - id: DR-015
        title: Where the overlap engine lives
        question: >-
          The Place Studio overlap engine sits in src/impact/. Does it stay there, or move to
          src/ui/island/?
        source: ["02-impact-briefing.md D6"]
        blocks: ["the briefing module boundary", "the eager-import review under DR-008"]
        options:
          - key: a
            text: move it to src/ui/island/
            cost: S
            risk: import churn across a few specs
          - key: b
            text: leave it where it is
            cost: S
            risk: src/impact keeps a consumer that is not a claim
        recommendation: a
        rationale: >-
          Keeping src/impact to claim construction makes the briefing dependency graph
          reviewable, which matters while the entry chunk sits near its line.
        default_if_no_answer: it stays where it is
        status: decided
        decided: "2026-09-02"
        decision: >-
          a: move the overlap engine from src/impact/ to src/ui/island/ while the briefing restructure has
          the files open.
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
        owner_notes: >-
          Owner UX vision (directional, not a build task; logged in docs/IDEAS.md as "Unified panel
          architecture, focus and return"): place studio, layer studio and briefing become one panel model
          that slides out from the left over a dimmed, blurred map on desktop and tablet, and fades in
          over a dark transparent screen on phones; the hazard mode buttons stay on the right in contrast
          colors so mode switching never requires dismissing a panel; the map is always the primary
          context and every panel is a temporary overlay that takes focus and returns it. This answers the
          Reuben Martinez briefing-drawer feedback and the three-observation studio instability pattern
          (planning/user-research/). The overlap engine's new home in src/ui/island/ should be designed
          with this panel architecture in mind.

  - id: G4
    title: Forecast uniformity and time
    decisions:
      - id: DR-016
        title: What near-term means across four screens
        question: >-
          Does near-term mean the same span on all four screens, or does the chip stay generic
          while each screen states its own span from validity.validLabel? The verified products
          do not align: Fire is Day 1 to 8, Heat Day 1 to 7, Drought Day 6 to 14, ENSO a weekly
          observation.
        source: ["04-time-and-forecasts.md D-2 (TIME-03)", "12-forecast-data-spec.md D-12-F (FSPEC-07)", "00-MASTER-FINDINGS.md section 3"]
        blocks: ["TIME-03", "the entire near-term row of the matrix", "DR-017", "DR-019", "DR-020"]
        options:
          - key: a
            text: generic chip wording with a per-screen valid label and stamp
            cost: M
            risk: two screens compared side by side show different spans under one chip word
          - key: b
            text: per-hazard chip labels naming each span
            cost: M
            risk: four different chip texts in one control row
          - key: c
            text: force one span on all four and drop products that do not fit
            cost: L
            risk: discards verified products and narrows what the app can say
        recommendation: a
        rationale: >-
          HorizonProduct.validity.validLabel exists precisely so the chip can be generic and the
          stamp specific, which keeps every claim at the issuer's own window.
        default_if_no_answer: drought's next seven days keeps showing the CPC monthly outlook
        status: decided
        decided: "2026-09-02"
        decision: "a: Generic chip wording (Near-term); each screen stamps its own validity window from HorizonProduct.validity.validLabel."
      - id: DR-017
        title: The horizon chip when two horizons share one recipe
        question: >-
          On Heat and ENSO the horizon chip is a no-op because the two recipes are identical.
          Should it be disabled with an honest reason, hidden for that hazard, or kept enabled
          and bound to a within-surface change such as the HeatRisk day band?
        source: ["04-time-and-forecasts.md D-1 (TIME-02)"]
        blocks: ["TIME-02", "uniform hazard screens", "DR-020"]
        options:
          - key: a
            text: enabled and bound to a real within-surface change where one exists, disabled with a stated reason where none does
            cost: M
            risk: one control behaves differently across screens
          - key: b
            text: disabled with an honest reason wherever the recipe repeats
            cost: S
            risk: two of four screens carry a dead control
          - key: c
            text: hidden on those hazards
            cost: S
            risk: the control row silhouette differs per screen, which is UI-14 again
        recommendation: a
        rationale: >-
          It is the only option that gives every hazard screen a working near-term and
          long-range register without inventing a product, and a disabled chip with a stated
          reason stays honest where nothing is published.
        default_if_no_answer: the chip silently does nothing on two of four screens
        status: pending
        decided: null
        decision: null
        owner_leaning_2026_09_02: >-
          Parked, not decided. No observation of anyone pressing the horizon chip. No evidence yet.
          Source: planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02
          22:38 PDT)
