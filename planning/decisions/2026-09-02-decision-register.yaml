          Safari floor ruling (packet Appendix C): target Safari AND Chrome/Chromium for Android, the two
          engines the DDM's audience carries. The Vite build target pins Safari 15.5 / iOS 15.5 (already
          ratified here) and also covers the Android Chrome of the same era (roughly Chrome 100 and later,
          Android devices from 2022 forward). Verification: apply for BrowserStack's open-source grant for
          one real-device check per release on both floors; the WebKit Playwright project on Ubuntu CI may
          be added as described in Appendix C, labeled "current WebKit regression, not the 15.5 floor",
          secondary to the real-device checks. The README states both floors: Safari 15.5+ and Chrome 100+
