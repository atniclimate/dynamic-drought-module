            studio-url-matrix.spec.ts -g "PLACE composes with Console view", chromium, workers=1),
            two holds, run by the orchestrator alone on a genuinely quiet machine with every other
            lane finished or idle-and-holding. 6 of 16 failed on bb5ab31; 5 of 16 failed on
            0a24fd3; **0 of 16 failed on 2efdb43** (hold 1 eight passed in 60.0s, hold 2 eight
            passed in 58.4s). The cold-start warm-up failures the reproduction recorded as
