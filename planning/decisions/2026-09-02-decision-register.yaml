  - id: G-session-2026-09-03
    title: Added by the 2026-09-03 implementation session (raised by execution, not by review)
    decisions:
      - id: DR-067
        title: How the Wildfire Hazard Potential ramp reaches the screen
        question: >-
          DR-063 ruled a black-to-white hazard ramp with transparency. Execution proved it cannot be
          drawn client-side, because both WHP surfaces are rendered by the issuer and MapLibre GL JS
          6.6.0 has no raster-color property, so no combination of the nine raster paint properties
          can reorder the issuer's baked colors into hazard order. Which production path carries the
          ramp, given that the flat layer and the 3D drape are produced separately?
        source:
        - "DR-063 implementation_2026_09_03 (Opus 5 subagent, branch map/dr-063-whp-ramp at 987c29d (was 68b33c1 before the attribution rewrite))"
        - "src/config/wildfire-presentation.ts WHP_DDM_RAMP_CONVENTION (applied: false)"
        - "src/layers/usfs-whp.ts buildImageTileTemplate (sends no renderingRule); src/layers/whp-3d.ts (PMTiles of the same bytes)"
        blocks:
        - DR-063 becoming visible to a user rather than recorded in source
        - the DR-022 fire-beside-fuel use case reading cleanly
        - "landing map/dr-063-whp-ramp as anything more than a recorded convention"
        options:
        - key: a
          text: recolor the regional PMTiles archive when it is baked, so the ramp applies to the 3D
            drape only
          cost: M
          risk: the flat 2D layer keeps the issuer palette, so the same hazard reads in two different
            color languages on two surfaces of the same product until the 2D path follows; a bake
            step also freezes the ramp into an artifact that must be rebuilt to change
        - key: b
          text: send a renderingRule to the issuer's ImageServer exportImage call and carry the new
            route through the Worker allowlist
          cost: M
          risk: adds Worker route policy work and a dependency on an issuer parameter the product
            does not control; the issuer may change or withdraw it, and a rule that fails must
            degrade to the issuer palette rather than to nothing
        - key: c
          text: leave the ramp recorded and unapplied, and solve perimeter legibility another way
            (DR-026 already asks about a heavier perimeter outline or halo)
          cost: S
          risk: the owner's design decision stays invisible; the observed problem (red perimeters
            vanishing inside an orange-red surface) persists
        recommendation: b
        rationale: Option b is the only path that keeps the flat map and the 3D drape speaking one
          color language, which is what makes a hazard ramp legible as a single product claim. The
          Worker is already an allowlisted CORS shim, so carrying one more issuer route is inside
          its existing role rather than a new capability. Option a is worth taking only if the
          issuer offers no rendering rule, and its cost is a divergence a reader can see.
        default_if_no_answer: the ramp stays recorded and unapplied on the branch; the surfaces keep
          the issuer palette and perimeters keep competing with it
        status: decided
        decided: "2026-09-03"
        ruling_source: planning/decisions/2026-09-03-launch-rulings.md
        decision: >-
          Option b, CONDITIONAL. The ramp reaches the screen by sending a rendering rule to the
          issuer's ImageServer exportImage call and carrying the new route through the Worker
          allowlist, so the flat layer and the 3D drape keep one color language. The owner attached
          one condition: a read-only probe must first prove the issuer's service accepts a rendering
          rule for this layer. If the probe failed, the ruling explicitly forbade falling through to
          option a; the finding was to be recorded, the entry left decided-but-unexecutable, and the
          ramp work stopped.
        probe_2026_09_03: >-
          The condition is MET. Lane R of the 2026-09-03 long run ran the probe read-only and
          reports EXECUTABLE. One exportImage request carrying a Colormap rendering rule over a
          50 km central-Oregon bbox returned HTTP 200, Content-Type image/png, 11407 bytes, with no
          error envelope; the envelope was checked explicitly rather than inferred from the status,
          because this host returns its envelopes as text/plain and two other endpoints did so the
          same day. The returned PNG decodes to exactly the seven colors the rule specified and none
          of the issuer's baked palette colors, so the service did not merely accept the rule, it
          applied it. Service metadata: no supportsRenderingRule key exists on this server version,
          whose flag is allowRasterFunction true and present, currentVersion 12; the only predefined
          raster functions are WHP_CLS_2023_8bit and None, so there is no predefined grey ramp;
          pixelType U8, bandCount 1, minValues [1], maxValues [7], serviceDataType
          esriImageServiceDataTypeThematic, hasColormap false, hasRasterAttributeTable false, NoData
          255. The DR-063 finding that the class colors are baked server-side is therefore true of
          the DEFAULT rendering only; the pixels underneath are plain integers 1 to 7, which is why
          a Colormap works and a Stretch would be meaningless. Evidence:
          planning/2026-09-03-long-run/logs/laneR-dr067-probe.md.
        worker_finding_2026_09_03: >-
          Option b needs NO Worker publish and NO allowlist change, which reverses the assumption
          that held this work back. EXACT_PATHS_BY_HOST in workers/proxy/src/index.ts keys on host
          plus exact URL.pathname, which excludes the query string, and adding renderingRule changes
          only the query. The upstream URL carrying the rule measures 565 characters against a
          MAX_UPSTREAM_URL_LENGTH of 2048. A read-only OPTIONS preflight through the LIVE Worker for
          the exact rule URL returned 204 No Content, not 403. Source and live WORKER_REVISION both
          read 2026-08-29-options-policy-v4, so the policy probed is the policy deployed.
        open_after_probe: >-
          The probe proves the COLOR half of the DR-063 ramp only. It does not prove the per-class
          ALPHA half: format=png returned 24-bit RGB with a single tRNS color key (253,253,253),
          which cannot carry five different alphas. Confirming the value-to-label binding is also
          outstanding. Both belong to the implementation session.
        status_2026_09_03: >-
          Decided and proven executable, NOT executed. The 2026-09-03 long run was authorized to
          land three branches and map/dr-063-whp-ramp was not among them, so the ramp stays on its
          branch at 987c29d. The stop condition was honored even though the reason given for it (a
          Worker publish) proved false, because lifting a stop condition on the orchestrator's own
          reading of the owner's reasoning is not the orchestrator's call. Whether the
          implementation is now authorized is a question in the owner's queue.
      - id: DR-068
        title: Water and Non-burnable on a lightness ramp
        question: Two of the issuer's WHP classes carry no hazard level, so a black-to-white hazard
          ramp has no honest position for them. How do Water and Non-burnable read?
        source:
        - "DR-063 implementation_2026_09_03: the agent chose the narrower reading and flagged it"
        - "src/config/wildfire-presentation.ts WHP_DDM_RAMP_CONVENTION"
        blocks:
        - the WHP legend reading honestly under DR-067's ramp
        options:
        - key: a
          text: draw nothing for either class and let the basemap answer
          cost: S
          risk: a reader cannot tell "no hazard level published" from "outside the product's
            coverage"; the legend must say which
        - key: b
          text: a distinct treatment outside the lightness sequence (a hatch, an outline, or a single
            reserved hue), named in the legend as carrying no hazard level
          cost: S
          risk: one more visual language on an already busy fire surface
        - key: c
          text: keep them on the ramp at their luminance positions
          cost: S
          risk: rejected on inspection; Non-burnable measures 0.88 luminance and would read as
            near-highest hazard, which is the opposite of true
        recommendation: b
        rationale: The classes are real issuer output and hiding them entirely loses the distinction
          between "nothing published here" and "not covered". A treatment that is visibly not part of
          the ramp, with the legend saying why, keeps the issuer's classes intact without letting
          them borrow a hazard reading they do not carry. Option c is unavailable.
        default_if_no_answer: the branch's current choice stands, which is off the ramp entirely with
          no distinct treatment yet
        status: decided
        decided: "2026-09-03"
        ruling_source: planning/decisions/2026-09-03-launch-rulings.md
        decision: >-
          Option b. Water and Non-burnable get a treatment visibly outside the lightness sequence,
          named in the legend as carrying no hazard level. Not drawn as nothing, and not placed on
          the ramp. The issuer's classes stay intact and stay the issuer's; only the treatment and
          the legend sentence are DDM's, and the legend must say plainly that these two classes
          carry no hazard rating rather than leaving a reader to infer it from their appearance.
        status_2026_09_03: >-
          Decided, not executed. It executes with DR-067, on the ramp branch, in a later session.
      - id: DR-069
        title: Production source maps while GitHub Pages is the host
        question: >-
          Gate DDM-D10 asks two things: the path from GitHub Pages to a local full-service server,
          and whether production source maps stay public in the meantime. DR-006 answers only the
          first. The second clause has never been decided by anyone; it is not a parked entry, it is
          an unrecorded question, and it is privacy-adjacent on a public repository.
        source:
        - "gate_drift_2026_09_03.unanswered_clause_found"
        - "docs/ROADMAP.yaml gate DDM-D10, whose transcribed answer covers the hosting half only"
        - "branch docs/roadmap-gate-transcription-2026-09-03 at 860c4b2, landed 2026-09-03 as 5be15f5"
        blocks:
        - DDM-P15-T01
        options:
        - key: a
          text: production builds publish no source maps while GitHub Pages is the host
          cost: S
          risk: a production stack trace is harder to read; the build's own output is the only
            debugging surface until the local server lands
        - key: b
          text: keep publishing source maps, on the argument that the repository is public anyway
          cost: S
          risk: a source map is not the same artifact as the repository; it hands a reader the exact
            built tree, including anything transient that never appears in a commit
        recommendation: a
        rationale: >-
          The repository being public is an argument about the source, not about the build. Until
          the local full-service server exists there is no host-side control over who fetches a map
          file, and nothing in the product needs one in production. It is cheap to reverse and
          expensive to have been wrong about.
        default_if_no_answer: whatever the current Vite configuration happens to emit, which nobody
          has checked
        status: decided
        decided: "2026-09-03"
        ruling_source: planning/decisions/2026-09-03-launch-rulings.md
        decision: >-
          Option a. Production builds publish no source maps while GitHub Pages is the host. If the
          current build emits any, remove them and record the reason in DEVELOPER.md. Revisit when
          the local full-service server lands.
        execution_note_2026_09_03: >-
          MEASURED, and it is not a one-line change. The build sets sourcemap true
          (vite.config.ts:67) and dist/ currently carries 85 .map files, every one of which is
          published to GitHub Pages today. But the activation gate READS them: the comment at
          vite.config.ts:69-75 says the gate "needs the import EDGES between chunks: sourcemaps
          prove what is folded INTO a chunk, the manifest proves what a chunk IMPORTS, and the gate
          needs both", and scripts/check-activation-budget.mjs:703 opens the chunk's .map by path.
          Its header at lines 23-26 treats an "evidence-empty sourcemap on a non-exempt initial
          chunk" as a failure. So setting sourcemap false would break npm run gate, and through it
          verify:quick, exactly as the config comment warns.
          The ruling is about what is PUBLISHED, not about what is generated, so the honest
          execution keeps generating maps for the gate and stops them reaching Pages: strip the .map
          files from dist/ after the gate has read them and before the Pages upload, or emit them
          outside the published tree. Whether Rolldown's sourcemap "hidden" mode helps is worth
          checking, but note that hidden only drops the sourceMappingURL comment; the files are
          still written and would still be uploaded unless removed. Whichever path is taken, the
          reason goes in DEVELOPER.md as the ruling requires, and the activation gate must still be
          green afterward.

  - id: G-session-2026-09-07
    title: Added by the 2026-09-07 S12 session (honest horizon chips, DDM-P8-T03)
    decisions:
      - id: DR-070
        title: One horizon-name source for the whole interface, and the observed/outlook claim tag
        question: >-
          Two open threads collided in DDM-P8-T03. First, src/config/clusters.ts:72-78 (S10,
          2026-09-07) explicitly reserved which horizon vocabulary wins: the shell's chips and the
          panel-foot response line read TEMPORAL_HORIZON_CHIP_LABELS ("Current" / "Weeks ahead" /
          "Season ahead"), while the briefing panel's headings read HORIZON_CHROME ("Current
          Conditions" / "Near Term" / "Long Range") for the same three horizons, so the same
          committed horizon read two different names at once (also DR-017's chip-wording question,
          04 D-1). Second, the acceptance's "forecast register visually distinct from its observed
          register" clause was unmet: every rendered claim carried its seven-way evidence badge but
          nothing told a reader, at a glance, whether a claim was already true or only expected.
        source:
        - "src/config/clusters.ts:72-78, the reserved-for-owner-ruling comment (S10, 2026-09-07)"
        - "docs/ROADMAP.yaml DDM-P8-T03 acceptance, and its needs_decision citing DR-017"
        - "planning/handoffs/2026-09-07-s10-horizon-chrome.md and
          2026-09-07-s11-enso-citations.md, both carrying the finding forward unresolved"
        blocks:
        - DDM-P8-T03
        - "DR-017 (the underlying chip-wording question this ruling answers for the shared-recipe
          case)"
        options:
        - key: a
          text: horizon-chrome.ts becomes the single horizon-name source for the whole interface
            (shell chips and the panel-foot line included); tag every rendered claim observed or
            outlook from its own evidence field, placed beside the source line
          cost: M
          risk: the shell's horizon chips grow from one line to a title-plus-subtitle pair, which
            widens the pill and needed a small CSS change
        - key: b
          text: leave the shell on its own chip table and the panel on horizon-chrome.ts,
            unreconciled, and add the observed/outlook tag only to the panel
          cost: S
          risk: the two-vocabulary collision this ruling exists to close stays open; a shared
            horizon still reads two names on two surfaces at once
        recommendation: a
        rationale: >-
          Option b treats the symptom the S12 prompt was written to fix as still acceptable. A
          single table every reader shares is the only way a horizon's name and a claim's register
          can both stop being surface-dependent.
        default_if_no_answer: the shell keeps "Weeks ahead" / "Season ahead" and no claim carries a
          register tag
        status: decided
        decided: "2026-09-07"
        ruling_source: "session S12 (owner prompt, rulings R1-R4), 2026-09-07; implemented in
          commit 2e3a8323e8e583c0c46aadedd46fb584a30f3efc on feature/horizon-chips-p8t03;
          planning/handoffs/2026-09-07-s12-honest-horizon-chips.md"
        decision: >-
          R1: horizon-chrome.ts (SHELL_HORIZON_KEY added) is the single source of horizon names for
          the whole interface; TEMPORAL_HORIZON_CHIP_LABELS is retired, shell.tsx and
          panel-response.tsx now read it. TEMPORAL_HORIZON_LABELS (the separate prose-cadence
          table) had zero production consumers and was removed outright rather than folded in, the
          smaller diff; tests/heat-h1-heatrisk.spec.ts:349 is re-pointed at HORIZON_CHROME.
          R3: every rendered claim carries exactly one observed/outlook text tag
          (CLAIM_REGISTER_TAG, src/impact/evidence.ts) derived from its evidence field: outlook
          renders outlook; analyzed and derived render observed (the DR-031 near-term ENSO claim is
          the case this was ruled for). classified, not named in R3, renders observed by the same
          reasoning its EVIDENCE_PRESENTATION tone already gives it. CELL_ABSENCE prose carries no
          tag (R4). Text only, existing tokens, no new color, no motion.
        amended_2026_09_08: >-
          Owner, via the S14 prompt (ruling R4), amended and not reopened: a HeatRisk claim in force
          is outlook register in the briefing as well as on the time bar. The issuer's own words
          (HeatRisk "provides a forecast of the potential level of risk ... over a 24-hour period",
          the DR-071 receipt) override the classified -> observed reading above for HeatRisk; the
          reasoning for classified stands for every other classified source. Implementation is
          routed to heat claims without the layer (DDM-P7-T05): the per-evidence or per-claim
          change in src/impact/evidence.ts or src/impact/sources.ts is that task's, and S14 touched
          no src/impact file. Until it lands, the bar says outlook and the briefing's HeatRisk claim
          still says observed; this amendment is the record that the bar is right.

  - id: G-session-2026-09-08
    title: Added by the 2026-09-08 S13 session (fire and heat time bar, DDM-P8-T02)
    decisions:
      - id: DR-071
        title: The time-bar stamp grammar, and what a fire or heat time step is allowed to claim
        question: >-
          DDM-P8-T02 gave the Wildfire and Extreme Heat screens a time bar for the first time, and
          the S12 handoff assigned it the stamp half of DDM-P8-T03 clause 2 ("every hazard surface
          states its time in one grammar"). Building it forced nine readings the acceptance sentence
          and the S13 doctrine ("an issuer outlook step is labelled as an outlook, in the issuer's
          own product terms; an observation step is not") do not settle by themselves: where the
          horizon words on a stamp come from; which register a HeatRisk day carries when its 24-hour
          period has not begun, is in progress, or has ended; what the NIFC current perimeters
          (which publish no product-level valid time) may say; which of two co-active event layers
          owns the bar when the wildfire current recipe has no surface at all; what the SPC Day 1
          outlook says on an issuance with no outlined area; what the static WHP raster says under
          the Long Range chip; what the heat screen says at the season-ahead horizon, whose recipe is
          deliberately empty; whether the embed chip carries the horizon; and which control drives
          a HeatRisk day change when three controls now exist.
        source:
        - "docs/ROADMAP.yaml DDM-P8-T02 acceptance (:322) and DDM-P8-T03 clause 2 (:328)"
        - "planning/handoffs/2026-09-07-s12-honest-horizon-chips.md:189-199 and :256-260, the stamp assignment"
        - "the S13 session prompt (owner, 2026-09-08): the doctrine block and the inherited item"
        - "src/config/clusters.ts:111-150, the wildfire and heat recipes (current wildfire has no surface; heat season-ahead is empty)"
        - "src/layers/heatrisk.ts:69-70, the issuer contract of seven 24-hour periods"
        - "seven ddm-science-verifier runs on 2026-09-08, all VERIFIED, receipts in planning/handoffs/2026-09-08-s13-fire-heat-time-bar.md"
        blocks:
        - DDM-P8-T02
        - "DDM-P8-T03 clause 2 (the stamp half)"
        options:
        - key: a
          text: >-
            R-a every stamp declares the horizon of the product it shows and the bar renders it from
            HORIZON_CHROME; R-b HeatRisk is one Near Term product at every frame (where the briefing's
            LANE_PLACEMENT already files it); a frame whose 24-hour period has not begun and the
            frame whose period is in progress are both outlooks in force, on the issuer's own
            words: HeatRisk "provides a forecast of the potential level of risk for heat-related
            impacts to occur over a 24-hour period", calculated "from the current date through
            seven days in the future" (HeatRisk v2.6 Overview PDF, wpc.ncep.noaa.gov/heatrisk/pdf/,
            2026-09-08; one verifier run also reported "HeatRisk values represent forecasted
            conditions, not current observations" on whatsinheatrisk.html and a second run could
            not re-find that exact sentence, so the PDF wording is the receipt); a period that has ended
            reads "Period ended" in the plain register, never outlook; R-c NIFC states that the product has
            no single valid time, and the event layer owns the bar only while no surface does,
            re-installing when a surface vacates it; R-d HMS smoke installs no stamp; R-e SPC Day 1
            is an outlook whose window is the issuance's own valid and expire, and an empty issuance
            says the response states no valid period; R-f WHP reads "static 2023 edition, not a
            dated condition" in plain typography with an explicit denial of outlook; R-g heat
            season-ahead keeps the WHEN row's "No dated product is displayed."; R-h the embed chip
            keeps mirroring the headline only; R-i the rail drives the same renderFrame the key's
            select and the dock sequence drive.
          cost: M
          risk: >-
            R-b makes the time bar and the briefing disagree for every HeatRisk frame in force: the
            bar says outlook, the briefing's claim for the same selected frame still carries
            DR-070's classified -> observed tag (src/impact/sources.ts:278, a DDM-P7-T03 file this
            session did not touch), and DR-070's own rationale for that tag ("an issuer's own
            classification of a currently valid state ... not a forecast") is contradicted by the
            issuer sentence quoted above. R-a makes the stamp and the pressed chip visibly disagree
            on the ENSO screen (Long Range chip, Current Conditions stamp) and on the heat screen
            (Current Conditions chip, Near Term stamp); that disagreement is the truth DR-017 is
            about and this ruling does not resolve DR-017. The heatrisk-days activation budget row
            moved 7.5 to 10.0 kB gzip (measured 9.5) because the shared time-bar chunk now enters
            that closure; the alternative, a nested import() to keep it out of the static closure,
            was rejected as dodging the gate rather than honoring it.
        - key: b
          text: >-
            read the committed timeline horizon onto every stamp instead of a product-declared one,
            and label every HeatRisk frame an outlook regardless of whether its period has begun
          cost: S
          risk: >-
            a custom display can commit a horizon its surface does not answer, so the stamp would
            describe the pressed chip rather than the map; an ended HeatRisk period presented as an
            outlook in force is the spent-forecast claim the doctrine forbids
        recommendation: a
        rationale: >-
          The stamp exists to describe the surface on the map. Only the owning layer knows what it
          is showing, and a period's relation to the clock is a fact about the product, not about
          the chip. Option a keeps every claim product-declared and lets the interface disagree
          with itself only where the map and the chip really do differ.
        default_if_no_answer: option a as built on feature/fire-heat-time-bar-p8t02
        status: decided
        decided: "2026-09-08"
        ruling_source: "owner, 2026-09-08, via the S14 prompt"
        decision: >-
          Ratified as written: option a, readings R-a to R-i as built on
          feature/fire-heat-time-bar-p8t02 and landed on main (0b62a4e, 96aba35). Reading R-b is
          affirmed: a HeatRisk frame is an outlook until its 24-hour period ends, and a period that
          has ended reads "Period ended" in the plain register. The register word stays "Outlook";
          no vocab-allow is added for the issuer's word "forecast". The heatrisk-days activation
          budget at 10.0 kB gzip (measured 9.5) is ratified. The first of the two owner items below
          is answered on DR-070 (amended_2026_09_08); the second is answered here.
        session_proposed_2026_09_08: >-
          Built as option a on feature/fire-heat-time-bar-p8t02 (commits 630df11, 67bef2e, a7bf1e2,
          7e931b9, b5a4fda, 0b62a4e; unpushed) by session S13, pending owner ratification; the
          handoff is planning/handoffs/2026-09-08-s13-fire-heat-time-bar.md. Two items need the
          owner's eye before the interface can be called consistent. First, R-b's outlook label on
          a HeatRisk frame in force beside DR-070's observed tag on the briefing claim for the same
          frame: the issuer's own words call every HeatRisk value a forecast, so DR-070's
          classified -> observed reading of HeatRisk is the half that now looks wrong, and
