  - id: G-session-2026-09-02
    title: Added by the 2026-09-02 evening decision session (owner addendum and user-research intake)
    decisions:
      - id: DR-063
        title: Wildfire Hazard Potential fuel-risk ramp and transparency
        question: The current WHP palette competes with the warm perimeter colors, so active perimeters
          are hard to see against the fuel-risk surface. What ramp and opacity should the static WHP
          context layer carry?
        source:
        - "planning/decisions/cc-prompt-decision-packet-2026-09-03.md Addendum (owner design decision)"
        - planning/user-research/2026-08-reuben-martinez-atni-energy.md (fuel beside perimeters)
        - DR-022 owner addition (fire-in-context-of-fuel-conditions is a priority use case)
        blocks:
        - the DR-022 fire-beside-fuel use case reading cleanly
        - DR-027 scope
        options:
        - key: a
          text: black (lowest fuel risk) to white (highest) with calibrated transparency so terrain,
            ridgelines, valleys and hydrography read through; perimeters stay warm (red and orange)
          cost: S
          risk: departs from the issuer-published WHP class palette; must be labeled a DDM presentation
            convention and keep the issuer's class breaks and labels
        - key: b
          text: keep the issuer palette and lower its opacity only
          cost: S
          risk: the colors still compete with perimeters
        recommendation: a
        rationale: White fuel risk against red and orange perimeters separates "where fuel risk is
          highest" from "where fire is burning" at a glance, and transparency keeps the topographic
          context that makes fuel risk spatially meaningful.
        default_if_no_answer: perimeters stay hard to read over the drape
        status: decided
        decided: "2026-09-02"
        decision: >-
          a, owner design decision: a black-to-white ramp with calibrated transparency that composes
          with both the terrain layer and the perimeter symbology. The class breaks, class labels and
          the legend's issuer attribution stay the issuer's; only the presentation ramp changes, and it
          is labeled a DDM presentation convention because the 2026-08-19 research chose the
          issuer-published palette. Deliverable for an Opus 5 subagent; sequenced after the MapLibre 6
          landing (inference by the session: the drape resampling is in the v6 blast radius, briefing
          section 6.6 step 8).
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
        implementation_2026_09_03: >-
          ATTEMPTED AND BLOCKED, by an Opus 5 subagent on branch map/dr-063-whp-ramp at 987c29d (was 68b33c1 before the attribution rewrite)
          (one commit on cd1d061, pushed, no pull request). The ruling above stands as a
          presentation decision; it cannot be executed client-side, and the blocker is proven
          rather than worked around. Both WHP surfaces are rendered by the issuer, not by this
          application: the flat usfs-whp layer pulls baked PNG tiles from the GeoPlatform
          ImageServer's exportImage, which bakes the class colors server-side, and the 3D drape
          reads a PMTiles archive of those same bytes. MapLibre GL JS 6.6.0 (style-spec 26.4.1)
          exposes nine raster paint properties and none of them is raster-color; the string does
          not appear anywhere in the shipped library. The nine that do exist compose to an affine
          map on RGB, so the only greys they can reach are the issuer colors' own luminance, which
          measures Very High 0.28, Water 0.38, Very Low 0.50, High 0.67, Non-burnable 0.88, Low
          0.89, Moderate 0.96: not hazard order in either direction. buildImageTileTemplate sends
          no renderingRule. What the branch therefore ships is the convention RECORDED, NOT
          APPLIED: WHP_DDM_RAMP_CONVENTION in src/config/wildfire-presentation.ts with
          `applied: false`, the five issuer labels untouched, even-lightness greys and alpha 0.30
          to 0.68, black at the lowest hazard (unambiguous in both the option text and the
          addendum); one new case in tests/wildfire-source-semantics.spec.ts pinning both the
          table and the fact that the map key still shows issuer swatches today; a re-verified and
          re-dated no-raster-recolor note in src/layers/whp-3d.ts; a paragraph in
          docs/design/fire3d-context.md; and the first bullet under Unreleased. Verified:
          typecheck, verify:quick twice, gate exit 0, 26 targeted cases green in 1.8 min,
          verify:smoke 86 in 3.6 min; no budget rebalanced; test:serial not run. Screenshots in
          the session scratchpad (dr063-whp-flat-2d.png, dr063-whp-fire3d.png) show the owner's
          case: bright red perimeters sit inside an orange-red WHP surface and nearly vanish. The
          3D basemap is dark, not light, so a black low end would sink into it; calibrate against
          that, not against a light sheet. TWO NEW QUESTIONS FOLLOW: DR-067 (how the ramp reaches
          the screen at all) and DR-068 (what the two non-hazard classes do on a lightness ramp).
          Neither is a presentation change, which is why the agent stopped instead of choosing.
      - id: DR-064
        title: Fire perimeter ribbon in the 3D scene
        question: In fire3d mode, how should the pulsing perimeter render against the terrain?
        source:
        - "planning/decisions/cc-prompt-decision-packet-2026-09-03.md Addendum (owner rendering specification)"
        - planning/user-research/2026-08-28-climate-working-group-tribal-liaisons.md (3D fire is the most requested demonstration)
        blocks:
        - the composed 3D fire scene (terrain, fuel surface, ribbon, smoke)
        options:
        - key: a
          text: a vertical ribbon, fully opaque at ground level, fading to transparent at the top on a
            logarithmic curve, low height proportional to view scale, pulsing along the edge
          cost: M
          risk: height and opacity need tuning on real terrain at several zooms
        - key: b
          text: keep the flat pulsing outline
          cost: S
          risk: the perimeter reads as a map line, not a fire line, in the tilted scene
        recommendation: a
        rationale: A low ribbon of light that is opaque where it touches the ground and fades upward
          reads as a fire line flickering at the landscape edge without photorealistic flame, and pairs
          with the smoke rising from within the perimeter above it.
        default_if_no_answer: the 3D scene keeps the flat outline
        status: decided
        decided: "2026-09-02"
        decision: >-
          a, owner rendering specification: opaque at the bottom where the perimeter meets the terrain;
          transparent at the top with a logarithmic fade (opacity drops quickly near the top, a
          flickering flame-like impression); not too tall, just enough vertical extent to stand off the
          terrain, height proportional to the view scale so it reads consistently across zooms; pulsing
          along the edge. Sequenced with the 3D work after the MapLibre 6 landing.
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
        implementation_2026_09_03: >-
          IMPLEMENTED AND VERIFIED, AWAITING A GO, by an Opus 5 subagent on branch
          map/dr-064-perimeter-ribbon at 4d49192 (was 95b5736 before the attribution rewrite) (one commit on cd1d061, pushed, no pull request).
          Each mapped perimeter rises into a low vertical ribbon: opaque at the ground, fading
          upward on a logarithmic curve through six stacked fill-extrusion slabs, because
          fill-extrusion-opacity is data-constant and MapLibre offers no vertical opacity gradient.
          Height is held constant on screen across zooms and the ribbon pulses on the perimeter
          layer's existing clock and color. Each ring becomes a thin band centered on the published
          edge, so the ribbon neither enlarges nor shrinks the perimeter; the half width derives
          from the WFIGS generalization tolerance and is recorded as a convention. Geometry comes
          from the same GeoJSON the flat layer already holds through GeoJSONSource.getData, so
          nothing new is fetched; the ribbon owns its own source, writes no layer status, and
          arrives on the layer's status-change seam when perimeters resolve after the scene does.
          New src/layers/nifc-perimeter-ribbon.ts; edits to src/config/fire3d-presentation.ts,
          src/map/fire3d.ts, src/layers/nifc-fires.ts (pulse targets), src/map/layer-order.ts
          (ribbon ids only), scripts/check-activation-budget.mjs, tests/fire3d-mode.spec.ts (five
          new cases), tests/map-harness.ts (fake geojson sources answer getData),
          tests/wildfire-source-semantics.spec.ts (the pulse assertion now filters the ribbon
          slabs, reason recorded in the spec), README.md, docs/design/fire3d-context.md, and the
          last bullet under Unreleased. src/config/wildfire-presentation.ts deliberately untouched,
          so the branch does not collide with DR-063's. Verified: typecheck; verify:quick;
          fire3d-mode 27 of 27 on chromium-3d in 3.7 min; NIFC plus three wildfire specs 29 of 29
          in 26 s; verify:smoke gate green plus 86 of 86 in 3.8 min, all under the port lock.
          Activation budget fire3d-mode 16.5 to 18.8 kB gzip (measured 18.1; a fourth dynamic root
          plus a larger shared presentation chunk), reason written into its row. AMBIGUITIES
          RESOLVED CONSERVATIVELY, say so if either is wrong: the flat outline stays visible under
          the ribbon rather than being hidden the way the smoke veil hides it, and only the pulsing
          WF and CX class is raised. FOUND BY LOOKING: MapLibre zoom math uses 512-pixel tiles, so
          the first ground-resolution constant drew every ribbon twice as tall; corrected, then
          tuned to 16 px. Screenshot dr064-ribbon-live-central-oregon.png in the session
          scratchpad shows 69 live perimeters over real terrain, with a deterministic twin beside
          it.
