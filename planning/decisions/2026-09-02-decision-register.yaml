      - id: DR-055
        title: Where the ignored working artifacts live
        question: >-
          Where should the gitignored working artifacts sit so the owner can find them in three
          months: the drafted hooks and installers now inside a dated deep-dive folder, and the
          science citation table that report 16B placed at planning/science/citations.md; and
          should that citation table be tracked and public instead, since a public citation table
          is arguably a product asset?
        source: ["16A-hooks-and-settings.md D-16A-6", "16B-skills-and-agents.md item 4", "13-enso-science-spec.md citation table", "14-drought-water-heat-science.md citation table"]
        blocks: ["the next session's orientation", "the ddm-cite workflow's output", "the defensibility record behind group G9"]
        options:
          - key: a
