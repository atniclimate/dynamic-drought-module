  - id: G9
    title: Science defensibility
    decisions:
      - id: DR-045
        title: The DSCI trend band
        question: >-
          The plus or minus 15 over 12 weeks DSCI trend band has no published basis, and the code
          compares 12 array positions rather than 12 weeks. State the delta and drop the word,
          keep a band split into an analyzed value plus a derived trend carrying a DDM-convention
          lineage, or drop the trend word entirely?
        source: ["14-drought-water-heat-science.md D-DWH-A (DWH-03)"]
        citations: ["14#8 DSCI trend band 15 over 12 weeks: no published threshold, NDMC says best practices are still evolving", "14#6 possible values of the DSCI are from 0 to 500", "14#7 the DSCI weighted-sum formula"]
        blocks: ["DWH-03", "the drought claim's defensibility"]
        options:
          - key: a
            text: state the delta in points against twelve weekly maps and drop the trend word, deriving the window from dates
            cost: S
            risk: the reader judges the change instead of being told a word
          - key: b
            text: keep a band, split into two claims, with the DDM convention stated in the lineage in so many words
            cost: S
            risk: an invented threshold stays, though labeled
          - key: c
            text: drop the trend word and keep the chart
            cost: S
            risk: loses a sentence some readers use
        recommendation: a
        rationale: >-
          NDMC calls the DSCI itself experimental and declines to publish a threshold, so an
          unattributed cut point carries more certainty than the issuer does; a stated delta says
          the same thing without inventing a class.
        default_if_no_answer: an invented threshold keeps driving a user-facing word on an analyzed claim
        status: decided
        decided: "2026-09-02"
        decision: "b as applied on the branch (a DDM-convention labeled band split into an analyzed value plus a derived trend, window derived from dates). Ratified by the owner instruction 'Merge to main' 2026-09-02 08:10 PDT, which ships the applied state."
      - id: DR-046
        title: The water-supply bands
        question: >-
          The 75, 90 and 110 percent-of-average cut points driving four causal sentences are DDM
          inventions; NWRFC publishes no categories and NRCS publishes seven bins. Adopt the NRCS
          seven-bin scale labeled as an NRCS scale applied to an NWRFC forecast, or drop the
          narrative bands and let the number and its stated uncertainty stand?
        source: ["14-drought-water-heat-science.md D-DWH-B (DWH-04)"]
        citations: ["14#18 NWRFC 75/90/110 bands: NWRFC publishes none, DDM convention", "14#19 NRCS percent-of-average bins, seven categories", "14#17 NWRFC 30 Year Average (1991-2020)"]
        blocks: ["DWH-04", "the water-supply claim's defensibility"]
        options:
          - key: a
            text: drop the narrative bands and keep the number with its existing uncertainty string
            cost: S
            risk: loses four sentences of interpretation
          - key: b
            text: adopt the NRCS seven bins, labeled as a cross-issuer borrow every time they appear
            cost: S
            risk: NRCS bins are built for NRCS forecasts against an NRCS median, so the borrow needs restating on every reading
        recommendation: a
        rationale: >-
          Today a 74 percent and a 20 percent forecast get the same sentence, which is the exact
          failure the bands were meant to prevent, and the claim already carries a strong
          uncertainty string.
        default_if_no_answer: three unattributed cut points keep generating four causal sentences
        status: decided
        decided: "2026-09-02"
        decision: >-
          a: drop the invented water-supply percent bands; keep the number and its uncertainty. Recorded
          as the packet Part 2 default; the owner accepted all twenty-one by id with no objection.
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
      - id: DR-047
        title: The DDM-authored causal sentences
        question: >-
          sources.ts line 669 still asserts that drought-dried soils amplify heat under evidence
          observed, which is the coupling ruling D-0.8.0-047 banned, and items 4, 5 and 7 of the
          briefing's Question 4 list are DDM-authored causal sentences with internal-doctrine
          lineage. Remove them, or relabel as derived pending citation?
        source: ["14-drought-water-heat-science.md D-DWH-C (DWH-07)", "02-impact-briefing.md D5"]
        citations: ["14#9 USDM impact summaries are no longer published nationally", "14 DWH-07 the banned coupling reappearing in a second file"]
        blocks: ["DWH-07", "the briefing's derived-claim credibility", "DR-058"]
        options:
          - key: a
            text: remove the heat-coupling sentence now and relabel the three briefing sentences as derived with an explicit lineage, pending citation
            cost: S
            risk: three sentences read thinner until they are cited
          - key: b
            text: remove all four
            cost: S
            risk: loses interpretation the owner may want back
          - key: c
            text: relabel all four as derived
            cost: S
            risk: keeps a sentence a prior ruling already banned
        recommendation: a
        rationale: >-
          The coupling was ruled out once and appearing in a second file does not make it new;
          the other three are not banned, only uncited, and derived with a lineage is exactly the
          contract for that.
        default_if_no_answer: a banned causal claim ships under evidence observed
        status: decided
        decided: "2026-09-02"
        decision: "a as applied on the branch (heat-coupling sentence removed; the three briefing sentences relabeled derived pending citation). Ratified by the owner instruction 'Merge to main' 2026-09-02 08:10 PDT, which ships the applied state."
      - id: DR-048
        title: The USDM impact strings
        question: >-
          The national Possible Impacts text the app's impact strings are adapted from is no
          longer published by NDMC, and the issuers have moved to state-specific impacts. Cite an
          archived version, relabel as derived, or route the reader to the NDMC State Impacts
          tool?
        source: ["14-drought-water-heat-science.md D-DWH-D (DWH-16)"]
        citations: ["14#9 USDM impact summaries, untraceable to a live page", "14#1 USDM D0 to D4 classification labels", "14#4 the USDM is not a forecast"]
        blocks: ["DWH-16", "the drought popup's defensibility"]
        options:
          - key: a
            text: relabel as derived with an archive citation and add a link to the NDMC State Impacts tool
            cost: S
            risk: two references where there was one
          - key: b
            text: remove the strings and link the tool
            cost: S
            risk: the popup loses its impact context
          - key: c
            text: keep as is
            cost: S
            risk: a claim cites a page that no longer says it
        recommendation: a
        rationale: >-
          The text is still useful and still traceable to a dated archived source; what it cannot
          claim is current national publication, and derived plus the live state tool says both
          truths.
        default_if_no_answer: the strings keep pointing at a page that no longer carries them
        status: decided
        decided: "2026-09-02"
        decision: >-
          a: relabel the Drought Monitor impact strings as derived with an archive citation; link the
          state impacts tool. Recorded as the packet Part 2 default; the owner accepted all twenty-one by
          id with no objection.
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
      - id: DR-049
        title: How far the gridded-index selector expands
        question: >-
          SPEI and EDDI are live on the ACIS prefix and eleven NIDIS tile products are verified
          with info.json valid dates, while three of the five shipped SPI windows are weeks to
          months stale with no date on screen. Does the selector stay SPI-only with dates read,
          become a two-axis selector by index family then window, or list everything flat?
        source: ["10-science-sources.md D-SCI-C (SCI-01)", "14-drought-water-heat-science.md D-DWH-E (DWH-01, DWH-02, DWH-11, DWH-12)"]
        citations: ["14#10 SPI, SPEI and EDDI standardized to the same 1991-2020 reference period", "14#13 EDDI definition and percentile bins", "14#11 info.json contains the valid date", "14#12 legend.png is an image of the map legend"]
        blocks: ["DWH-02 stale undated rasters", "DWH-12 hardcoded maxzoom", "the spi= URL parameter already landed"]
        options:
          - key: a
            text: read info.json first so the date and zoom limit are true, keeping SPI only for now
            cost: S
            risk: ten verified products stay unused
          - key: b
            text: two-axis selector, index family then window, on a fixed ACIS dataset, each product showing its own valid date and published legend
            cost: L
            risk: a larger surface that must stay dated and honest
          - key: c
            text: a flat list of everything
            cost: M
            risk: 297 entries is unusable
        recommendation: a
        rationale: >-
          The shipped selector currently serves rasters up to two months old with no date on
          screen, which is a correctness problem fixable today; the two-axis expansion is a
          bounded follow-on once dates and zoom limits are true.
        default_if_no_answer: the selector keeps serving stale rasters silently
        status: decided
        decided: "2026-09-02"
        decision: "a as applied on the branch (info.json read first for a true date and zoom limit; SPI only for now). Ratified by the owner instruction 'Merge to main' 2026-09-02 08:10 PDT; selector expansion (b) stays open as a later product item."
      - id: DR-050
        title: Completeness accounting on the two raster surfaces
        question: >-
          Adopting completeness accounting for gridded-index and sst-anomaly lets them say live
          (partial), and also makes an off-coverage pan say unavailable where it says live today.
          Is that the honest trade?
        source: ["01-architecture.md D4 (ARCH-04)", "14-drought-water-heat-science.md DWH-18"]
        blocks: ["ARCH-04", "the six-state invariant on two surfaces", "the CONUS-only coverage note"]
        options:
          - key: a
            text: adopt it on both surfaces
            cost: M
            risk: a user panning outside the coverage now sees unavailable where the map looked live
          - key: b
            text: adopt it on gridded-index only
            cost: M
            risk: the ocean surface keeps one state for two different situations
          - key: c
            text: no change
            cost: S
            risk: two surfaces keep saying live where they have no data
        recommendation: a
        rationale: >-
          Saying live outside a product's coverage broadens its geography, which the doctrine
          forbids; unavailable there is the true state and the six states exist to carry it.
        default_if_no_answer: two surfaces keep claiming live off their own coverage
        status: decided
        decided: "2026-09-02"
        decision: >-
          a: adopt the completeness sentence on gridded-index and sea-surface anomaly. Recorded as the
          packet Part 2 default; the owner accepted all twenty-one by id with no objection.
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"

  - id: G10
    title: Tests and evidence capture
    decisions:
      - id: DR-051
        title: What a local run does by default
        question: >-
          Should the fire3d evidence capture become opt-in locally, so a routine run stops
          fetching live Census AIANNH and BIA geometry and rewriting four review PNGs, and
          should local runs set DDM_BUILD_SHA and DDM_BUILD_NONCE so a run proves it booted the
          build just made?
        source: ["09-tests.md D-09-1 (TEST-04)", "09-tests.md D-09-2 (TEST-05)"]
        blocks: ["TEST-04 local runs are neither offline-safe nor idempotent", "TEST-05", "the local-first verification the posture depends on"]
        options:
          - key: a
            text: both, capture behind DDM_CAPTURE_EVIDENCE=1 and build identity asserted locally
            cost: S
            risk: build identity will red some currently green local runs, and a harness test asserts the capture guard's shape
          - key: b
            text: capture opt-in only
            cost: S
            risk: a green local run does not prove the boot matched the build
          - key: c
            text: neither
            cost: S
            risk: the routine loop keeps hitting federal endpoints and rewriting evidence
        recommendation: a
        rationale: >-
          Under CI as confirmation the local run is the proof, so it has to be repeatable and
          identity-checked; the capture stays available as a deliberate act, which is what the
          ratified waiver was for.
        default_if_no_answer: every local serial run fetches live boundaries and rewrites four PNGs
        status: decided
        decided: "2026-09-02"
        decision: >-
          a: evidence capture behind DDM_CAPTURE_EVIDENCE=1, and build identity asserted locally.
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
        owner_notes: >-
          Owner expansion: today's local run fetches live Census AIANNH and BIA AIAN-LAR geometry and
          rewrites four review images on every pass, so it is neither offline-safe nor idempotent (fails
          in the field, mixes re-fetch artifacts into diffs, and makes the fast path pay for the most
          expensive feature). Opt-in capture keeps routine verification clean and fast; when 3D evidence
          is needed (terrain mesh across views, perimeter extrusion, volume legend, volumetric smoke at
          target density, layer studio 3D layers) the flag triggers a deliberate capture pass. The flag is
          the natural gate for future evidence categories across all views (DR-025 expansion), never the
          routine loop. Build identity assertion proves a local run booted the build just made, which
          matters most during the MapLibre 6 migration.
      - id: DR-052
        title: The shape of the test suite
        question: >-
          What is the accepted local baseline for chromium-3d (two cases failed locally on
          budgets CI hid with a retry, and both now pass at 180 s), is the CI matrix worth
          rebalancing while chromium-3d owns a 10 to 12 minute critical path, and should the 292
          of 852 node-level tests move out of the suite that pays for a build?
        source: ["09-tests.md D-09-3 (TEST-01)", "09-tests.md D-09-4 (TEST-09)", "09-tests.md D-09-5 (TEST-07)"]
        blocks: ["the local ladder's credibility (verify:quick, verify:smoke, verify:fire, verify:full)", "the 50 to 55 minute serial run"]
        options:
          - key: a
            text: ratify the 180 s budgets, leave the CI matrix alone, and move the node-level tests into a browserless project run by verify:quick
            cost: M
            risk: relocating a third of the suite during the window
          - key: b
            text: ratify the budgets only
            cost: S
            risk: the fast rung keeps paying for a build it does not use
          - key: c
            text: drop chromium-3d from the routine loop and run it only before a push
            cost: S
            risk: a 3D regression is found late
        recommendation: a
        rationale: >-
          Local speed is the resource this posture actually spends, 34 percent of the suite needs
          no browser, and the raised budgets are already proven locally.
        default_if_no_answer: the fast rung keeps paying for a build and two 3D cases stay locally red
        status: decided
        decided: "2026-09-02"
        decision: >-
          b with guidance: ratify the 180 s budgets; add a verify:pure fast lane; do not do the 255-case
          pure migration (9 s saved). chromium-3d stays in the routine loop (7.8 min is the price of
          knowing the DDM's most important demonstration feature works).
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
        owner_notes: >-
          Owner guidance on verification: a longer build-and-verify sequence is acceptable to get the
          suite right; do not trade coverage for speed. For the MapLibre 6 migration use an Opus 5 agent
          swarm with task-specific skills (the 69 imports, the interaction handlers, setWorkerUrl are each
          bounded, verifiable tasks with their own gate). The sequence is typecheck clean, build clean,
          verify:pure, verify:quick, then full test:serial including chromium-3d; each step gates the next
          and a failure stops the sequence and reports.

