# Added 2026-09-03 15:20 on owner instruction, after the owner found that every
# commit in this PUBLIC repository carried a Co-Authored-By: Claude trailer and a
# Claude-Session URL and asked that they never appear again.
attribution_removal_2026_09_03:
  scope_found: "253 of main's 377 commits carry the trailers, back to the initial commit 862cb3c of 2026-05-08. Six commits on the four unlanded branches also carried them."
  done: "The six commits on the four unlanded branches were rewritten (git filter-branch --msg-filter over main..branch) and force-pushed with --force-with-lease. New tips: housekeeping f38575b, ribbon 4d49192, ramp 987c29d, gate transcription 860c4b2. Proven safe: each new tree hash equals the old tree hash exactly, commit counts unchanged, zero trailers remain on origin."
  NOT_done_main: >-
    main was deliberately NOT rewritten and needs an owner decision. Rewriting 253
    commits would change every SHA from 2026-05-08 forward, which would make TRACKED
    documentation false (docs/RELEASE_NOTES.md cites 993f5ca and 4cfc3a9,
    docs/ROADMAP.yaml cites 993f5ca and 46f98f4), orphan all 56 merge commits and the
    GitHub pull requests behind them, break the deploy and verify-live receipts that
    bind a proof to a SHA, strand every other branch, and rewrite public history that
    NOAA-NIDIS was invited to read. If the owner wants it, plan the citation sweep
    first and treat it as its own operation.
  root_cause: >-
    The harness attribution instruction is one source, but the proximate cause was this
    session's own shared subagent brief, which spelled the two trailer lines out as
    literal text and told every worker to append them. The brief at
    planning/2026-09-03-session/subagent-brief-common.md is corrected in place with a
    note recording that it was the cause, so a future session cannot reintroduce the
    trailers by copying it.
  prevention_staged_not_installed: >-
    Two files are staged in the 2026-09-03 session scratchpad under install/ because
    this project's own permission rules deny Edit(/.claude/settings.local.json) and
    Edit(/.claude/hooks/**), so the session could not write them: (1) an attribution
    block for .claude/settings.local.json setting commit "", pr "" and sessionUrl
    false, which is the ROOT-CAUSE fix because the harness then never asks for the
    trailers; (2) ddm-guard-attribution.py, a second PreToolUse Bash hook that denies
    any git commit whose message carries one anyway, inspecting -m, --message, -F,
    --file and --trailer, message files read from disk, and the raw command text, with
    DDM_ALLOW_ATTRIBUTION=1 as the override for history rewrites that REMOVE trailers.
    Fourteen pipe-tested cases pass, including a real past commit message read verbatim
    from a file. install-attribution-guard.ps1 applies both, backs up the settings
    first, and is safe to re-run. THE OWNER RUNS IT, then opens /hooks once.

