            so every boot path reaches it including the two that never get a map. Controls render
            disabled with a plain-language reason and enable on map ready. A new
            data-ddm-controls attribute carries waiting, ready or no-map. It is deliberately NOT one
            of the six layer states: it describes controls, never a layer, and none of the six was
            repurposed.
