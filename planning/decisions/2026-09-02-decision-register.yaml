        decision: null
        fix_2026_09_03:
          branch: "fix/dr-065-boot-honesty at 2efdb43, pushed, NOT landed, awaiting the owner's go"
          option_executed: >-
            OPTION A, the fix. Option b (both studios behind a development flag) was the
            owner-endorsed fallback and was NOT needed; it is not on the branch. The entry stays
            status pending because the owner never formally ruled it: HANDOFF.md carries "DR-065 and
            DR-066 defaults stand unless you object", and the register's own recommendation is a.
            The default was executed and it worked. The owner can close this entry as a with one
            line.
          root_cause: >-
            The shared root the launch ruling named: every generated sidebar control waited on the
            map's load event. src/main.ts called buildSidebar only from wireMapDependentChrome,
            after waitForMapLoad, so a slow boot, a GPU initialization error, or a browser without
            WebGL 2 produced a populated-looking shell whose region dropdown and preset chip row
            were empty containers that never filled. That is what a demonstration audience reads as
            "the studios are not working".
          what_changed: >-
