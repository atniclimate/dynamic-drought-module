          statements DIFFERENTLY, and the sentence now reflects that instead of flattening it. The
          near-normal-snowpack finding is a direct quotation from the Deputy Washington State
          Climatologist and remains attributed to the Washington State Climate Office. The
          sample-size caveat sits OUTSIDE her quotation marks and is the article's own narration
          bridging two of her quotes, so it is now attributed to "the University of Washington
          College of the Environment report of that finding", the party that actually wrote it. The
          application uses reported speech, "adds that", so nothing is presented as a quotation that
