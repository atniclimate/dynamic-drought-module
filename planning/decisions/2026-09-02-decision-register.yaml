groups:
  - id: G1
    title: Posture and platform
    decisions:
      - id: DR-001
        title: How the September work lands
        question: >-
          Confirm the work lands from one long-lived branch integration/2026-09 pushed to
          origin with no pull request until the owner says go, and say whether it lands as
          one squashed commit or a merge commit that keeps the wave's history.
        source: ["07-ci-and-workflow.md D-1 and section 5a", "00-SESSION-LOG.md 23:30"]
        blocks: ["every fix-wave change now sitting on integration/2026-09", "DR-002", "the landing itself"]
        options:
          - key: a
            text: one squashed commit with a written body
            cost: S
            risk: the wave's per-worker provenance survives only until the branch is deleted
          - key: b
            text: merge commit preserving the wave's commits
            cost: S
            risk: about sixty commits arrive on main at once, though each stays attributable
          - key: c
            text: split into two or three themed pull requests
            cost: M
            risk: multiplies Validate runs, which is what the posture is escaping
        recommendation: b
        rationale: >-
          A merge commit still gives one landing while preserving which worker changed which
          file, the only provenance a wave that ran without per-PR receipts will leave.
        default_if_no_answer: the branch keeps accumulating locally and nothing reaches users
        status: decided
        decided: "2026-09-02"
        decision: "b: Merge commit preserving the wave commits. Owner addition: merge often; do not let integration/2026-09 drift far from main."
      - id: DR-002
        title: What CI does after 2026-09-11
        question: >-
          Does the deploy-on-push keep the browser suite as a required gate or make it
          advisory, does main get a ruleset requiring only Validate, and which of the four
          crons return and at what cadence when the snooze expires?
        source: ["07-ci-and-workflow.md D-2 (CI-11)", "07-ci-and-workflow.md D-5 (CI-09)", "07-ci-and-workflow.md D-4 table", "00-MASTER-FINDINGS.md section 4"]
        blocks: ["CI-02 (a YAML-comment push cost 38 job minutes and a red deploy)", "the post-landing deploy", "cron restoration on 2026-09-11"]
        options:
          - key: a
            text: >-
              browser suite advisory on push (already implemented on the branch), no ruleset
              on main, refresh-snapshots unchanged, source-health weekly, upstream-monitor
              weekly only after CI-04, verify-live daily left off
            cost: S
            risk: the deployed sha is proved by verify-live rather than by a shard on a runner
          - key: b
            text: as (a) plus a ruleset on main requiring Validate on the one pull request
            cost: S
            risk: a Validate flake can block the single landing
          - key: c
            text: restore everything as it was on 2026-09-11
            cost: S
            risk: returns the 20-of-30 upstream-monitor noise and flake-blocks-deploy
        recommendation: a
        rationale: >-
          It matches the owner's rule that CI must never be a blocker while keeping the
          stronger proof, since verify-live boots the deployed build six ways on the live site.
        default_if_no_answer: schedules resume unchanged on 2026-09-11 and the noise returns
        status: decided
        decided: "2026-09-02"
        decision: "a: Browser suite advisory on push; no ruleset on main; refresh-snapshots unchanged; source-health weekly at snooze expiry; upstream-monitor weekly only after CI-04; verify-live cron stays off. CI must prove but never block."
      - id: DR-003
        title: Install the drafted Claude Code hooks
        question: >-
          Do the six drafted hooks get installed, into .claude/settings.json or
          .claude/settings.local.json, may the Stop hook block a turn, may the Bash guard
          block git push origin main, and are deny rules added for the Asana write tools?
        source: ["16A-hooks-and-settings.md D-16A-1", "16A D-16A-2", "16A D-16A-3", "16A D-16A-4", "16A D-16A-5"]
        blocks: ["the U+2014 and fire3d-evidence edit guards", "the port 4173 guard", "Asana write protection a Bash hook cannot see"]
        options:
          - key: a
            text: >-
              install P1, P2, P3 and P4 (DDM_STOP_LEVEL=fast) into settings.local.json,
              Stop may block, push to main warned not blocked, Asana write denies added
            cost: S
            risk: a Stop hook can cost the owner a turn
          - key: b
            text: install the full set including a hard block on git push origin main
            cost: S
            risk: a false block if the posture changes mid window
          - key: c
            text: install nothing this window
            cost: S
            risk: the em dash and evidence guards stay manual
