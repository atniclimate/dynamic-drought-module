            (studio-url-matrix.spec.ts:162), and once at the seam's own gate, where data-ddm-boot
            stayed "booting" and never reached "idle" (helpers.ts:272). The agent read the code first
            and confirmed the seam ADDS a wait rather than replacing one, so it inherits the
            underlying cold-boot timing pressure and gives it a new place to surface, including
            inside the reload path this decision's named incident runs through.
          named_symptom_not_reproduced: >-
            The layers=aiannh,bia-reservations,places URL rewrite recorded on this entry's
            reproduction list did NOT appear in 32 isolated runs (16 per commit). It is far rarer
            than the boot-settle timeouts: once in about 870 serial cases against five or six in
            sixteen isolated ones. Hypothesis, UNCONFIRMED, from reading src/state/url.ts
            parseUrlParams and src/ui/sidebar.ts lines 362 to 1460: a narrow race between two
            pushUrl() calls during boot. No fix attempted.
          caveat: >-
            The failure rate was measured while two other subagents were running npm ci, typecheck
            and builds on the same machine. Rerun once on a quiet machine before treating 5 of 16 as
            the true rate.
          coverage_of_the_three_modes:
            mode_1_toggle_regression: "iPad, Powell River. NO contract covers it. Recommend adding one."
            mode_2_demonstration_failure: "NIDIS desktop screen share. PARTIALLY covered: a chunk-load failure has a graceful contract, the boot-settle race does not. This is the most demonstration-realistic explanation, and the agent recommends fixing it first."
            mode_3_inconsistent_navigation: "Reuben Martinez, desktop and phone. PARTIALLY covered by restore, focus and URL contracts; no multi-cycle sequence test exists. Recommend a new contract."
          recommended_order: "fix the boot-settle race, then the two missing contracts, with option b (hide the studios) still the fallback if a fix cannot land before the Convention"
          tooling_note: "Playwright's testDir is ./tests and rejects an external scratchpad spec (confirmed with --list), so the three modes are documented as manual reproduction steps rather than throwaway specs"
