  - id: G7
    title: Interface
    decisions:
      - id: DR-035
        title: Boot tolerance for a stalled renderer
        question: >-
          The whole boot, including the sidebar that needs no GL, blocks on the map load event,
          so a hidden or occluded window sits at a complete-looking skeleton indefinitely, with
          no watchdog, no boot catch, no map error handler and no WebGL probe. Should boot
          tolerate a stalled renderer?
        source: ["01-architecture.md D1 (ARCH-01)", "planning/plans/2026-08-31-visual-pass-walkthrough.yaml D16 (VP-19)", "06-interface.md item 6"]
        blocks: ["ARCH-01", "VP-19", "every future is-the-deploy-broken investigation"]
        options:
          - key: a
            text: after a bounded wait, boot the chrome without the map and show an honest not-yet-rendering state, with a WebGL probe and a map error handler
            cost: M
            risk: changes what a broken boot looks like, and a slow but healthy boot could flash the note
          - key: b
            text: keep strict boot and add only a console-visible watchdog
            cost: S
            risk: users keep seeing an inert but complete-looking interface
          - key: c
            text: no change
            cost: S
            risk: a renderer failure stays indistinguishable from a deploy regression, which already cost one session
        recommendation: a
        rationale: >-
          An interface that looks complete while showing nothing is the one failure mode the
          honesty doctrine cannot tolerate, and the six layer states already give the vocabulary
          for saying it.
        default_if_no_answer: a hidden window keeps mimicking a deploy regression
        status: decided
        decided: "2026-09-02"
        decision: >-
          a: after a bounded wait, boot the chrome without the map, show an honest not-yet-rendering
          state, and add a WebGL probe and a map error handler. Built once, as the MapLibre 6
          GPUInitializationError branch (briefing section 6.6 step 6).
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
        owner_notes: >-
          The hidden-window hang has already cost a session; option a builds the handler once instead of
          twice.
