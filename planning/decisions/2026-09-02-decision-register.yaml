    decisions:
      - id: DR-061
        title: Pre-processing pipeline scope
        question: >-
          Start a scheduled normalization job on GitHub Actions that publishes normalized JSON (issuer
          date, validity window, provenance, machine-readable state) for daily-or-slower sources ahead of
          the local full-service server, and if so how wide?
        source: ["planning/decisions/2026-09-03-decision-packet.md Appendix B", "docs/ROADMAP.yaml DDM-P15-T01, DDM-P14-T04"]
        blocks: ["DDM-P15-T01", "DDM-P14-T04", "the seventh layer state question (no stale state exists today)"]
        options:
          - key: a
            text: nightly normalization for every daily-or-slower source
            cost: L
            risk: main churn, Pages builds, geometry in git, and a new stale state across the controller contract
          - key: b
            text: wait for the local full-service server
            cost: S
            risk: the client keeps absorbing issuer envelope and date defects one at a time
          - key: c
            text: narrow; normalize the worst-edge-case sources first (USDM week index and DSCI, NIDIS per-window valid dates, CPC monthly and seasonal outlooks) inside the existing weekly workflow shape, dates and windows without geometry
            cost: M
            risk: two paths coexist until the server; issuer facts must be cited before any wording changes
        recommendation: c
        rationale: >-
          The honesty debt is concentrated in three sources; a narrow job moves it upstream without a
          seventh state or a nightly cadence, and its outputs become the server's first module.
        default_if_no_answer: nothing changes; issuer honesty stays client-side
        status: decided
        decided: "2026-09-02"
        decision: >-
          DEFERRED, owner ruling (not option a, b or c as written): no cron jobs before the Convention or
          in the near term. Normalization is updated manually as part of major sprint landings (a phase
          close, a significant feature merge), never on a schedule. The normalizer design work still feeds
          the local full-service server (DDM-P15-T01) as server infrastructure. When the time comes, after
          the Convention and after the successor is oriented, the first candidates are option c's three:
          the USDM week index, NIDIS valid dates, CPC outlooks.
        ruling_source: "planning/decisions/cc-prompt-decision-packet-2026-09-03.md (owner rulings, 2026-09-02 22:38 PDT)"
        owner_notes: >-
          The owner is uncomfortable with automated cron jobs at this stage: the Convention is imminent,
          the successor transition is in progress, and a nightly commit-to-main automation is a
          maintenance surface that needs monitoring.
