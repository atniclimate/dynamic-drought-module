          season past plus or minus 0.5 C, stated as emerging or present) with the five-season
          episode rule stated as the historical classification? The app prints that ENSO is
          currently neutral while CPC has held an El Nino Advisory since 13 August 2026 and
          forecasts a greater than 90 percent chance of a very strong event.
        source: ["05-enso.md D-ENSO-1 (ENSO-01)", "13-enso-science-spec.md D-ENSOSCI-1 (ENSOSCI-01, ENSOSCI-04)"]
        citations: ["13#4 onset of El Nino conditions on a single three-month season (CPC ENSO FAQ)", "13#5 Watch, Advisory and Final Advisory definitions", "13#6 current status and advisory, verified 13 Aug 2026", "13#2 RONI thresholds and the five-season episode rule"]
        blocks: ["ENSO-01 blocker", "every ENSO claim in the briefing", "DR-030", "DR-031", "DR-032"]
        options:
