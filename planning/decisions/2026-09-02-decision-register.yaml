          vocabulary throughout is "very strong", "the strongest El Nino on record" and "the next
          strongest El Ninos"; it never says "large" or "largest". The verifier was explicit that
          "largest" did NOT broaden the category, because the three named events gloss the clause
          immediately, so this is fidelity to the issuer's term rather than a correction of scope.
          The cost, accepted: "strongest" now appears twice in one sentence.
