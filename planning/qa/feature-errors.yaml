    root_cause_2026_08_29:
      locus: "popup-viewport.spec.ts:248 (chromium 3/4 on the seven-shard matrix; chromium-interaction 1/2 on the eight-shard matrix)"
      failed_all_attempts: "PR 39 head 08b1bc6 twice (Validate 33269081518 attempts 1 and 2); main 0ce9e84 (deploy 33272420821); main 9cd134c (deploy 33273172441 attempts 1 and 2)"
      mechanism: >
        src/ui/mobile-sheet.ts settle() ran only from the 320 ms fallback
        timer; the transitionend listener its own comment names was never
        wired. A long task (the live 2.5 MB NADM GeoJSON parse plus the
        minimap analysis, about 1.5 s) stalled the renderer across the
        250 ms height ease; the timer then read a frame-frozen sheet rect
        (a 223 px inset instead of 388, the fifth frame of the ease) and
        nothing re-measured, so the camera stayed padded 165 px short. The
        spec's strip-center click then sat 0.4 px inside the synthetic BIA
        rectangle's north edge and missed on every retry. Evidence: the
        retained traces from runs 33272420821 and 33273172441 (identical
        post-settle envelope), a stall-injecting standalone probe (2 of 3
        failures on the old code, 3 of 3 passes with the fix), and
        planning/research/2026-08-29-popup-viewport-248-root-cause.md.
      fix: "PR 50 (14e9868): settle on the sidebar's own height transitionend, cancelling the pending fallback timer; regression test in tests/mobile-sheet.spec.ts injects a 600 ms main-thread stall and reads the padding through the BIA query envelope (red at 0.56 degrees of shift on the old code, green with the fix)."
      after: "main deploys 14e9868, f0a9092, eb19fc5, 533fabd ran with one, zero, zero, and zero retries. Names still seen on 2026-08-29: studio-restore:124, fire3d-mode:1004 and :1027. FE-23 stays open for those."

