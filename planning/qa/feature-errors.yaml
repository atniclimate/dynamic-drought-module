  - id: FE-05
    observed: 2026-08-19, owner visual review
    surface: 3D Fire scene, LANDFIRE FBFM40 fuels drape
    severity: medium
    status: resolved
    linked_task: [T15, T16]
    evidence: >
      The fuel-model drape reads as distracting multicolored patchwork rather
      than as information: 44 categorical classes in an issuer palette that
      spans the whole hue wheel, draped translucently over terrain. Owner
      asked for "only the yellow thru red colors to indicate risk", which the
      FBFM40 classification cannot honestly express (it is a fuel-model
      classification, not a risk scale) and which MapLibre cannot render by
      client recolor (no raster-color property).
    resolution: >
      The scene's drape is now USFS Wildfire Hazard Potential 2023, the
      product that IS a published yellow-through-red hazard scale, rather
      than a repainted fuel-model classification. A central Oregon sample
      measured 86 percent of pixels in the yellow, orange, and red band, so
      the owner's ask is answered by choosing the right issuer instead of
      recoloring the wrong one. The archive is roughly half the weight of
      the one it replaced.

  - id: FE-06
    observed: 2026-08-19, owner visual review
    surface: 3D Fire scene, HMS smoke volume
    severity: medium
    status: resolved
    linked_task: [T18]
    evidence: >
      Owner: volumetric smoke "doesn't seem to work". Two candidate causes,
      both consistent with the screenshot: (a) the scene showed the honest
      "no features returned for this view" state, i.e. HMS had zero plumes in
      view at that hour, and the 3D control did not say so where the owner was
      looking; (b) the stylized extrusion heights (320 / 680 / 1320 m) are
      visually negligible against 3,000 m Cascade relief. DIAGNOSE before
      changing anything.
    resolution: >
      Both causes were real and both are addressed. The empty state now has
      a line in the 3D control itself, derived from the smoke layer's own
      registry status, so an empty sky reads as an answer rather than a
      broken feature. And the stylized heights rose from 320/680/1320 m to
      800/1700/3300 m after measuring the actual geometry: 25 live PNW
      plumes averaged 205 to 635 km across, so a Heavy plume was a 278:1
      sheet standing 18 percent as tall as the apparent terrain relief it
      competed with. It is now 46 percent. The volume was rendering the
      whole time; it had nothing to read as volume.

