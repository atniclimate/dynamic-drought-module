  - id: FE-16
    observed: 2026-08-28, discovery harness against the live build, desktop 1440, tablet 768, landscape phone 844
    surface: Fire quick view, NIFC current perimeters (2D and 3D, every breakpoint)
    severity: high
    status: resolved
    linked_task: [DDM-P1-T06]
    evidence: >
      The WFIGS query the layer issues (where=1=1, outFields=*, outSR=4326,
      f=geojson) returns 42.75 MB for 243 perimeters and takes 41.6 s from
      this workstation (second fetch 37.8 s, cut at exactly 32 MiB). The
      layer budget is 15 s, so every boot aborts at about 17 s and the
      layer reads `unavailable`; the timed probe shows loading through
      s=15 and unavailable from s=18 to s=54. The Fire view's primary
      evidence is therefore absent for every user on every device. Scoped
      variants measured on the same server: OBJECTID only with full
      geometry 41.8 MB / 29.6 s; geometryPrecision=4 22.8 MB / 21.2 s;
      geometryPrecision=4 plus maxAllowableOffset=0.001 (about 100 m)
      1.13 MB / 6.0 s. Full-precision geometry is the mass, not the
      attribute set.
    resolution: >
      Commit 64b8eda on fix/interface-critical-2026-08-28: schema-exact
      outFields (nine attributes), geometryPrecision 5, maxAllowableOffset
      0.0005 degree; the exact URL the app issues measured 1.90 MB in 6.1 s
      for 239 perimeters (2026-08-28T18:32Z). The generalization is stated
      in the legend, the popup, and the map key, and flagged for owner
      ratification in the pull request because it changes the drawn edge.
      Owner ratified the 0.0005 degree generalization in session on
      2026-08-28 at 12:15 PDT and authorized merging PR 27 once Validate
      is green.
      Spec tests/nifc-query-scope.spec.ts pins the query and both
      qualifications. Resolved once merged and the live Fire view shows
      perimeters within budget.
      RESOLVED 2026-08-28: PR 27 merged as ce13436; on the live build the
      NIFC layer reads live in 572 ms on desktop (1,896,092 bytes) and
      549 ms on the phone shell, the sidebar legend states the 0.0005
      degree generalization, and the map key carries the note.

  - id: FE-17
    observed: 2026-08-28, timed probe, desktop 1440 wildfire console view
    surface: On-map FIRE key (map-key.ts loading placeholder row)
    severity: medium
    status: not_a_defect
    linked_task: []
    evidence: >
      After the NIFC layer transitions loading -> unavailable at s=18, the
      FIRE key keeps rendering "NIFC WFIGS current mapped perimeters
      loading" through s=54 and never re-renders. The sidebar row and the
      conditions strip update correctly; only the map key is stale. The
      key derives its loading row from registry status at render time but
      is not re-rendered on the loading -> error transition, so the map
      claims a load is in progress that already failed.
    resolution: >
      Withdrawn 2026-08-28 after checking the s=54 screenshot: the key host
      is hidden (map-key.ts activeKey() returns null once nifc-fires is
      neither active nor loading, and update() sets host.hidden). The probe
      read textContent of a hidden element, so the stale "loading" string
      was the retained innerHTML of a hidden strip, not a visible claim.
      The key does subscribe to registry status-change. Probe method
      corrected: only visible elements count as evidence.

  - id: FE-18
    observed: 2026-08-28, discovery harness, embed=true at 1440x900 and 390x844
    surface: Embed chrome, bottom-right corner and bottom-left dock
    severity: high
    status: resolved
    linked_task: []
    evidence: >
      Desktop-width embed: the ATNI Climate brand pill (map-dock-foot),
      the TEST PREVIEW badge (position: fixed right 78px bottom 12px), the
      map-information button (absolute right 10px bottom 8px), MapLibre's
      attribution circle, and the SAT basemap control (which embeds keep
      in MapLibre's bottom-right corner) all occupy the same corner; the
      SAT toggle and the attribution button are covered. Bottom-left, the
      drought key strip covers the scale bar ("50 km" hidden). Phone
      embed: SAT sits under the brand pill and the NADM key strip, and the
      "Loading North American Drought Monitor" toast overlaps the Share
      view control at top-right. Root cause: the 2026-08-19 desktop corner
      rules in the (min-width: 721px) block of app.css (map-info-btn,
      test-preview-badge, maplibregl-ctrl-bottom-right margin) are not
      scoped :not(.embed), but the SAT control never left the corner in
      embeds. No spec boots an embed wider than 400px, so the collision is
      invisible to the suite. Measured again on the live build 2026-08-28
      with elementFromPoint: the brand pill covered the satellite control
      at EVERY embed width (200, 390, 400, 800, 1280), not only the wide
      ones, because the shared bottom dock sits at bottom 34px (42px below
      720px) while MapLibre's bottom-right stack rises 83px; the 400 and
      200 pixel specs checked the brand against the attribution toggle only.
    resolution: >
      Commit b20bcc2 on fix/interface-critical-2026-08-28: desktop corner
      rules scoped :not(.embed); embed dock lifted above MapLibre's
      bottom-right stack at every width; loading pulse left-aligned and
      clamped (drops below the overlay at the 200px floor); satellite
      control nudged up four pixels at the floor. Spec
      tests/embed-corner.spec.ts hit-tests satellite and attribution and
      holds pairwise non-overlap at 1280x800, 800x600, 400x600, 390x844,
      and 200x600. Neighbouring embed, responsive, legend, popup, and
      wildfire suites pass against the patched build (74 of 75; the one
      failure, popup-viewport 934, also failed in the untouched baseline
      under shared load and passes alone). Resolved once merged.
      RESOLVED 2026-08-28: PR 27 merged as ce13436; on the live build the
      satellite and attribution controls hit-test to themselves at 1280x800
      and 390x844 embeds, the information button is absent, and the
      preview badge sits in the top-right stack (top 12px).

