  - id: FE-20
    observed: 2026-08-28, timed probes, iPad Mini and iPhone 14 drought view
    surface: North American Drought Monitor first read on phone and tablet
    severity: low
    status: open
    linked_task: [DDM-P2-T06]
    evidence: >
      The NADM module chunk arrives at about 1.1 s but the 2.5 MB
      NADM-current.geojson response does not arrive until 8.0 s (tablet)
      and 11.9 s (phone), against 1.3 s for the same URL from curl and a
      sub-second desktop read. Three of five phone scenarios were still
      loading at 12 s. NOT a diagnosed defect (Codex review 2026-08-28,
      finding 5): the probe's response handler awaited the body before
      timestamping, so 8.0 s and 11.9 s are body-complete times, not
      request-start times, and nadm-drought.ts issues its fetch immediately
      inside activation while layer-controller.ts launches boot activations
      concurrently. Keep as a measurement item for the real-device pass:
      record request start, headers, body complete, parse complete, source
      added, first idle, and first rendered feature.
