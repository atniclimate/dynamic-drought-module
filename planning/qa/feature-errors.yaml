  - id: FE-14
    observed: 2026-08-19, owner visual review
    surface: Power infrastructure, distribution circuits
    severity: medium
    status: resolved
    linked_task: [T14]
    evidence: >
      Owner asked for distribution lines alongside transmission. Verified
      2026-08-19: no public national distribution-line dataset exists, by
      design (utility-proprietary and security-sensitive; substations
      withheld since 2022). The application currently says nothing about this
      absence, so a viewer can read the sparse transmission network as the
      whole grid. The defect is the SILENCE, not the missing data.
    resolution: >
      The qualification now names both absences, attributes them to the issuers, and states that absence is not evidence of nonexistence. Recorded in docs/design/fire3d-context.md with the declined OSM option and its conditions.

  - id: FE-15
    observed: 2026-08-19, found while probing the WHP ImageServer for the risk-drape bake
    surface: Wildfire Hazard Potential legend (2D catalog layer and the map key)
    severity: high
    status: resolved
    linked_task: [T15, T16]
    evidence: >
      The committed USFS_WHP_PRESENTATION table does not describe what the
      service actually renders, in two ways at once.
      COLORS: the table lists a ColorBrewer RdYlGn ramp
      (#1a9850, #91cf60, #fee08b, #fc8d59, #d73027) while the issuer's own
      legend endpoint serves #38a300, #a3ff94, #ffff63, #ffa300, #ed1e00
      (probed live 2026-08-19, and confirmed pixel-for-pixel in an
      exportImage sample over central Oregon whose only distinct values were
      exactly the issuer's seven).
      CLASSES: the table lists five, but the raster carries SEVEN
      (minValues 1, maxValues 7) and the issuer legend names all seven:
      the five hazard classes plus "Non-burnable" (#e1e1e1) and "Water"
      (#0070e1). Both of those render on screen today with no legend entry
      at all, so a viewer sees grey and blue areas the key does not explain,
      beside five swatches whose colors do not match the map.
      This is a legend that describes a different image than the one on
      screen, which is the exact failure the honesty doctrine exists to
      prevent.
    resolution: >
      USFS_WHP_PRESENTATION now carries the issuer's seven classes in the
      issuer's own colors, decoded from its legend endpoint. The new
      scripts/build-whp-tiles.mjs re-fetches that legend on every bake and
      hard-fails when the table and the served legend disagree, so the key
      and the raster cannot drift apart again without the build stopping.
      A spec pins all seven labels and colors, and the qualification names
      the two non-hazard classes so neither reads as a hazard rating of
      zero.

