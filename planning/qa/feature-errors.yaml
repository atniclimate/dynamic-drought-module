# Feature-error ledger: observed defects in the shipped application
# ---------------------------------------------------------------------------
# Tracked since 2026-09-07 under the AGENTS.md ledger carve-out (docs/ROADMAP.yaml `authority: defect_ledger`).
#
# One entry per OBSERVED problem (something a person saw the application do or
# fail to do), not per planned change. The microtask ledger
# (docs/prompts/2026-08-19-fire3d-refinement-tasks.yaml) carries the planned
# work; this file carries the evidence that the work was needed and the record
# of whether the observation was actually resolved.
#
# Fields:
#   id           FE-nn, never reused. The deep-dive easy fixes are EF-IB-n
#                (report 02) and EF-MM-n (report 11); see the block at the end.
#   original_id  EF entries only: the bare EF-n label the source report and
#                the src/ comments use (each comment names its report)
#   source       EF entries only: planning path:lines the entry was taken from
#   observed     ISO date + who/what observed it
#   surface      where in the application it shows
#   severity     high | medium | low  (high = misleads a user about the world)
#   status       open | in_progress | resolved | wont_fix | not_a_defect
#   linked_task  microtask id(s) that address it
#   evidence     what was seen, and any measurement
#   resolution   filled in when status leaves `open`; cite the commit or PR
#
# Protocol: when a Gn task lands, update the matching entry in the same working
# session. A defect found DURING this run that is not in the microtask ledger
# gets a new FE entry here first, then either folds into the current group or
# becomes a new ledger task. Never fix and forget.
# ---------------------------------------------------------------------------

entries:
  - id: FE-01
    observed: 2026-08-19, owner visual review of the deployed 3D Fire stack
    surface: Satellite basemap at national / zoomed-out framing
    severity: high
    status: in_progress
    linked_task: [T09, T21]
    evidence: >
      Zoomed out, the recent-satellite basemap renders as a patchwork: two
      overlapping disks of imagery with a hard day/night terminator seam and
      large white areas beyond coverage. White reads as "no clouds / clear
      ground" rather than "no data", which is a false claim about the world.
      Root cause (researched 2026-08-19): the NOAA MERGEDGC_Last_24hr product
      only covers the merged GOES East + West disks with a latitude cutoff
      near 76 degrees, but the raster source declares lon -180..180, so
      out-of-coverage exportImage responses paint white over the basemap.
    resolution: >
      Partially addressed in the map-chrome slice: six live probes proved out-of-coverage tiles are TRANSPARENT (base map showing through), not white, and that the source bounds already matched the issuer extent. The chip now states the real coverage geometry and the daylight seam. The remaining half, a globally consistent zoomed-out image, is the global daily layer in T21.

