schema_version: 2
roadmap_id: "ddm-forward-roadmap"
updated_on: "2026-09-07"

# Every open task takes this unless it carries its own `verification`.
default_verification: "verify:smoke"

# The product plan: phases, stable task ids, owner decision gates, and one
# testable acceptance sentence per task. Ids are stable and are quoted by the
# release notes and the external tracker, so an id is never reused. A finished
# task is marked done in place; a replaced task names its successor.
#
# Owner authorization for merge, deploy, tag, Worker publication, tracker
# mutation, and branch deletion is a standing rule recorded outside this file
# and is not restated per task. On 2026-09-02 the 42 per-task authorization
# fields, the external-tracker block, the execution-evidence and prohibited-
# field lists, and the scheduled-probe observation instructions were removed.
# Per-action continuous integration receipts are no longer the development
# posture: work converges on one integration branch and lands as one pull
# request. schema_version moved 1 to 2 in the same pass.
#
# Task keys: `title`; then `status` with `closed` or `superseded_by`, or
# `acceptance` for open work. The 2026-09 backlog (DDM-P7 onward) also carries
# `source` (the 2026-09-01 deep-dive review, by report number and finding id),
# `evidence` (added 2026-09-07: the repository paths that prove a `closed`
# sentence, present ONLY on done tasks whose closure the 2026-09-07
# reconciliation could not trace to a file; a done task carrying neither
# `evidence` nor traced files is an unverified claim), and `acceptance_pending`
# (a task with no acceptance sentence yet; it can hold no files by trace rule),
# `effort` (S, M, L), `needs_decision` (the 2026-09-02 owner decision register
# id, with the review's own decision label in parentheses), and
# `verification`, present ONLY where a task differs from `default_verification`
# at the top of this file. On 2026-09-02 the 25 per-task fields that merely
# repeated the default were removed and the ladder was pruned to three typed
# commands (verify:quick, verify:smoke, test:serial) over two gates (gate,
# gate:nobuild); the retired verify:fire and verify:full names are spelled out
# as the commands they were.

product:
  name: "Dynamic Drought Module"
  short_name: "DDM"
  package_version: "0.6.26"
  repository: "https://github.com/atniclimate/dynamic-drought-module"
  live_site: "https://atniclimate.github.io/dynamic-drought-module/"

purpose: "Define the development sequence, phase goals, software components, tasks, decision gates, and acceptance evidence for DDM."

authority:
  owner_direction: "Current written owner direction, annotations, and direct corrections govern product intent for the requested slice."
  runtime_truth: ["src/config/layers.ts", "src/config/urls.ts", "src/state/", "src/map/", "src/ui/", "tests/"]
  design_doctrine: "docs/design/README.md"
  # 2026-09-07, from .planning/PLANNING_AUTHORITY.md. This file is the TASK
  # ledger and nothing more. It cites 34 DR- ids and defines none; all 69 live
  # in the decision ledger. FE- ids are cited from src/ and appear nowhere in
  # this file. The five live planning paths below are tracked in git as of this
  # date (.gitignore); the rest of planning/ stays local and untracked.
  task_ledger: "docs/ROADMAP.yaml"
  decision_ledger: "planning/decisions/"              # defines all 69 DR- ids; this file cites, never defines
  defect_ledger: "planning/qa/feature-errors.yaml"    # FE-01..FE-24, EF-IB-1..10, EF-MM-1..7; FE-19 is cited from src/styles/app.css:6170
  research_inputs: "planning/user-research/"          # cite by path when a task draws on them; no ids adopted
  handoff_entry: "planning/handoffs/2026-09-04.md"    # newest only; older handoffs are history
  references_ledger: "planning/references/register.yaml"  # seeded by S03b 2026-09-07: one entry per cited source, url, issuer, owning task, last_checked
  read_only_history:
    - "planning/archive/"
    - "planning/2026-09-03-long-run/"
    - "planning/2026-09-03-session/"
  parked:                                             # divergent; 256 uncited ids between them; not adopted into this ledger
    - "planning/2026-09-01-deep-dive/"                # 147 uncited ids; `source:` fields below quote it by report and finding id
    - "planning/2026-09-03-foundations/"              # 89 uncited ids; rulings A1-A7, B1-B7, C1-C5 and slice S1 await ratification
    - "planning/plans/"                               # 20 uncited ids; 22 visual-pass items, all pending
  # `EF-` was two colliding lists, not one: 02-impact-briefing.md:519 (EF-1..10)
  # and 11-minimap-and-popups.md:433 (EF-1..7), both cited from src/ by bare
  # number (app.css:6169 EF-5 is the minimap one; app.css:3822 EF-9 the
  # briefing one). Keyed EF-IB-n / EF-MM-n in the defect ledger on 2026-09-07,
  # each with `source:` and `original_id:`; the src/ comments are untouched
  # because each already names its report.
  rule: "A DR-, FE-, EF-IB- or EF-MM- id may be cited by a task; it is never redefined in this file. An id not in .planning/PLANNING_AUTHORITY.md section 2 is a reason to stop and ask, not to guess: that registry is a lower bound (EF- was found to be two lists only after a sixth declaration pattern)."

plan_rules:
  - "Work on one bounded user-visible outcome at a time after prerequisite work."
  - "Do not add a blended drought, fire, smoke, infrastructure, or climate severity score."
  - "Keep every issuer, clock, geography, limitation, legend, and uncertainty distinct."
  - "Preserve URL-as-state, embed operation, responsive controls, and static hosting."
  - "Keep non-trivial network work cancellable and time-bounded through body consumption."
  - "Preserve loading, live, live (partial), unavailable, no data, and zoom in to load."
  - "Do not redistribute Tribal, Treaty, or other sovereign-jurisdiction polygons."
  - "Describe agency Tribal and Treaty polygons as representations, not jurisdictional truth."
  - "Do not add proprietary providers, credentials, tracking, analytics, or telemetry."

component_catalog:
  # Item 8, 2026-09-07: refresh-snapshots.yml and upstream-monitor.yml are
  # claimed here, not retired. upstream-monitor.yml is the scheduled half of the
  # drift mechanism whose script half this entry already names, and it attests
  # one clause of DDM-P15-T03. refresh-snapshots.yml keeps the bundled ENSO
  # snapshot current, which DDM-P12-T01's date-coupled acceptance depends on.
  # Neither is reachable by any test: `.github/` is outside the trace's test
  # roots and no spec asserts on workflow content (tests/README.md:229 is prose).
  release_delivery: {paths: [".github/workflows/", "vite.config.ts", "scripts/check-upstream-drift.mjs", "workers/proxy/"], concerns: ["GitHub Pages", "Cloudflare Worker", "build identity", "range-safe static delivery", "scheduled snapshot refresh and upstream liveness", "workflow files are attested by run receipts, not by this repository's gate"]}
  state_and_lifecycle: {paths: ["src/state/", "src/util/fetch.ts", "src/config/layers.ts", "src/types/layer.ts"], concerns: ["URL state", "activation and cancellation", "status semantics", "late-response protection"]}
  interface: {paths: ["src/ui/", "src/styles/app.css", "src/config/presets.ts", "src/config/clusters.ts"], concerns: ["desktop, tablet, phone, and embed", "keyboard and assistive technology", "reduced motion", "source and time receipts"]}
  map_and_visualization: {paths: ["src/map/", "src/layers/", "src/config/palette.ts", "src/config/wildfire-presentation.ts"], concerns: ["MapLibre lifecycle", "layer ordering", "2D and 3D presentation", "accessible legends"]}
  impact_and_place: {paths: ["src/impact/", "src/config/capability-matrix.ts", "src/state/typed-place.ts"], concerns: ["selected-place evidence", "regional coverage", "ENSO interpretation", "resource routing"]}
  data_pipelines: {paths: ["scripts/", "public/data/"], concerns: ["source vetting", "static artifacts", "PMTiles", "snapshot provenance", "artifact budgets"]}
  # Item 1, 2026-09-07: before these two entries, 42 scouted files matched no
  # catalog path, including src/config/urls.ts, which authority.runtime_truth
  # above names as runtime truth. Resolution is longest-prefix, so the six
  # per-file config entries and src/util/fetch.ts keep their current components.
  declared_catalogs: {paths: ["src/config/", "src/types/"], concerns: ["one declared source of truth per catalog", "the endpoint catalog and its eager boot slice", "region, framing, and ocean vocabularies", "station and place catalogs", "source and region capability declarations", "sovereign-representation provenance strings"]}
  shared_utilities: {paths: ["src/util/"], concerns: ["pure dependency-light helpers", "HTML escaping and payload type guards", "geometry, bbox, and antimeridian handling", "agency payload adapters", "motion, fade, and frame stepping", "archive header probing"]}
  verification: {paths: ["tests/", "scripts/check-activation-budget.mjs", "scripts/check-bundle-size.mjs"], concerns: ["strict TypeScript", "deterministic gate", "targeted browser tests", "serial release suite", "live production probes"]}
  documentation: {paths: ["README.md", "DEVELOPER.md", "ROADMAP.md", "docs/", "public/data/README.md"], concerns: ["public behavior and source qualifications", "planned scope", "maintainer and release evidence"]}

