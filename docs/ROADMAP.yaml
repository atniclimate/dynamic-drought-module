research_dispositions:
  - id: "DDM-R01"
    name: "Global Climate Hazard Scan, https://hazard.degreeday.org/ (design comparison only)"
    limits: "Study question framing, progressive disclosure, and global-to-local movement. Do not copy or scrape the service, and do not reproduce proprietary indicative wildfire modeling or blended hazard scores."
  - id: "DDM-R02"
    name: "Planette IFS Archive, https://github.com/planetteAI/planette_ifs_archive (offline hindcast and method research)"
    limits: "The archive is not a current operational forecast. Resolve dataset and repository licensing before adoption or redistribution."
  - id: "DDM-R03"
    name: "VoxCity, https://github.com/kunifujiwara/VoxCity (offline visualization-pipeline inspiration)"
    limits: "Do not add Python, GDAL, Google Earth Engine, or simulation dependencies to the static browser runtime, and do not imply that a city voxel is an infrastructure exposure or fire-impact result."
  - id: "DDM-R04"
    name: "CAMS Global Fire Assimilation System, https://atmosphere.copernicus.eu/global-fire-emissions (research reference, not a runtime source)"
    limits: "Account and license acceptance conflict with the keyless static-client preference. Modeled emissions and injection height are not transported smoke concentration or incident truth."
  - id: "DDM-R05"
    name: "NOAA NEXRAD Level II, https://registry.opendata.aws/noaa-nexrad/ (single-event research case study)"
    limits: "A low correlation coefficient is not smoke-specific and can include ash, debris, biological targets, or other clutter. Coverage cones, quality control, classification uncertainty, and false positives must remain visible."
  - id: "DDM-R06"
    name: "NOAA HRRR-Smoke, https://registry.opendata.aws/noaa-hrrr-pds/ (preferred bounded smoke-altitude pilot candidate)"
    limits: "Publish initialization, valid time, lead, variable, units, vertical coordinate, and uncertainty. Never label model guidance as an observation or a DDM prediction."
  - id: "DDM-R07"
    name: "AIRS or CLIMCAPS, CALIPSO, and MISR vertical products, https://worldview.earthdata.nasa.gov/ (historical validation and education)"
    limits: "Carbon-monoxide retrievals have limited vertical information and product-specific quality caveats; the flagged CLIMCAPS co_mmr_midtrop derived variable must not be used. CALIPSO operations ended in 2023 and MISR plume-height coverage is episodic. None of these provides an operational current 3D smoke volume."

decision_gates:
  - id: "DDM-D01"
    question: "Which MapLibre version does the product run: stay on 4.7.1, take 5.24.0, or migrate to 6.6.0?"
    register: "DR-009"
    needed_by: ["DDM-P0-T03", "DDM-P0-T09", "DDM-P0-T10", "DDM-P9-T04", "DDM-P15-T02"]
    context: "MapLibre GL JS 6.6.0 is current (published 2026-08-24); 5.24.0 is the last 5.x and receives no fixes; the installed version is 4.7.1. The 4 to 5 move is a pin bump plus test-budget tuning, because every documented 5.0.0 breaking change has zero occurrences in this codebase. The 4 to 6 move is a migration: ESM-only imports at 69 sites, a newly required worker-URL call, WebGL2 required, style-spec v25 against nine expression casts, and an overscale default that changes query results at 18 call sites. Source: 15 DEP-01."
    decision:
      date: "2026-09-02"
      answer: "Migrate directly to MapLibre GL JS 6.6.0 and skip version 5 (owner ruling DR-009, an override of the step-through recommendation, because an intermediate version creates debt). Known scope: rewrite the default imports at 69 sites, configure the worker URL, update the queryRenderedFeatures interaction sites (13 real call sites counted 2026-09-02; the earlier figure of 18 came from report 15), verify the WebGL2 path. Browser floor: Safari 15.5, pinned as a build target in vite.config.ts so the README promise stays true. Three-dimensional terrain remains a product requirement for desktop and tablet; mobile and tablet 3D wait on the tablet contract (DDM-P10-T01, gate DDM-D02)."
      superseded_answer:
        date: "2026-08-29"
        answer: "Accepted in principle for a version 5 or later renderer; the version 6 option was not on the table."
      cost: "Measured on maplibre-6/step-1-style-spec-casts at e5b7d38 (2026-09-02, 6.6.0): the maplibre vendor chunk is 251.7 kB gzip against 209.99 kB at 4.7.1 (about 42 kB more), the entry chunk fell from 43.4 to 33.6 kB gzip under DR-008 a, and the 3D terrain transport at 1280x720 is 6,394,061 bytes over 36 ranged requests against 2,278,573 over 19 at 4.7.1 (the same 6.39 MB the v5 branch measured on 2026-08-19). Serial suite 869 passed in 25.4 min on the branch."
      posture: "That cost figure is a local measurement recorded here, not a per-action continuous integration artifact. Since 2026-09 the work converges on one integration branch and lands as one pull request."
  - id: "DDM-D02"
    question: "Should tablet get its own layout band, or stay a small desktop?"
    register: "DR-036"
    needed_by: ["DDM-P10-T01"]
  - id: "DDM-D03"
    question: "Should Fire 3D remain controllable after custom demotion or exit automatically?"
    register: "DR-025"
    needed_by: ["DDM-P2-T02"]
    decision:
      date: "2026-09-02"
      answer: "Both, by rule: leaving the wildfire cluster exits the scene automatically and strips fire3d from the URL (DR-025 a); an honest custom demotion inside the Wildfire screen keeps the scene alive while a fire event layer remains, with the toggle as the direct off control; removing every fire event layer, toggling the preference off, or a narrow viewport also exits. DR-025 was widened to carry this answer rather than splitting the gate. The DR-025 expansion also rules that 3D terrain is map-level across all hazard views and that the fire3d parameter governs volumetric smoke, not terrain."
      posture: "The exit rule is the current activation gate in src/map/fire3d.ts and is under contract in tests/fire3d-mode.spec.ts (switching clusters exits the scene) and tests/view-contracts.yaml (leaving-3d-clears-the-scene-and-the-parameter)."
  - id: "DDM-D04"
    question: "Which Pacific camera and basemap policy should the ENSO quick view establish?"
    needed_by: ["DDM-P2-T03"]
  - id: "DDM-D05"
    question: "Which qualified Fire evidence pilot leads: AirNow, VIIRS, or selected-place evidence?"
    needed_by: ["DDM-P3-T03", "DDM-P3-T04", "DDM-P3-T05"]
  - id: "DDM-D06"
    question: "Must ENSO probabilities be issuer-published, or may DDM adopt a reviewed derived method?"
    register: "DR-034"
    needed_by: ["DDM-P4-T05"]
    context: "No machine-readable ENSO probability feed exists from CPC or IRI as of 2026-09-01 (12 FSPEC-11, 13 ENSOSCI-06), so this gate decides whether the product goes without one or derives one."
  - id: "DDM-D07"
    question: "Does the no-telemetry rule require explicitly disabling provider invocation logs containing full URLs?"
    needed_by: ["DDM-P0-T05"]
    decision:
      date: "2026-08-29"
      answer: "Yes. workers/proxy/wrangler.toml declares observability disabled in reviewed source, so the dashboard default cannot govern the deployed script. Before this, the setting was undeclared and no log-push job targeted it."
      posture: "The zero-log-events measurement that supported this answer was a one-time verification, not a standing per-action receipt; the durable artifact is the declaration in reviewed source."
  - id: "DDM-D08"
    question: "Which event, region, artifact budget, and mobile fallback should govern smoke-altitude research?"
    needed_by: ["DDM-P5-T01", "DDM-P5-T02", "DDM-P5-T06"]
  - id: "DDM-D09"
    question: "Which one field-capability or coverage outcome follows the smoke research phase?"
    needed_by: ["DDM-P6-T01"]
  - id: "DDM-D10"
    question: "What is the path from GitHub Pages to a local full-service server, and should production source maps stay public in the meantime?"
    register: "DR-006"
    needed_by: ["DDM-P15-T01"]
    context: "GitHub Pages is the current static host by owner direction; a local full-service server is the eventual host. Any interim hosting experiment must prove range, CORS, cache, privacy, rollback, cost, and portability first."
  - id: "DDM-D11"
    question: "Which current ENSO question, audience, and evidence hierarchy should the first index-first product answer?"
    register: "DR-032"
    needed_by: ["DDM-P4-T01"]
