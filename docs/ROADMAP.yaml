schema_version: 2
roadmap_id: "ddm-forward-roadmap"
updated_on: "2026-09-02"

# Every open task takes this unless it carries its own `verification`.
default_verification: "verify:smoke"

# The product plan: phases, stable task ids, owner decision gates, and one
# testable acceptance sentence per task. Ids are stable and are quoted by the
# release notes and the external tracker, so an id is never reused. A finished
# task is marked done in place; a replaced task names its successor.
#
# Owner authorization for merge, deploy, tag, Worker publication, tracker
# mutation, and branch deletion is a standing rule recorded outside this file
# and is not restated per task. On 2026-09-02 the 42 per-task authorization
# fields, the external-tracker block, the execution-evidence and prohibited-
# field lists, and the scheduled-probe observation instructions were removed.
# Per-action continuous integration receipts are no longer the development
# posture: work converges on one integration branch and lands as one pull
# request. schema_version moved 1 to 2 in the same pass.
#
# Task keys: `title`; then `status` with `closed` or `superseded_by`, or
# `acceptance` for open work. The 2026-09 backlog (DDM-P7 onward) also carries
# `source` (the 2026-09-01 deep-dive review, by report number and finding id),
# `effort` (S, M, L), `needs_decision` (the 2026-09-02 owner decision register
# id, with the review's own decision label in parentheses), and
# `verification`, present ONLY where a task differs from `default_verification`
# at the top of this file. On 2026-09-02 the 25 per-task fields that merely
# repeated the default were removed and the ladder was pruned to three typed
# commands (verify:quick, verify:smoke, test:serial) over two gates (gate,
# gate:nobuild); the retired verify:fire and verify:full names are spelled out
# as the commands they were.

product:
  name: "Dynamic Drought Module"
  short_name: "DDM"
  package_version: "0.6.26"
  repository: "https://github.com/atniclimate/dynamic-drought-module"
  live_site: "https://atniclimate.github.io/dynamic-drought-module/"

purpose: "Define the development sequence, phase goals, software components, tasks, decision gates, and acceptance evidence for DDM."

authority:
  owner_direction: "Current written owner direction, annotations, and direct corrections govern product intent for the requested slice."
  runtime_truth: ["src/config/layers.ts", "src/config/urls.ts", "src/state/", "src/map/", "src/ui/", "tests/"]
  design_doctrine: "docs/design/README.md"

plan_rules:
  - "Work on one bounded user-visible outcome at a time after prerequisite work."
  - "Do not add a blended drought, fire, smoke, infrastructure, or climate severity score."
  - "Keep every issuer, clock, geography, limitation, legend, and uncertainty distinct."
  - "Preserve URL-as-state, embed operation, responsive controls, and static hosting."
  - "Keep non-trivial network work cancellable and time-bounded through body consumption."
  - "Preserve loading, live, live (partial), unavailable, no data, and zoom in to load."
  - "Do not redistribute Tribal, Treaty, or other sovereign-jurisdiction polygons."
  - "Describe agency Tribal and Treaty polygons as representations, not jurisdictional truth."
  - "Do not add proprietary providers, credentials, tracking, analytics, or telemetry."

component_catalog:
  release_delivery: {paths: [".github/workflows/", "vite.config.ts", "scripts/check-upstream-drift.mjs", "workers/proxy/"], concerns: ["GitHub Pages", "Cloudflare Worker", "build identity", "range-safe static delivery"]}
  state_and_lifecycle: {paths: ["src/state/", "src/util/fetch.ts", "src/config/layers.ts", "src/types/layer.ts"], concerns: ["URL state", "activation and cancellation", "status semantics", "late-response protection"]}
  interface: {paths: ["src/ui/", "src/styles/app.css", "src/config/presets.ts", "src/config/clusters.ts"], concerns: ["desktop, tablet, phone, and embed", "keyboard and assistive technology", "reduced motion", "source and time receipts"]}
  map_and_visualization: {paths: ["src/map/", "src/layers/", "src/config/palette.ts", "src/config/wildfire-presentation.ts"], concerns: ["MapLibre lifecycle", "layer ordering", "2D and 3D presentation", "accessible legends"]}
  impact_and_place: {paths: ["src/impact/", "src/config/capability-matrix.ts", "src/state/typed-place.ts"], concerns: ["selected-place evidence", "regional coverage", "ENSO interpretation", "resource routing"]}
  data_pipelines: {paths: ["scripts/", "public/data/"], concerns: ["source vetting", "static artifacts", "PMTiles", "snapshot provenance", "artifact budgets"]}
  verification: {paths: ["tests/", "scripts/check-activation-budget.mjs", "scripts/check-bundle-size.mjs"], concerns: ["strict TypeScript", "deterministic gate", "targeted browser tests", "serial release suite", "live production probes"]}
  documentation: {paths: ["README.md", "DEVELOPER.md", "ROADMAP.md", "docs/", "public/data/README.md"], concerns: ["public behavior and source qualifications", "planned scope", "maintainer and release evidence"]}

completed_foundation:
  # Commits, pull requests, and release receipts are in docs/RELEASE_NOTES.md.
  - {id: "DDM-B00", outcome: "2026-08-10, v0.6.25: Drought and Wildfire entered one responsive Brief rail with URL state, mobile behavior, embeds, and the six layer states preserved."}
  - {id: "DDM-B01", outcome: "2026-08-18: answer-first Brief and console views over one governed state, a phone bottom sheet with footer doors, and Drought, Wildfire, Heat, ENSO, and satellite quick views."}
  - {id: "DDM-B02", outcome: "2026-08-18: public documentation reconciled with runtime contracts, validation and upstream monitoring strengthened, retired interface and source residue removed."}
  - {id: "DDM-B03", outcome: "2026-08-19: desktop Fire entered a URL-governed pitched terrain view with a qualified stylized HMS smoke presentation and a data-driven cross-view contract matrix."}
  - {id: "DDM-B04", outcome: "2026-08-19: USFS Wildfire Hazard Potential replaced the misleading fuel-model drape, and power infrastructure and an Overture structures pilot became independent context layers."}
  - {id: "DDM-B05", outcome: "2026-08-19: owner-reviewed Fire presentation refinements to control seats, perimeter and terrain legibility, smoke empty states, and issuer palettes."}
  - {id: "DDM-B06", outcome: "2026-08-19: the Pages browser-verification job received Validate's 75-minute ceiling, correcting a proven suite cutoff without claiming to solve browser-install hangs."}

phases:
  - id: "DDM-P0"
    name: "Release convergence and platform truth"
    goal: "Make source, validation evidence, GitHub Pages, and the optional Worker agree before new capability is treated as released."
    tasks:
      - id: "DDM-P0-T01"
        status: done
        closed: "Deterministic browser provisioning: hosted validation reaches the browser tests without a raised timeout as the only mitigation."
      - id: "DDM-P0-T02"
        status: done
        closed: "Repeatable browser contract failures: cluster, Fire 3D reload, satellite fallback, and minimap failures corrected; the residual moving flake set is tracked separately."
      - id: "DDM-P0-T03"
        title: "Decide and reconcile the renderer version prerequisite"
        source: "15 DEP-01"
        acceptance: "The decision names one of 4.7.1, 5.24.0, or 6.6.0, cites the measured bundle and terrain-transfer cost of the chosen move, and the adopted version passes the gate and the serial suite before it lands."
        decision_gate: "DDM-D01"
      - id: "DDM-P0-T04"
        status: done
        closed: "Source-to-production divergence detection: the build-identity check separates a cancelled deploy from a release and closes its own alert on recovery."
      - id: "DDM-P0-T05"
        status: done
        closed: "Worker convergence: the reviewed exact-route revision is live, answers GET, HEAD, and OPTIONS only for allowlisted routes, and rejects off-route relay probes."
      - id: "DDM-P0-T06"
        status: done
        closed: "Browser failure diagnostics: short-retention artifacts upload only when useful and carry no user data."
      - id: "DDM-P0-T07"
        status: done
        closed: "Workflow supply chain: every action is pinned to a reviewed immutable commit with minimal permissions and a review path for updates."
      - id: "DDM-P0-T08"
        status: done
        closed: "Pages publication: the accepted commit published through the normal workflow and the live build marker and nonce matched the completed run."
      - id: "DDM-P0-T09"
        title: "Prove or decline globe projection"
        acceptance: "Terrain, Fire 3D, URL, embed, phone, tablet, desktop, and reduced-motion behavior are each verified after the change, or the decline records the measured reason and removes no current capability."
        decision_gate: "DDM-D01"
      - id: "DDM-P0-T10"
        title: "Prove or decline global low-zoom NASA GIBS imagery"
        acceptance: "The layer carries its own status, timestamp, qualification, and legend and never implies current fire detection or drought assessment, or the decline records the measured source, performance, or product reason."
        decision_gate: "DDM-D01"
      - id: "DDM-P0-T11"
        title: "Record the renderer and imagery outcome across runtime, tests, docs, and the live build"
        acceptance: "Accepted and declined conditional work is written down without implying unshipped capability, and the deployed build, source commit, and public documentation agree."
      - id: "DDM-P0-T12"
        status: done
        closed: "Scheduled source-health receipts: the probe reuses the runtime's own upstream requests per catalog layer, reports every measured row against its budget, and names the rows it did not measure."
  - id: "DDM-P1"
    name: "Network lifecycle and failure honesty"
    goal: "Keep cancellation, response-body deadlines, activation failures, and optional chunk failures bounded and visible on weak connections."
    tasks:
      - id: "DDM-P1-T01"
        title: "Move response-body consumers under full deadlines"
        acceptance: "A stalled response body aborts on timeout and on master cancellation, and a static check catches a header-only fetch followed by body consumption."
      - id: "DDM-P1-T02"
        title: "Complete the layer cancellation seam"
        acceptance: "Held JSON, PMTiles, and viewport discovery requests abort promptly, and a late response cannot render after intent changes."
      - id: "DDM-P1-T03"
        title: "Unify activation failure handling"
        acceptance: "A thrown and a non-thrown activation failure both leave the checkbox and URL self-corrected and the unavailable state visible and announced once."
      - id: "DDM-P1-T04"
        title: "Isolate core sidebar loading from optional search"
        acceptance: "A search chunk failure degrades search only, and a core control island can retry successfully after an initial chunk failure."
      - id: "DDM-P1-T05"
        title: "Type-link internal layer keys"
        source: "01 ARCH-07"
        acceptance: "An internal catalog, preset, coactivation, or cluster recipe key typo fails type checking while external URL parsing still accepts and validates strings."
      - id: "DDM-P1-T06"
        title: "Align Fire data-query scopes"
        acceptance: "Outside the current request never reads as no data, and no scope change is made without a measured transfer and record-count benefit."
      - id: "DDM-P1-T07"
        title: "Update landscape-signature source pins"
        acceptance: "A phased or incomplete upstream mosaic cannot become the national default, and any fixture or public-artifact change is explicit and source-qualified."
        github_issues: [13]
      - id: "DDM-P1-T08"
        status: done
        closed: "Sovereign boundary stubs: every CI boot answers the Census AIANNH and BIA AIAN-LAR requests from synthetic fixtures, a test proves the route covers every boot path, and traces are retained on retry without screenshots."
  - id: "DDM-P2"
    name: "Cross-view interaction coherence"
    goal: "Close Fire 3D escape, ENSO camera, and cross-view interaction gaps while preserving one shared state architecture."
    tasks:
      - {id: "DDM-P2-T01", status: superseded, superseded_by: "DDM-P10-T01"}
      - id: "DDM-P2-T02"
        title: "Resolve Fire 3D custom-state escape"
        status: done
        acceptance: "An active Fire 3D scene always has a direct off control or an automatic-exit rule, and the selected rule is reflected in the URL and browser contracts."
        decision_gate: "DDM-D03"
        closed: "2026-09-02: gate DDM-D03 decided; the shipped rule (cluster change exits and strips the parameter, custom demotion keeps the scene with the toggle as the off control) is under contract in tests/fire3d-mode.spec.ts and tests/view-contracts.yaml."
      - id: "DDM-P2-T03"
        title: "Give ENSO a shareable Pacific camera contract"
        acceptance: "Fire-to-ENSO, share, reload, reset, phone, and desktop cases all open on visible Pacific evidence under one explicit basemap policy."
        decision_gate: "DDM-D04"
      - id: "DDM-P2-T04"
        title: "Defer the Fire 3D controller until eligible"
        acceptance: "A bare desktop Drought boot does not request the Fire 3D controller chunk, and deep links and Wildfire activation remain reliable."
      - id: "DDM-P2-T05"
        title: "Complete task-based responsive verification"
        acceptance: "Select, hazard switch, status read, share, reset, information, and mode-exit tasks are verified with keyboard, screen reader, reduced motion, high contrast, and safe-area cases represented."
        dependencies: ["DDM-P10-T01"]
      - id: "DDM-P2-T06"
        title: "Run a real-device field ergonomics pass"
        acceptance: "Touch, scrolling, orientation, and iframe behavior are reviewed outside emulation on iOS, Android, tablet, and a small iframe, and every finding is filed or accepted with evidence."
  - id: "DDM-P3"
    name: "Fire evidence pilots and visual hierarchy"
    goal: "Test the qualified Fire evidence candidates one at a time, without attributing an observation or detection to a specific wildfire, interpolating monitor points into a surface, or blending sources into a score."
    tasks:
      - {id: "DDM-P3-T01", status: superseded, superseded_by: "DDM-P8-T03"}
      - {id: "DDM-P3-T02", title: "Subordinate full-surface context so it does not outrank current event evidence"}
      - {id: "DDM-P3-T03", title: "Pilot EPA AirNow monitor points, preserving nullable pollutants, valid time, preliminary status, and distance", decision_gate: "DDM-D05"}
      - {id: "DDM-P3-T04", title: "Resolve the NASA GIBS VIIRS thermal-anomaly canary, which is never a confirmed fire or an all-clear", decision_gate: "DDM-D05"}
      - {id: "DDM-P3-T05", title: "Add selected-place mapped-fire evidence, where zero intersections is explicitly not an all-clear", decision_gate: "DDM-D05"}
      - {id: "DDM-P3-T06", title: "Review infrastructure exposure language so it claims no damage, service loss, or jurisdiction"}
      - {id: "DDM-P3-T07", title: "Evaluate incomplete volunteer-mapped distribution circuits, kept separate from federal transmission data", github_issues: [20]}
  - id: "DDM-P4"
    name: "ENSO observed-state product"
    goal: "Make ENSO answer one clear current-state question before adding forecast probabilities or more ocean imagery."
    tasks:
      - {id: "DDM-P4-T01", title: "Define the primary ENSO user question, which may not imply a deterministic local outcome", decision_gate: "DDM-D11"}
      - {id: "DDM-P4-T02", title: "Build an index-first ENSO card whose phase, continuity, companion index, and agreement are distinct"}
      - {id: "DDM-P4-T03", status: superseded, superseded_by: "DDM-P12-T03"}
      - {id: "DDM-P4-T04", title: "Prototype an offline Pacific Hovmoller artifact from an official OISST or ERSST source"}
      - {id: "DDM-P4-T05", title: "Resolve an official machine-readable probability source, restoring no scraping or image digitization", source: "12 FSPEC-11; 13 ENSOSCI-06", decision_gate: "DDM-D06"}
      - {id: "DDM-P4-T06", status: superseded, superseded_by: "DDM-P12-T02"}
  - id: "DDM-P5"
    name: "Smoke altitude and volume research"
    goal: "Test whether a bounded offline model artifact can add vertical smoke context without relabeling HMS, shipping a voxel engine, or treating one case study as an operational product. The scientific limits are in DDM-R05, DDM-R06, and DDM-R07."
    tasks:
      - {id: "DDM-P5-T01", title: "Resolve HRRR particulate semantics, variables, units, and vertical coordinates", decision_gate: "DDM-D08"}
      - {id: "DDM-P5-T02", title: "Select one HRRR pilot event, region, cycle, and stop criteria", decision_gate: "DDM-D08"}
      - {id: "DDM-P5-T03", title: "Build the offline HRRR subset pipeline with per-frame issuer, time, lead, and uncertainty"}
      - {id: "DDM-P5-T04", title: "Compare vertical curtain and sparse altitude-shell presentations, labeled model guidance"}
      - {id: "DDM-P5-T05", title: "Set and test smoke artifact budgets, keeping flat HMS available when artifacts are absent"}
      - {id: "DDM-P5-T06", title: "Run one NEXRAD multi-variable case study, stopping if classification cannot support a claim", decision_gate: "DDM-D08"}
      - {id: "DDM-P5-T07", title: "Use historical vertical sources only for validation, extrapolating no current plume volume"}
  - id: "DDM-P6"
    name: "Field capability, coverage, and release readiness"
    goal: "Select one bounded reach or field outcome, strengthen measured delivery, and produce a verified public release."
    tasks:
      - {id: "DDM-P6-T01", title: "Select one field or coverage outcome, and only one, for implementation", decision_gate: "DDM-D09"}
      - {id: "DDM-P6-T02", title: "Implement the selected outcome with its source receipt, failure states, documentation, and tests"}
      - {id: "DDM-P6-T03", title: "Benchmark field-style static delivery locally, collecting no user telemetry"}
      - {id: "DDM-P6-T04", title: "Resolve PMTiles directory and archive-layout limits for deep archives", github_issues: [19]}
      - {id: "DDM-P6-T05", status: superseded, superseded_by: "DDM-P15-T01"}
      - {id: "DDM-P6-T06", title: "Complete release evidence: released commit, deployed marker, public notes, and rollback point agree"}

  # The 2026-09 product backlog. One phase per owner target.

  - id: "DDM-P7"
    name: "Impact Briefing: four hazards by three horizons"
    goal: "One briefing that answers Drought, Fire, Heat, and ENSO across current, near-term, and long-range for a selected place, each cell naming its issuer, valid window, and geography or reading unavailable."
    tasks:
      - id: "DDM-P7-T01"
        title: "Rename the briefing and enforce its declared source gates"
        source: "08 DOC-03; 02 IB-06, IB-10, IB-16, IB-17, IB-18, IB-20"
        status: done
        closed: "2026-09-01: popup, sidebar, deep-link, and shell surfaces say Impact briefing; the declared per-source policy cells are consulted; the module-failure list is built from the declared keys; the overlap engine reports a wholly malformed geometry."
      - id: "DDM-P7-T02"
        title: "Give the briefing one four-hazard by three-horizon structure"
        source: "02 IB-01, IB-06"
        effort: L
        needs_decision: "DR-012 (four hazard sections of three horizons, or three horizon sections of four hazard rows; 02 D2)"
        acceptance: "Every one of the twelve hazard-by-horizon cells renders either a sourced claim or a named unavailable state, and no cell inherits another hazard's issuer or clock."
      - id: "DDM-P7-T03"
        title: "Add the Fire near-term and long-range claims"
        source: "02 IB-02; 10 SCI-03; 12 FSPEC-05, FSPEC-06"
        effort: M
        needs_decision: "DR-022 (does Fire get a real forecast tier; 10 D-SCI-A, 12 D-12-A)"
        acceptance: "The Fire near-term and long-range cells each state one issuer's outlook with its valid window and geography, or read unavailable, and neither presents a static hazard raster as a forecast."
      - id: "DDM-P7-T04"
        title: "Replace the frozen long-range drought prose with the wired CPC service and its validity window"
        source: "02 IB-03; 14 DWH-05, DWH-06; 12 FSPEC-03"
        effort: M
        needs_decision: "DR-019 (adopt the CPC monthly and seasonal outlooks, which unfreezes the long-range drought prose; 10 D-SCI-B)"
        acceptance: "The drought current and long-range claims carry the validity dates their own queries return, and no claim shows a retrieval date in place of a product date."
      - id: "DDM-P7-T05"
        title: "Make the Heat claims independent of the map layer and add the seasonal horizon"
        source: "02 IB-05; 10 SCI-02; 12 FSPEC-07"
        effort: M
        needs_decision: "DR-014 (a row whose source does not cover the selection; 02 D4); DR-019 (adopt the CPC monthly and seasonal outlooks; 10 D-SCI-B)"
        acceptance: "The near-term heat claim states its evidence whether or not the HeatRisk layer is on, and the long-range heat cell cites the CPC seasonal outlook or reads unavailable."
      - id: "DDM-P7-T06"
        title: "Make the ENSO row honest outside the Pacific Northwest"
        source: "02 IB-04"
        effort: M
        needs_decision: "DR-014 (unavailable outside the Pacific Northwest, or a national ENSO state with the tilt prose removed; 02 D3)"
        acceptance: "A selection outside the Pacific Northwest never receives Pacific Northwest tilt prose, and whatever it does receive names the geography the statement covers."
  - id: "DDM-P8"
    name: "Forecast uniformity and time controls"
    goal: "Make the four hazard screens share one time grammar, one control silhouette, and horizons that mean what they say."
    tasks:
      - id: "DDM-P8-T01"
        title: "Repair the time controls that could disagree with the map"
        source: "04 TIME-04, TIME-06, TIME-10, TIME-12, TIME-13, TIME-14"
        status: done
        closed: "2026-09-01: the rail thumb reconciles after a failed step, an undated SST frame says so, the play loop looks one frame ahead, the BC stamp stops printing raw ISO, one visible horizon label table remains, and the SPI window is in the URL."
      - id: "DDM-P8-T02"
        title: "Give Fire and Extreme Heat a time bar"
        source: "04 TIME-01"
        effort: L
        acceptance: "Each of the four hazard screens shows a time control whose stamp names the issuer and the period the displayed surface covers, or states that the product is undated."
      - id: "DDM-P8-T03"
        title: "Make every horizon chip and every stamp honest and uniform across the four hazards"
        source: "04 TIME-02, TIME-04, TIME-05; 03 FIRE-06"
        effort: M
        needs_decision: "DR-017 (the chip when two horizons share one recipe; 04 D-1); DR-021 (outlook badge and jump-chip wording; 04 D-7); DR-037 (the on-map key for all four hazards or none; 06 D1)"
        acceptance: "A horizon a hazard cannot answer is absent or visibly disabled with its reason, and every hazard surface states its time in one grammar with its forecast register visually distinct from its observed register."
      - id: "DDM-P8-T04"
        title: "Make the drought near-term horizon a near-term product"
        source: "04 TIME-03; 12 3.2"
        effort: M
        needs_decision: "DR-016 (what near-term means across the four screens; 04 D-2)"
        acceptance: "The drought near-term horizon shows a product whose valid window matches the horizon label, or the label changes to the window the product actually covers."
      - id: "DDM-P8-T05"
        title: "Never leave a hazard surface blank across a horizon or day change"
        source: "04 TIME-07, TIME-15"
        effort: S
        acceptance: "A HeatRisk day change and a drought horizon change each keep a surface or an honest loading state on the map for the whole fetch."
      - id: "DDM-P8-T06"
        title: "Make the USDM weekly rail reachable from the Drought screen"
        source: "04 TIME-08"
        effort: M
        needs_decision: "DR-018 (does the weekly rail become Drought's current recipe, with the continental product demoted to context; 04 D-4)"
        acceptance: "The weekly rail is reachable without demoting the cluster to a custom state, and the continental product it replaces keeps its own issuer and legend wherever it still appears."
  - id: "DDM-P9"
    name: "Fire module and 3D"
    goal: "Finish the Fire module: an honest 3D entry, a legible hazard drape, live incident coverage, and station readings that are actually read."
    tasks:
      - id: "DDM-P9-T01"
        title: "Correct the 3D control vocabulary, pitch ceiling, and station ranking"
        source: "03 FIRE-12, FIRE-14, FIRE-17, FIRE-19"
        status: done
        closed: "2026-09-01: the 3D control speaks the six honest layer states, the pitch ceiling and coordinate destructuring are corrected, and nearest stations carry a distance ceiling and an honest absence."
      - id: "DDM-P9-T02"
        title: "Gate the 3D scene on capability, not width alone"
        source: "03 FIRE-01"
        effort: M
        needs_decision: "DR-025 (tablet and phone 3D policy, and fire3d in the URL; 03 D3)"
        acceptance: "A device that cannot render the scene is told so instead of being admitted, and a lost graphics context inside the scene produces a named failure state rather than a frozen frame."
        verification: "npx playwright test --workers=1 tests/fire3d-mode.spec.ts tests/view-contracts.spec.ts"
      - id: "DDM-P9-T03"
        title: "Make the fire claim polygon-exact and add incident coverage"
        source: "03 FIRE-05, FIRE-08; 10 SCI-04; 12 FSPEC-10"
        effort: M
        needs_decision: "DR-024 (rebase the perimeter-evidence branch or fix the wording in place; 03 D2); DR-023 (WFIGS incident points beside perimeters; 10 D-SCI-E)"
        acceptance: "The briefing's fire sentence describes exactly the geometry it queried, and if incident points are adopted they are labeled as incidents without a mapped perimeter."
      - id: "DDM-P9-T04"
        title: "State the coverage of terrain shading and keep the hazard drape legible"
        source: "03 FIRE-02, FIRE-09, FIRE-11"
        effort: M
        needs_decision: "DR-009 through gate DDM-D01 (categorical drape resampling needs a 5.20 or later renderer)"
        acceptance: "Terrain shading names the extent of the elevation data it uses, and the hazard drape keeps perimeters legible above it without resampling categories into intermediate colors."
        verification: "npx playwright test --workers=1 tests/fire3d-mode.spec.ts tests/view-contracts.spec.ts"
      - id: "DDM-P9-T05"
        title: "Read the RAWS fire-weather values the issuer already serves"
        source: "03 FIRE-07; 12 FSPEC-09"
        effort: M
        acceptance: "A RAWS station popup shows the served relative humidity, wind, and fuel moisture with their units and observation time, or says the station reported none."
  - id: "DDM-P10"
    name: "Interface balance and motion"
    goal: "One visual grammar across the four hazard screens, a real tablet band, and motion that explains rather than decorates, on desktop, tablet, and phone."
    tasks:
      - id: "DDM-P10-T01"
        title: "Decide and build the tablet band"
        source: "06 UI-01, UI-02, UI-03"
        effort: L
        needs_decision: "DR-036 (does tablet get its own band, or stay a small desktop; 06 D2)"
        acceptance: "At 721, 768, 820, 900, and 1024 pixels in both orientations no control overlaps another, the dock keeps a usable width, and every interactive target meets the coarse-pointer minimum."
      - id: "DDM-P10-T02"
