schema_version: 1
roadmap_id: "ddm-forward-roadmap"
updated_on: "2026-08-28"
product:
  name: "Dynamic Drought Module"
  short_name: "DDM"
  package_version: "0.6.25"
  repository: "https://github.com/atniclimate/dynamic-drought-module"
  live_site: "https://atniclimate.github.io/dynamic-drought-module/"

purpose: >
  Define the durable development sequence, phase goals, software components,
  microtasks, dependencies, decision gates, and acceptance evidence for DDM.
  This file defines work; it does not duplicate live task status.

authority:
  owner_direction: >
    Current written owner direction, annotations, and direct corrections govern
    product intent for the requested slice.
  runtime_truth:
    - "src/config/layers.ts"
    - "src/config/urls.ts"
    - "src/state/"
    - "src/map/"
    - "src/ui/"
    - "tests/"
  design_doctrine: "docs/design/README.md"
  operational_status:
    system: "Asana"
    project_gid: "1216247186784838"
    rule: >
      Asana carries assignee, due date, and live completion state. Stable task
      IDs from this file are included in Asana task names and descriptions.
  execution_evidence:
    - "GitHub issues and pull requests"
    - "ordinary Git history"
    - "docs/RELEASE_NOTES.md"
    - "successful validation workflows"
    - "the deployed application build marker"
  prohibited_tracking_fields:
    - "status"
    - "assignee"
    - "due_date"
    - "percent_complete"
  non_authority:
    - "Historical artifacts when they disagree with runtime or current owner direction"

plan_rules:
  - "Work on one bounded user-visible outcome at a time after prerequisite work."
  - "Do not infer authorization to deploy, tag, merge, or change an external service."
  - "Do not add a blended drought, fire, smoke, infrastructure, or climate severity score."
  - "Keep every issuer, clock, geography, limitation, legend, and uncertainty distinct."
  - "Preserve URL-as-state, embed operation, responsive controls, and static hosting."
  - "Keep non-trivial network work cancellable and time-bounded through body consumption."
  - "Preserve loading, live, live (partial), unavailable, no data, and zoom in to load."
  - "Do not redistribute Tribal, Treaty, or other sovereign-jurisdiction polygons."
  - "Describe agency Tribal and Treaty polygons as representations, not jurisdictional truth."
  - "Do not add proprietary providers, credentials, tracking, analytics, or telemetry."

component_catalog:
  release_delivery:
    paths:
      - ".github/workflows/"
      - "vite.config.ts"
      - "scripts/check-upstream-drift.mjs"
      - "workers/proxy/"
    concerns:
      - "GitHub Pages"
      - "Cloudflare Worker"
      - "build identity"
      - "CI evidence"
      - "range-safe static delivery"
  state_and_lifecycle:
    paths:
      - "src/state/"
      - "src/util/fetch.ts"
      - "src/config/layers.ts"
      - "src/types/layer.ts"
    concerns:
      - "URL state"
      - "activation and cancellation"
      - "status semantics"
      - "late-response protection"
  interface:
    paths:
      - "src/ui/"
      - "src/styles/app.css"
      - "src/config/presets.ts"
      - "src/config/clusters.ts"
    concerns:
      - "desktop, tablet, phone, and embed"
      - "keyboard and assistive technology"
      - "reduced motion"
      - "source and time receipts"
  map_and_visualization:
    paths:
      - "src/map/"
      - "src/layers/"
      - "src/config/palette.ts"
      - "src/config/wildfire-presentation.ts"
    concerns:
      - "MapLibre lifecycle"
      - "layer ordering"
      - "2D and 3D presentation"
      - "raster hierarchy"
      - "accessible legends"
  impact_and_place:
    paths:
      - "src/impact/"
      - "src/config/capability-matrix.ts"
      - "src/state/typed-place.ts"
    concerns:
      - "selected-place evidence"
      - "regional coverage"
      - "ENSO interpretation"
      - "resource routing"
  data_pipelines:
    paths:
      - "scripts/"
      - "public/data/"
    concerns:
      - "source vetting"
      - "static artifacts"
      - "PMTiles"
      - "snapshot provenance"
      - "artifact budgets"
  verification:
    paths:
      - "tests/"
      - "scripts/check-activation-budget.mjs"
      - "scripts/check-bundle-size.mjs"
    concerns:
      - "strict TypeScript"
      - "deterministic gate"
      - "targeted browser tests"
      - "serial release suite"
      - "live production probes"
  documentation:
    paths:
      - "README.md"
      - "DEVELOPER.md"
      - "ROADMAP.md"
      - "docs/"
      - "public/data/README.md"
    concerns:
      - "public behavior and source qualifications"
      - "planned scope and dependencies"
      - "maintainer and release evidence"

