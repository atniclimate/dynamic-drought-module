        request recent NOAA imagery only on explicit entry, and retain
        strategic-not-tactical guidance.
    - surface: mobile
      newest_intent: Map-first, compact, 44 pixel controls, one responsive response surface.
      donors:
        - wildfire/design/mobile-card-and-touch.md
        - wildfire/design/mobile-audit.md
      target_seam:
