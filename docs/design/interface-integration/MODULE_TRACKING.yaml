risks:
  - EOX exposes a public endpoint but no free-service availability guarantee; OSM fallback and visible failure copy are mandatory.
  - EOX 2016 is global historical context and can visually imply currency if its always-visible vintage line is clipped.
  - Donor scene and rail receipts validate standalone prototypes, not target integration.
  - Missing docs/URL_SCHEMA_POLICY.md increases reliance on source and tests as the URL authority.
  - WFIGS is a live external service; an unavailable or timed-out framing count must remain unavailable and cannot fall through to WHP.
  - WFIGS framing counts describe current mapped perimeters only, not every incident, and the retrieval clock is not an incident-observation clock.
  - The 2023 WHP artifact is static, approximate, and United States-only; Mexico and Canada correctly report no WHP coverage.
  - Natural Earth linework is generalized physical presentation geometry and must not be described as a state, province, Treaty, or sovereign-jurisdiction boundary.
  - The 200x600 embed remains intrinsically dense; compact attribution and dock containment are regression-tested at that floor.
  - Live NIFC field freshness semantics remain unverified, so no perimeter-recency claim or rim is authorized.
  - npm reported 5 known vulnerabilities during the accepted clean-clone install; this tracker makes no remediation or exploitability claim.
  - The final visual pass observed two bounded live NIFC perimeter timeouts; deterministic source fixtures passed, but upstream availability remains operational risk.

