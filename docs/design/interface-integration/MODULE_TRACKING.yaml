        code/geometry.mjs generated the banked silhouettes; code/receipts.json
        records 204 of 204 mainland regression points. Target adaptations and
        later URL/accessibility rulings outrank stale kit behavior.
  surface_matrix:
    - surface: shared-ground
      newest_intent: Firefly-darkened EOX Sentinel-2 cloudless 2016 mosaic.
      donors:
        - unified-interface/UNIFIED_INTERFACE_DESIGN_2026-08-09.md
        - wildfire/prototypes/wildfire-composite.html
      target_seam:
        - src/map/style.ts
        - src/map/init.ts
        - src/map/satellite.ts
        - src/state/basemap-store.ts
      parity: absent
      decision: adopt
      behavior: >-
        Use the 2016 EOX mosaic as historical shared ground, retain subdued OSM
        underneath as automatic fallback, and keep basemap=satellite exclusively
        for recent NOAA GeoColor. Always show vintage and attribution while EOX
        renders. Do not copy the regional donor tile cache.
      runtime_effect: One static raster source, one bounded boot probe, no backend.
      verification:
        - historical ground source, failure, and NOAA isolation tests
        - shared viewport visual comparison
    - surface: terrain-inspect
      newest_intent: Explicit PNW-only 3D inspect with deterministic exit.
      donors:
        - unified-interface/prototypes/unified-scene.html
        - wildfire/prototypes/terrain-fire-scene.html
      target_seam:
        - public/data/hillshade-dem-pnw.pmtiles
        - src/layers/hillshade.ts
        - src/map/init.ts
      parity: infrastructure-only
      decision: defer
      reason: >-
        Donor entry grammar and target selection ownership remain unresolved,
        and the prompt does not authorize opening the selected-fire engine.
        Existing top-down hillshade remains honest; no national terrain claim is
        made.
    - surface: layer-stack
      newest_intent: Deterministic ground, surface, event, reference, label order.
      donors:
        - unified-interface/UNIFIED_INTERFACE_DESIGN_2026-08-09.md
        - wildfire/design/design-options.md
      target_seam:
        - src/map/layer-order.ts
        - src/state/layer-controller.ts
      parity: partial
      decision: adapt
      behavior: >-
        Extend the centralized stack so every supported condition surface stays
        below event layers and sovereign-reference outlines, with state casing
        and labels reasserted independently of network completion order.
    - surface: title-and-mode
      newest_intent: One title and one committed four-mode selector.
      donors:
        - unified-interface/prototypes/navigation-rail.html
      target_seam:
        - index.html
        - src/ui/island/shell.tsx
        - src/state/cluster-service.ts
      parity: receiving-seam-only
      decision: adapt
      behavior: >-
        Keep target cluster and URL state, preserve all four working modes, and
        adopt the unified hierarchy and styling. Reject donor null-mode and
        disabled-mode prototype shortcuts.
    - surface: conditions-summary
      newest_intent: Product, status, time, coverage, and qualification directly below mode.
      donors:
        - unified-interface/UNIFIED_INTERFACE_DESIGN_2026-08-09.md
      target_seam:
        - src/state/display-summary.ts
        - src/ui/island/shell.tsx
        - src/ui/island/conditions-strip.tsx
      parity: partial
      decision: adapt
      behavior: >-
        Recompose the existing committed status summary as Conditions in view,
        keep the full six-state vocabulary, and colocate its active time context.
    - surface: regional-navigation
      newest_intent: Real target regions followed by ATNI-authored continental framings.
      donors:
        - unified-interface/prototypes/navigation-rail.html
        - s4-shell-kit/design/interaction-contract.md
      target_seam:
        - src/config/regions.ts
        - src/ui/sidebar.ts
        - src/ui/island/minimap.tsx
      parity: partial
      decision: adapt
      behavior: >-
        Add a compact shell door to the existing region command, keep region and
        framing URL semantics distinct, and preserve camera-only framing behavior.
    - surface: continental-minimap
      newest_intent: Mode-conditioned metrics only where a backed metric exists.
      donors:
        - unified-interface/prototypes/framings-data.js
        - s4-shell-kit/code/geometry.mjs
      target_seam:
        - src/ui/island/minimap.tsx
        - src/state/minimap-drought.ts
        - src/config/framing-shapes.ts
      parity: direct S4 geometry parity; unified metric parity absent
      decision: adapt
      behavior: >-
        Preserve target S4-derived geometry and behavior. Show the separately
        named monthly NADM summary only in Drought mode; use an explicit neutral
        navigation state for Wildfire, Heat, ENSO, and custom views.
    - surface: share-and-embed
      newest_intent: Share and embed actions in the unified rail.
      donors:
        - unified-interface/UNIFIED_INTERFACE_DESIGN_2026-08-09.md
      target_seam:
        - src/ui/share.ts
        - src/ui/island/shell.tsx
        - src/state/url.ts
      parity: map-control-only
      decision: adapt
      behavior: >-
        Add shell actions that reuse current share and URL contracts; preserve
        existing map controls and iframe behavior.
    - surface: selection-response
      newest_intent: Compact primary read with deeper source detail.
      donors:
        - wildfire/design/mobile-card-and-touch.md
        - unified-interface/prototypes/unified-scene.html
      target_seam:
