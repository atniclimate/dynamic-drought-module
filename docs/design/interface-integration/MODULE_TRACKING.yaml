  surface_matrix:
    - surface: shared-ground
      newest_intent: >-
        Firefly-darkened historical ground with recent satellite imagery on an
        explicit Wildfire, hazard-fire, fire-risk, or satellite action.
      donors:
        - unified-interface/UNIFIED_INTERFACE_DESIGN_2026-08-09.md
        - wildfire/prototypes/wildfire-composite.html
      target_seam:
        - src/map/style.ts
        - src/map/init.ts
        - src/map/satellite.ts
        - src/state/basemap-store.ts
      parity: completed-source-honest-adaptation
      decision: adopt
      behavior: >-
        Use the 2016 EOX mosaic as historical shared ground, retain subdued OSM
        underneath as automatic fallback, and keep basemap=satellite exclusively
        for recent NOAA GeoColor. An explicit Wildfire cluster, hazard-fire or
        fire-risk preset, or satellite choice requests recent imagery. Boot and
        deep-link restore do not consume an action preference that the user did
        not make. Always show source, vintage, and attribution for the raster
        that actually settles.
      runtime_effect: >-
        EOX and NOAA keep separate source, clock, label, and failure custody.
        Raster readiness settles from evidence for the requested source rather
        than unrelated global map-idle events.
      verification:
        - historical ground source, failure, and NOAA isolation tests
        - shared viewport visual comparison
    - surface: terrain-inspect
      newest_intent: Explicit PNW-only 3D inspect with deterministic exit.
      donors:
        - unified-interface/prototypes/unified-scene.html
        - wildfire/prototypes/terrain-fire-scene.html
      target_seam:
        - public/data/hillshade-dem-pnw.pmtiles
        - src/layers/hillshade.ts
        - src/map/init.ts
      parity: infrastructure-only
      decision: defer
      reason: >-
        Donor entry grammar and target selection ownership remain unresolved,
        and the prompt does not authorize opening the selected-fire engine.
        Existing top-down hillshade remains honest; no national terrain claim is
        made.
    - surface: layer-stack
      newest_intent: Deterministic ground, surface, event, reference, label order.
      donors:
        - unified-interface/UNIFIED_INTERFACE_DESIGN_2026-08-09.md
        - wildfire/design/design-options.md
      target_seam:
        - src/map/layer-order.ts
        - src/state/layer-controller.ts
      parity: partial
      decision: adapt
      behavior: >-
        Extend the centralized stack so every supported condition surface stays
        below event layers and sovereign-reference outlines, with state casing
        and labels reasserted independently of network completion order.
    - surface: title-and-mode
      newest_intent: One title and one committed four-mode selector.
      donors:
        - unified-interface/prototypes/navigation-rail.html
      target_seam:
        - index.html
        - src/ui/island/shell.tsx
        - src/state/cluster-service.ts
      parity: receiving-seam-only
      decision: adapt
      behavior: >-
        Keep target cluster and URL state, preserve all four working modes, and
        adopt the unified hierarchy and styling. Reject donor null-mode and
        disabled-mode prototype shortcuts.
    - surface: conditions-summary
      newest_intent: Product, status, time, coverage, and qualification directly below mode.
      donors:
        - unified-interface/UNIFIED_INTERFACE_DESIGN_2026-08-09.md
      target_seam:
        - src/state/display-summary.ts
        - src/ui/island/shell.tsx
        - src/ui/island/conditions-strip.tsx
      parity: partial
      decision: adapt
      behavior: >-
        Recompose the existing committed status summary as Conditions in view,
        keep the full six-state vocabulary, and colocate its active time context.
    - surface: regional-navigation
      newest_intent: >-
        Real target regions followed by ATNI-authored continental and ocean
        framings over recognizable physical linework.
      donors:
        - unified-interface/prototypes/navigation-rail.html
        - s4-shell-kit/design/interaction-contract.md
      target_seam:
        - src/config/regions.ts
        - src/config/oceans.ts
        - src/config/minimap-geometry.ts
        - src/ui/sidebar.ts
        - src/ui/island/minimap.tsx
      parity: completed-source-honest-adaptation
      decision: adapt
      behavior: >-
        Add a compact shell door to the existing region command, keep region,
        framing, and ocean URL semantics distinct, and preserve camera-only land
        framing behavior. Pacific, Arctic, and Atlantic are separate keyboard and
        pointer targets that enter ENSO with the matching ocean camera in one
        committed transaction.
    - surface: continental-minimap
      newest_intent: >-
        Natural Earth physical coastline and lake linework with mode-conditioned,
        source-backed Drought and Wildfire summaries.
      donors:
        - unified-interface/prototypes/framings-data.js
        - s4-shell-kit/code/geometry.mjs
      target_seam:
        - src/ui/island/minimap.tsx
        - src/state/minimap-drought.ts
        - src/state/minimap-wildfire.ts
        - src/config/framing-shapes.ts
        - src/config/minimap-geometry.ts
        - src/config/minimap-whp.ts
      parity: completed-source-honest-adaptation
      decision: adapt
      behavior: >-
        Clip the existing ATNI-authored framing hit areas to Natural Earth 1:50m
        physical land and draw major lakes without adding state, province, or
        sovereign-jurisdiction boundaries. In Drought mode, show the separately
        named monthly NADM mean-severity class and outline D1 through D4 share.
        In Wildfire mode, red requires a current mapped NIFC wildfire perimeter;
        otherwise static 2023 United States Forest Service WHP is orange only
        above 50 percent high or very high, and yellow only above 30 percent
        moderate or higher. Heat, ENSO land framings, and custom views remain
        explicitly neutral.
      runtime_effect: >-
        NADM summary work and nine count-only WFIGS framing queries are
        cancellable and time-bounded. WHP is a bundled United States-only static
        artifact and never stands in for a failed current-fire query.
    - surface: share-and-embed
      newest_intent: Share and embed actions in the unified rail.
      donors:
        - unified-interface/UNIFIED_INTERFACE_DESIGN_2026-08-09.md
      target_seam:
