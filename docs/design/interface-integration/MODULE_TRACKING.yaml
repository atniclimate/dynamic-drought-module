        and preflight. Its prototypes and receipts validate design studies, not
        production source wiring.
    - id: fire-module-kit
      root: C:/dev/dynamic-drought-module/docs/design/fire-module-kit
      status: incomplete-claimed-freeze
      authority: duplicate-index-only
      evidence: >-
