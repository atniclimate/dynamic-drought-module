        - src/map/interaction-coordinator.ts
      parity: architecture-ahead; visual parity absent
      decision: adapt
      behavior: >-
        Preserve the coordinated response foot and popup fallbacks; improve
        perimeter copy only from existing committed feature truth.
    - surface: drought
      newest_intent: Official colors with measured contrast compensation and literal absence copy.
      donors:
        - unified-interface/CONTRAST_REPORT_CU1_2026-08-09.md
        - unified-interface/prototypes/drought-contrast-pass.html
      target_seam:
        - src/layers/usdm.ts
        - src/config/palette.ts
        - src/ui/map-key.ts
        - src/ui/island/strip-metrics.ts
        - src/impact/fire-context.ts
