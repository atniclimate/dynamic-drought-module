risks:
  - EOX exposes a public endpoint but no free-service availability guarantee; OSM fallback and visible failure copy are mandatory.
  - EOX 2016 is global historical context and can visually imply currency if its always-visible vintage line is clipped.
  - Donor scene and rail receipts validate standalone prototypes, not target integration.
  - Missing docs/URL_SCHEMA_POLICY.md increases reliance on source and tests as the URL authority.
  - Live NIFC was unavailable in the before-state browser capture; deterministic fixtures must carry semantic tests.
  - The 200x600 embed remains intrinsically dense; compact attribution and dock containment are regression-tested at that floor.
  - Live NIFC field freshness semantics remain unverified, so no perimeter-recency claim or rim is authorized.

