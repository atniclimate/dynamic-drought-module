      decision: adapt
      behavior: >-
        Preserve official fills, add the measured D4 presentation rim, label it
        as contrast compensation, and replace maskless no-drought claims with
        bounded no-polygon wording.
    - surface: wildfire
      newest_intent: Quiet mapped wildfire perimeters, distinct prescribed fire, cool borderless smoke.
      donors:
        - wildfire/design/design-options.md
        - wildfire/design/smoke-spec.md
        - wildfire/prototypes/wildfire-composite.html
