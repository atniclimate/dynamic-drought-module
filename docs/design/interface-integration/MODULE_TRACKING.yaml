      behavior: >-
        Use only existing perimeter, plume, outlook, and WHP sources. Split RX,
        fix unknown smoke density, add source-honest keys, harden cancellation,
        and retain strategic-not-tactical guidance.
    - surface: mobile
      newest_intent: Map-first, compact, 44 pixel controls, one responsive response surface.
      donors:
        - wildfire/design/mobile-card-and-touch.md
        - wildfire/design/mobile-audit.md
      target_seam:
        - src/ui/mobile-sheet.ts
        - src/styles/app.css
      parity: target architecture ahead; visual true-up required
      decision: adapt
      behavior: Preserve the existing one-sheet system and reconcile shared map styling and keys.
    - surface: embed
