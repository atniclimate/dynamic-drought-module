  conflicts:
    - id: donor-preflight-claim
      resolution: Treat fire-module-kit as incomplete claimed freeze, not acceptance evidence.
    - id: url-policy-missing
      resolution: docs/URL_SCHEMA_POLICY.md is absent; src/state/url.ts and URL tests are runtime authority.
    - id: eox-versus-noaa
      resolution: >-
        Historical EOX ground and recent NOAA context keep separate source,
        clock, label, readiness, and failure custody. Wildfire, hazard-fire, and
        fire-risk request NOAA only when the user explicitly chooses them.
    - id: s4-all-token
      resolution: Target durable framing=all supersedes the kit rule that omitted the parameter.
    - id: no-scroll
      resolution: Target measured scroll fallback supersedes the infeasible donor no-scroll target.
    - id: provisional-fire-metric
      resolution: >-
        Reject donor point-incident counts and tint bins. The implemented metric
        instead counts current mapped WFIGS WF and CX perimeters, excludes RX,
        and uses the checked 2023 WHP artifact only when the current perimeter
        query succeeds with zero.
    - id: d4-color-drift
      resolution: Measured #f87171 1.5 pixel rim supersedes stale prototype #ff4d4d and #ad0000 values.
  selected_visual_target:
    - Shared firefly scene with explicit historical ground truth and OSM fallback.
    - One dark left rail ordered mode, Conditions in view, region, continental framing, time, and share actions.
    - Physical 1:50m continental coastline and lake linework, original ATNI-authored subregions, and three separate ocean actions.
    - NADM mean-severity framing fills and D1 through D4 outline shares with coverage qualifications.
    - Current mapped-fire-first Wildfire framing fills with static United States-only WHP fallback thresholds.
    - Official Drought palettes with a presentation-only D4 contrast rim.
    - Cool smoke, quiet wildfire perimeters, neutral prescribed-fire rings, and source-specific legends.
    - Existing mobile sheet, embed shell, URL, and response-foot architecture preserved.

sources:
  - id: eox-sentinel-2-cloudless-2016
    status: accepted-with-fallback
    endpoint: https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/{z}/{y}/{x}.jpg
    probe_tile: https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/4/5/2.jpg
    checked_at: "2026-08-10T01:51:04Z"
    result: >-
      HTTP 200 image/jpeg, 16399 bytes, reflected-or-exact CORS for the local
      app origin, seven-day cache, last-modified 2017-08-01.
    capabilities: >-
      HTTP 200 application/xml. Layer identifier s2cloudless_3857 is titled
      Sentinel-2 cloudless layer for 2016 by EOX, EPSG:3857 matrix sets g and
      GoogleMapsCompatible, image/jpeg, global WMTS pyramid.
    license: CC BY 4.0
    attribution: >-
      EOxCloudless by EOX IT Services GmbH (Contains modified Copernicus
      Sentinel data 2016).
    failure_behavior: Subdued OpenStreetMap remains underneath and a visible fallback notice replaces the vintage caption.
  - id: noaa-recent-geocolor
    status: accepted
    endpoint: https://satellitemaps.nesdis.noaa.gov/arcgis/rest/services/MERGEDGC_Last_24hr/ImageServer
    purpose: >-
      Recent bounded satellite context with a pinned frame and observation time;
      requested by explicit Wildfire, hazard-fire, fire-risk, or satellite actions.
    settlement: >-
      Readiness and degradation settle from target-source evidence, not a global
      map-idle event, so an unrelated source cannot clear or relabel the chip.
    relationship: >-
      This is recent visible imagery, not the smoke classification source. NOAA
      HMS plume polygons retain their own retrieval and observation context.
  - id: noaa-hms-smoke-plumes
    status: accepted-live
    endpoint: https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/NOAA_Satellite_Smoke_Detection_(v1)/FeatureServer/0
    purpose: >-
      Analyst-drawn GOES-East and GOES-West smoke plume polygons for the current
      and previous UTC day, co-activated with mapped fire perimeters.
    qualification: >-
      Light, Medium, Heavy, and unknown describe apparent smoke thickness, not
      ground-level air quality. The plume clock is independent of the selected
      NOAA GeoColor frame and NIFC perimeter retrieval.
  - id: osm-fallback
    status: preserved
    purpose: Open, reliable fallback ground and map reference.
  - id: donor-eox-cache
    status: rejected
    reason: Regional Washington/northern Oregon coverage at zoom 4 through 9 cannot back an app-wide ground claim.
  - id: donor-wfigs-points
    status: rejected
    reason: Design snapshot only; no validated production point or hotspot source is wired.
  - id: natural-earth-minimap-physical
    status: accepted-static-presentation
    product: Natural Earth 1:50m physical land and lakes, version 5.1.2
    purpose: >-
      Recognizable continental coastline and major-lake linework. The physical
      geometry clips ATNI-authored navigation framings and does not introduce
      state, province, Treaty, or sovereign-jurisdiction boundaries.
    provenance: >-
      Pinned land and lake GeoJSON downloads are SHA-256 verified by
      scripts/build-minimap-geometry.mjs and compiled into
      src/config/minimap-geometry.ts.
    processing: >-
      Simplified after Lambert azimuthal equal-area projection with a 12 km
      interval and keep-shapes, then filtered below 250 square kilometers for
      legible nav-scale islands.
    license: public domain
  - id: nadm-continental-monthly
    status: accepted-live-summary
    endpoint: https://www.ncei.noaa.gov/pub/data/nidis/geojson/na/nadm/NADM-current.geojson
    purpose: >-
      Monthly North American Drought Monitor mean-severity and D1 through D4
      share summaries for the nine ATNI-authored land framings.
    qualification: >-
      Latitude-weighted sampling is approximate. It distinguishes assessed none
      from no data, reports partial coverage, and discloses the Nunavut
      analysis-mask proxy.
    method: >-
      A 0.5 degree overview grid, refined to 0.05 degree for Hawaii, weights
      samples by cosine of latitude and rounds the ordinal mean to its nearest
      display class with exact half ties resolving less severe.
  - id: nifc-wfigs-current-interagency-perimeters
    status: accepted-live-count-summary
    endpoint: https://services3.arcgis.com/T4QMspbfLg3qTGWY/ArcGIS/rest/services/WFIGS_Interagency_Perimeters_Current/FeatureServer/0
    purpose: >-
      Nine count-only spatial queries determine whether each framing intersects
      at least one current mapped wildfire or incident-complex perimeter.
    qualification: >-
      The active-candidate filter admits WF and CX; RX does not qualify. Counts
      describe mapped perimeters, not all incidents, and retrieval time is not
      incident observation time. The nine-query feed refreshes five minutes
      after each completed request set.
  - id: usfs-whp-2023-minimap
    status: accepted-static-derived-artifact
    product: United States Forest Service Wildfire Hazard Potential 2023 classified, edition 4
    service: https://imagery.geoplatform.gov/iipp/rest/services/Fire_Aviation/USFS_EDW_RMRS_WildfireHazardPotentialClassified/ImageServer
    doi: 10.2737/RDS-2015-0047-4
    artifact_retrieved_at: "2026-08-10T06:06:40.385Z"
    purpose: >-
      United States-only strategic context when the current WFIGS query succeeds
      with zero mapped wildfire perimeters.
    thresholds: >-
      Orange requires more than 50 percent high or very high. Yellow requires
      more than 30 percent moderate or higher. Exact threshold values do not
      pass, and unavailable current-fire data never falls through to WHP.
    method: >-
      Nearest-neighbor samples use cosine-latitude area weights at 0.05 degree
      on the mainland and 0.01 degree for Hawaii; water is excluded from the
      classified-land denominator.
    qualification: Static strategic potential, not a forecast or current fire activity.

invariants:
  - No sovereign-jurisdiction geometry is added or redistributed.
  - Tribal and Treaty representation caveats remain intact and outlines stay above condition surfaces.
  - One MapLibre map and one exclusive condition surface remain authoritative.
  - URL-as-state, Back, reload, legacy links, embed=true, and iframe operation remain valid.
  - loading, live, live (partial), unavailable, no data, and zoom in to load remain distinct.
  - Non-trivial network work is cancellable, time-bounded, and late responses cannot revive torn-down state.
  - EOX historical imagery never stands in for recent NOAA imagery or a current hazard source.
  - A failed current WFIGS framing query never falls through to static WHP.
  - Ocean click targets are schematic ENSO navigation, not claims about ocean boundaries.
  - No hotspot feed, incident point feed, fire score, synthetic incident, or new selected-fire engine is added.
  - No MapLibre upgrade, Worker change, deployment, analytics, tracking, or version change occurs.
  - Repository-authored text contains no U+2014 em dash.

decisions:
  - id: DDM-UI-001
    decision: >-
      Graduate EOX 2016 directly with a bounded probe and OSM fallback; do not
      copy donor tiles. Settle raster state from evidence for the requested
      source rather than global map-idle state.
  - id: DDM-UI-002
    decision: >-
      Preserve basemap=satellite as recent NOAA; the default token may render
      historical EOX shared ground. Wildfire, hazard-fire, and fire-risk request
      NOAA only on an explicit user action, not during boot or URL restoration.
  - id: DDM-UI-003
    decision: Reuse the committed shell, cluster service, URL sync, and region command through named adapters.
  - id: DDM-UI-004
    decision: >-
      Drought receives a backed NADM mean-severity and outline-share summary.
      Wildfire receives a strict current-WFIGS-first summary with static WHP
      thresholds only after a successful zero count. Heat, ENSO land framings,
      and custom views remain explicitly neutral.
  - id: DDM-UI-005
    decision: Defer 3D terrain entry, point locators, pulse/glow, and recency rims pending a resolved entry/source contract.
  - id: DDM-UI-006
    decision: Split prescribed fire from wildfire within the existing WFIGS perimeter source.
  - id: DDM-UI-007
    decision: Render HMS density through one cool hue and opacity; unknown remains explicitly unclassified.
  - id: DDM-UI-008
    decision: >-
      Use pinned Natural Earth 1:50m physical land and lakes for presentation
      linework while preserving ATNI-authored subregions as the click geometry;
      do not add state or province boundaries.
  - id: DDM-UI-009
    decision: >-
      Make Pacific, Arctic, and Atlantic separate accessible controls. Each
      click commits ENSO plus its ocean camera and URL state in one transaction.
  - id: DDM-UI-010
    decision: >-
      A Wildfire minimap red state means at least one current mapped WFIGS WF or
      CX perimeter, not an incident total. Static WHP orange and yellow states
      are United States-only potential context and never imply current fire.
  - id: DDM-UI-011
    decision: >-
      Preserve HeatRisk sequence DOM, focus, and delegated click targets across
      redundant raster-status events while an identify read is pending or cached.

