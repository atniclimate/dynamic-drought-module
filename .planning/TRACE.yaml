  files_path_rule: "A task the scouts left with NO files may gain a non-src file (attached_by:
    path-rule:<key>) when the task text matches a declared rule AND a test actually reaches that
    file. It never overrides a scout."
  attachment_guards:
    rule_1_no_statement: An attachment is withheld when the task states NEITHER an acceptance nor a
      closed sentence. Such a task (the title-only stubs in phases P3 to P6) names no outcome a file
      could serve. A done task closing on a `closed` sentence is a valid target.
    rule_2_too_many: An attachment is withheld when one rule attaches more than 8 files to a single
      task. A rule that broad is matching an area, not a task.
    rule_3_superseded: A superseded task is never an attachment target. Scout ids are routed along
      superseded_by to the end of the chain before matching, and the hops are recorded in
      counts.supersession_reroutes. Cycles and successor ids that name no task are recorded in
      counts.supersession_problems and leave the id where it was.
    applies_to: every attachment rule, the scout included
    effect: "flagged, not written: the files appear in counts.flagged_attachments with their reasons,
      never in tasks[].files"
  rejected_rules: Rules tried and replaced are recorded in counts.rejected_rules with every attachment
    they WOULD have made, the way tests.json records selector_discarded_literals. Nothing from a
    rejected rule is written.
  tests: "Derived, not judged: a test is listed for a task when it reaches one of that task s files.
    via=import is a static import; via=path-ref is a literal repo path in the test text;
    via=symbol-ref is a uniquely-owned exported identifier; via=selector is a test id, CSS selector,
    accessible name, or URL parameter the file produces."
  test_roots: Resolution covers src/, workers/, scripts/ and public/, excluding node_modules,
    .wrangler, dist and .venv.
  evidence_lines: Normalised to path:line. Where a scout emitted a range (path:31-44), the first line
