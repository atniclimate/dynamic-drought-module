  DDM-P1-T04:
    title: Isolate core sidebar loading from optional search
    phase: DDM-P1
    status: open
    roadmap: docs/ROADMAP.yaml:135
    acceptance: A search chunk failure degrades search only, and a core control island can retry
      successfully after an initial chunk failure.
    verification: "verify:smoke  # repo default"
    files:
      - path: src/ui/island/bridge.ts
        owns: Framework-neutral synchronous store of layer checkbox intent that remains available before the
          island chunk loads, serving as the seam between eager controller and lazy Preact view
        acceptance_testable_here: false
        evidence_lines:
          - "src/ui/island/bridge.ts:5: The island rides a lazy chunk, but the layer controller
            needs its checkbox reads and writes to work from the first millisecond of boot
            (applyLayerSet checks each URL-named row's box before the island has mounted). This
            module is that seam."
          - "src/ui/island/bridge.ts:28: Record a layer row's checkbox intent. Called by the
            sidebar's view adapter and the island's own change handler, so both writers converge on
            one source of truth."
        attached_by: scout
      - path: src/ui/island/conditions-strip.tsx
        owns: Renders the conditions metrics strip showing drought, alerts, and fires tiles with live status
          reflections from map-rendered features, stale-data flags, and conditional display per
          layer on-state
        acceptance_testable_here: false
        evidence_lines:
          - "src/ui/island/conditions-strip.tsx:1: The conditions strip as a Preact island; the view
            half of the retired vanilla builder. Markup, strings, and data attributes are contract:
            tests/conditions-strip.spec.ts asserts the off-state wording, the tile order, and the
            stale flags."
          - "src/ui/island/conditions-strip.tsx:214: E1 deliverable: the off-state Alerts and Fires
            tiles retire. The strip keeps the drought reading and date line always, but the two
