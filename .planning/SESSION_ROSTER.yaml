    root_cause: "cross-drive move semantics"
    change: "use robocopy to copy the tree, then git worktree repair to fix the gitdir pointers. Do not reach for git worktree move."
  - date: "2026-09-07"
    model: null
    effort: null
    task: "keying the defect ledger"
    observed: "the EF id collision surfaced only at ledger-keying time: EF- was two independently numbered lists, not one"
    root_cause: >-
      02-impact-briefing.md:519 numbers EF-1..10 and 11-minimap-and-popups.md:433 numbers
      EF-1..7, and shipped source cites both by bare number
      (docs/ROADMAP.yaml:70-75). The id registry treated them as one scheme.
    change: >-
      Keyed as EF-IB-1..10 and EF-MM-1..7 in planning/qa/feature-errors.yaml, each carrying
      source: and original_id:. Match a source comment through original_id:, NEVER by the
      bare number. The src/ comments are untouched because each already names its report.
      The registry is a lower bound, not a closed set (docs/ROADMAP.yaml:76).
  - date: "2026-09-07"
    model: null
    effort: null
    task: "S01, writing tests/escape-html.test.mjs"
    observed: >-
      .claude/hooks/ddm-guard-edit.py blocked a Write for hard rule 9 (U+2014) on a line
      that held no em dash, only a CJK passthrough case.
    root_cause: >-
      The hook's em-dash scan decodes the file bytes as cp1252, so any UTF-8 character
      whose encoding contains the byte 0x97 (CJK U+65E5 among others; the glyph itself
      cannot be written into this file for the same reason) false-positives as U+2014.
    change: >-
      One test case dropped; the Latin-diacritic cases still cover non-ASCII passthrough.
      Fix belongs in the hook's source draft (decode as UTF-8), not in the tests.

