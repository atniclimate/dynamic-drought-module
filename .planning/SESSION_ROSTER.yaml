  fable_note: "No session on this roster is T4. Every ordered task carries an acceptance sentence and either a decided gate or a named undecided one, so no path is genuinely unknown. Fable is not assigned."

  switching_rules:                      # references/roster.md, failure modes table
    skipped_a_file_test_or_step: "raise effort one notch. Do not change model."
    wrong_with_full_context_and_a_clear_plan: "change model, next one up. Do not raise effort."
    order_of_repair: "fix context first, then effort, then model. Most model-is-bad incidents are context pollution."
    two_failed_corrections: "/clear. Write the handover FIRST, then restate the problem leading with the fact the model kept missing, and load only the needed file ranges."
    prompting_5_series: "roles, not scaffolding. Outcome plus scope fence. Remove double-check-your-work instructions: they cause over-verification with no quality gain."

  completion_rule: "No completion claim without the pasted output of the session's assigned gate."
  compaction_rule: "/clear after two failed corrections; write the handover first."

  agents:                               # .claude/agents/*.md, frontmatter set by this session
    roster:
    - { name: ddm-fix-worker,          model: claude-sonnet-5,  effort: high, tools: "Read, Edit, Write, Grep, Glob, Bash",        role: execute }
    - { name: ddm-forecast-wirer,      model: claude-sonnet-5,  effort: high, tools: "Read, Edit, Write, Grep, Glob, Bash",        role: execute }
    - { name: ddm-frontend-specialist, model: claude-sonnet-5,  effort: high, tools: "Read, Edit, Write, Grep, Glob, Bash, Skill", role: execute }
    - { name: ddm-science-verifier,    model: claude-sonnet-5,  effort: high, tools: "Read, Grep, Glob, WebFetch, WebSearch",      role: "READ-ONLY VERIFIER, the only one" }
    - { name: ddm-worker-steward,      model: claude-haiku-4-5, effort: null, tools: "Read, Grep, Glob, Bash, WebFetch",           role: "scout/probe. Keeps Bash for its curl probes, so it is deliberately NOT the read-only verifier." }
    changes_made: "All five were model: opus with no effort. Bash was removed from ddm-science-verifier to make it the single read-only verifier. No body text was edited."
    body_frontmatter_conflict:
      agent: ddm-science-verifier
      quoted_line: ".claude/agents/ddm-science-verifier.md:9-11  \"You verify that what this application tells the public matches what the issuing agency actually published. You are READ-ONLY: you never edit `src/`, never edit a spec, never mutate anything outside a report file the skill that invoked you names.\""
